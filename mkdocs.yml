# Site config for the PUBLIC documentation site, built by Zensical (which reads
# mkdocs.yml as-is; the file name is MkDocs' heritage, not a dependency).
#
# This builds the whole docs/ tree — everything under it is published, ordered
# by `nav` below. Internal-only material (agent instructions, dated
# investigation handoffs, superpowers plans, the code-health plan) lives in
# docs-internal/ at the repository root instead, which is never built or synced.
#
# Two commands matter:
#   pixi run -e docs docs-serve   — live preview on :8000
#   pixi run -e docs docs-build   — strict build; CI runs this to fail on broken
#                                   internal links (see .github/workflows/ci.yaml)
#
# `zensical build --strict` fails on a broken link or anchor with no
# `validation:` block here (verified 2026-10-01 with broken-link and
# broken-anchor probes). It does not fail on a page missing from `nav`;
# tests/test_docs_boundary.py checks that.

site_name: CloudPipe
site_description: >-
  Neuroimaging preprocessing pipeline for the ABCD Study — registration and
  functional preprocessing on Kubernetes, producing MNI-space BOLD with confounds.
site_url: https://jrussell9000.github.io/cloudpipe/
repo_url: https://github.com/jrussell9000/cloudpipe
repo_name: jrussell9000/cloudpipe
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    # Section landing pages: a section's README.md becomes its index rather
    # than appearing twice in the sidebar.
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  # These docs are authored to be read on GitHub first, and their in-page links
  # use GitHub's anchor slugs — which differ from MkDocs' default. GitHub renders
  # "## `FuncQC` — per BOLD run" as #funcqc--per-bold-run (em dash becomes a
  # DOUBLE hyphen); MkDocs' default slugifier collapses it to a single one, so
  # every such link 404s on the site while working fine on GitHub.
  #
  # pymdownx's slugify with case="lower" reproduces GitHub's algorithm, so one
  # setting fixes 14 links at once and keeps both renderings valid. Prefer this
  # over rewriting the links: hand-editing them would fix the site and break
  # GitHub, and every new doc would reintroduce the problem.
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

# There is deliberately no `exclude_docs`. Everything under docs/ is meant to be
# published; internal material lives in docs-internal/ at the repository root,
# which is outside docs_dir and never synced (docs-internal/README.md). A list
# of exclusions is a boundary only for generators that honour it — Zensical does
# not — whereas a directory is a boundary for all of them.
# tests/test_docs_boundary.py fails if an internal path reappears under docs/.

# Curated structure. Order is deliberate: a newcomer reads top to bottom (what
# it is -> how to run it -> what the science is -> how it is built -> how to
# operate it). The Decisions section is gone for now: the ADRs moved to
# docs-internal/decisions/ on 2026-10-01 and are not published.
nav:
  - Home: index.md

  - Pipelines:
      - pipelines.md
      - argo-workflows.md
      - images.md

  - Methods & QC:
      - nmi-interpretation.md
      - observability.md
      - metrics_data_dictionary.md
      - how-to-timeframe-metrics-dataframe.md
      - anatomical-stats.md

  - Infrastructure:
      - architecture.md
      - infrastructure.md
      - gitops.md
      - pre-baked-amis.md
      - data-ingress.md
      - globus-prerequisites.md
      - globus.md
      - globus-setup.md
      - globus-contract.md

  - Operations:
      - operations.md
