name: cloudpipe-queue-manager
prefect-version: "3.x"

# Deploy with
#
#   PREFECT_API_URL=https://prefect.<your-domain>/api pixi run prefect-deploy
#
# and NEVER with a bare `prefect deploy --all`. Every deployment value here — the
# data bucket, the metrics bucket and the private registry — is a
# `{{ $CLOUDPIPE_* }}` placeholder, and prefect/deploy.sh is what fills them from
# the cloudpipe-config ConfigMap Terraform writes (the same one the Argo
# WorkflowTemplates read). Prefect resolves a placeholder ONCE, at deploy time,
# and stores the result as a plain literal; an unset one logs a WARNING and
# stores "". So a bare deploy succeeds and registers an image of
# `/cloudpipe/cloudpipe-flow-runner:latest` and an empty bucket, and nothing fails
# until the next run. deploy.sh refuses an empty value before deploying and reads
# every deployment back from the server afterwards.
#
# The region is not here at all: EKS Pod Identity injects AWS_REGION into every
# pod on the prefect-worker service account, and flows/lib/config.py reads it.
#
# ⚠️ EDITING THIS FILE CHANGES NOTHING BY ITSELF. Prefect stores a deployment's
# parameters and job_variables server-side and only re-reads this file on an
# explicit deploy, so `git diff` looks clean while the server serves the old
# values. Check the server, not the diff — deploy.sh's read-back does exactly that.
#
# `:latest` (with `image_pull_policy: Always`) is intentional and is how a rebuild
# reaches the runner without a redeploy. It is also the one workload that a future
# Kyverno require-digest policy (finding H6) would reject — see the note in
# tools/nist-800-171-compliance-todo.md under C3 before enforcing that cluster-wide.

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect

deployments:
  - name: cloudpipe-queue-manager
    entrypoint: ./flows/cloudpipe_queue_manager.py:cloudpipe_queue_manager
    work_pool:
      name: cloudpipe-k8s-pool
      job_variables:
        namespace: prefect
        service_account_name: prefect-worker
        image: "{{ $CLOUDPIPE_ECR_REGISTRY }}/cloudpipe/cloudpipe-flow-runner:latest"
        image_pull_policy: Always
        finished_job_ttl: 60
    schedules: []
    parameters:
      subjects_file: "s3://{{ $CLOUDPIPE_BUCKET }}/subjects.csv"
      start_index: 0

  - name: first-level-queue-manager
    entrypoint: ./flows/first_level_queue_manager.py:first_level_queue_manager
    work_pool:
      name: cloudpipe-k8s-pool
      job_variables:
        namespace: prefect
        service_account_name: prefect-worker
        image: "{{ $CLOUDPIPE_ECR_REGISTRY }}/cloudpipe/cloudpipe-flow-runner:latest"
        image_pull_policy: Always
        finished_job_ttl: 60
    schedules: []
    parameters:
      # No subjects_file: the flow walks every subject with func output. The stored
      # default used to be first-level-subjects.csv, ABCC fMRIPrep's coverage, which
      # left 117 of cloudpipe's subjects out. Pass a list only for a deliberate subset.
      bucket: "{{ $CLOUDPIPE_BUCKET }}"
      start_index: 0

  - name: kubecost-cost-scraper
    entrypoint: ./flows/cost_scraper.py:kubecost_cost_scraper
    work_pool:
      name: cloudpipe-k8s-pool
      job_variables:
        namespace: prefect
        service_account_name: prefect-worker
        image: "{{ $CLOUDPIPE_ECR_REGISTRY }}/cloudpipe/cloudpipe-flow-runner:latest"
        image_pull_policy: Always
        finished_job_ttl: 60
    schedules:
      - cron: "0 2 * * *"
        timezone: UTC
        active: true
    parameters:
      # Metrics run of record — the dedicated versioned bucket, NOT the data
      # bucket. Cost records must land where the Glue `costs` table reads
      # (<metrics bucket>/metrics/costs/); pointing this at the data bucket
      # silently orphans them from Athena. See terraform/modules/stack/metrics_bucket.tf.
      bucket: "{{ $CLOUDPIPE_METRICS_BUCKET }}"
      pipeline: cloudpipe_minproc

  # The same flow, re-reading YESTERDAY at 12:00 and again at 22:00 UTC, so each
  # pod's instance is proven from complete data (#1060). At 02:00 Kubecost has
  # not finished building the day's node assets and labels: on 2026-11-07 the
  # 02:00 read proved the instance of 7,849 of 10,358 pods and a later read
  # 10,032. Every one an earlier read proved, the later read proved to be the
  # same instance, and each read carries the stored record's instances forward,
  # so every pass only adds.
  #
  # 12:00 alone was not late enough on a busy day: on 2026-11-13 the 12:00 read
  # of 11-12 proved the instance of 66% of its 7,881 production pods; the same
  # pods read at 16:45 proved 94%. The pod set did not change between reads.
  # (A raw read of the window also returns the reprocess audit's pods, 1,672 that
  # day, which route_workflows writes to the audit buckets.) 22:00 is 46 h after
  # the window opens, the latest that leaves margin inside Kubecost's 49 h of
  # hourly data (retention1h): the window's first hour expires at 01:00 the next
  # day, and past that reused hostnames merge and cannot be told apart (11-11
  # read at 64 h: 2,261 of its 5,816 production pods left). 12:00 stays as the
  # fallback if the 22:00 run fails.
  # The day stays scrape_age_days = 1. The settled re-scrape, the drift probe
  # and the gap detector are left to the 02:00 run.
  - name: kubecost-day1-refresh
    entrypoint: ./flows/cost_scraper.py:kubecost_cost_scraper
    work_pool:
      name: cloudpipe-k8s-pool
      job_variables:
        namespace: prefect
        service_account_name: prefect-worker
        image: "{{ $CLOUDPIPE_ECR_REGISTRY }}/cloudpipe/cloudpipe-flow-runner:latest"
        image_pull_policy: Always
        finished_job_ttl: 60
    schedules:
      - cron: "0 12 * * *"
        timezone: UTC
        active: true
      - cron: "0 22 * * *"
        timezone: UTC
        active: true
    parameters:
      bucket: "{{ $CLOUDPIPE_METRICS_BUCKET }}"
      pipeline: cloudpipe_minproc
      settled_rescrape: false
      drift_probe_lookback_days: 0
      detect_gaps: false

  - name: metrics-compactor
    entrypoint: ./flows/metrics_compactor_flow.py:metrics_compactor
    work_pool:
      name: cloudpipe-k8s-pool
      job_variables:
        namespace: prefect
        service_account_name: prefect-worker
        image: "{{ $CLOUDPIPE_ECR_REGISTRY }}/cloudpipe/cloudpipe-flow-runner:latest"
        image_pull_policy: Always
        finished_job_ttl: 60
    schedules:
      # 30 min after kubecost-cost-scraper's 0 2 * * * run, so yesterday's
      # costs records exist before that day is ever compacted.
      - cron: "30 2 * * *"
        timezone: UTC
        active: true
      # And 30 min after each kubecost-day1-refresh run (0 12 and 0 22), so the
      # Parquet copy of yesterday does not keep an earlier read for a day.
      - cron: "30 12 * * *"
        timezone: UTC
        active: true
      - cron: "30 22 * * *"
        timezone: UTC
        active: true
    parameters:
      bucket: "{{ $CLOUDPIPE_METRICS_BUCKET }}"
      # Must stay > kubecost_scraper.SETTLED_AGE_DAYS (3). The 02:00 scrape
      # re-scrapes the report-date 3 days back with reconciled costs; anchored
      # on yesterday, a lookback of 4 re-compacts dt=today-4..today-1 and so
      # covers it. At lookback_days: 1 the Parquet copy of that day would keep
      # the unreconciled day+1 numbers forever while the raw JSON held settled
      # ones, and `costs(compacted=True)` reads Parquet for every closed day.
      # Compaction is idempotent, so the extra days cost only S3 reads (plus a
      # Put per orphan schema_version= partition it reconciles away — see #180;
      # a version bump inside this window is exactly what strands one).
      lookback_days: 4
