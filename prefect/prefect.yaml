name: cloudpipe-queue-manager
prefect-version: "3.x"

# The `image:` refs below point at PRIVATE ECR
# (<YOUR_AWS_ACCOUNT_ID>.dkr.ecr.<YOUR_AWS_REGION>.amazonaws.com), repointed 2026-08-17 off
# `public.ecr.aws/l9e7l1h1/`. This is Step 6 of
# handoffs/ecr-private-registry-migration.md, and it closes assessment finding N5
# (the flow runner was the last consumer still pulling from the public gallery —
# unpinned AND outside the Inspector scanning configuration, so the RA-5 "all
# images are continuously scanned" claim did not hold for it).
#
# ⚠️ EDITING THIS FILE CHANGES NOTHING BY ITSELF. Prefect stores
# `job_variables.image` server-side per deployment and only re-reads it on an
# explicit deploy. Until someone runs
#
#   cd prefect && PREFECT_API_URL=https://prefect.<YOUR_DOMAIN>/api \
#     prefect deploy --all
#
# the live flow runner keeps pulling the OLD image and `git diff` looks clean.
# build-prefect-flow-runner.yaml prints a reminder to the step summary, but a
# printed warning is not an enforcement point.
#
# That was verified rather than assumed: `prefect deployment inspect` still
# reported the public image after this file was committed. The deploy was then
# run 2026-08-17 and all four deployments now store the private ref, so file and
# server agree AS OF THAT DATE ONLY. The next edit to this file re-opens the gap
# — check the server, not the diff:
#
#   prefect deployment inspect <name>/<name> | grep -A1 "'image':"
#
# The registry literal is hand-maintained in three places — here,
# .github/workflows/build-prefect-flow-runner.yaml (`IMAGE`), and
# images/prefect-flow-runner/build.sh. Nothing keeps them in sync.
#
# `:latest` (with `image_pull_policy: Always`) is intentional and is how a rebuild
# reaches the runner without a redeploy. It is also the one workload that a future
# Kyverno require-digest policy (finding H6) would reject — see the note in
# tools/nist-800-171-compliance-todo.md under C3 before enforcing that cluster-wide.

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect

deployments:
  - name: cloudpipe-queue-manager
    entrypoint: ./flows/cloudpipe_queue_manager.py:cloudpipe_queue_manager
    work_pool:
      name: cloudpipe-k8s-pool
      job_variables:
        namespace: prefect
        service_account_name: prefect-worker
        image: <YOUR_AWS_ACCOUNT_ID>.dkr.ecr.<YOUR_AWS_REGION>.amazonaws.com/cloudpipe/cloudpipe-flow-runner:latest
        image_pull_policy: Always
        finished_job_ttl: 60
    schedules: []
    parameters:
      subjects_file: s3://<YOUR_S3_BUCKET>/subjects.csv
      start_index: 0

  - name: first-level-queue-manager
    entrypoint: ./flows/first_level_queue_manager.py:first_level_queue_manager
    work_pool:
      name: cloudpipe-k8s-pool
      job_variables:
        namespace: prefect
        service_account_name: prefect-worker
        image: <YOUR_AWS_ACCOUNT_ID>.dkr.ecr.<YOUR_AWS_REGION>.amazonaws.com/cloudpipe/cloudpipe-flow-runner:latest
        image_pull_policy: Always
        finished_job_ttl: 60
    schedules: []
    parameters:
      subjects_file: s3://<YOUR_S3_BUCKET>/first-level-subjects.csv
      start_index: 0

  - name: kubecost-cost-scraper
    entrypoint: ./flows/cost_scraper.py:kubecost_cost_scraper
    work_pool:
      name: cloudpipe-k8s-pool
      job_variables:
        namespace: prefect
        service_account_name: prefect-worker
        image: <YOUR_AWS_ACCOUNT_ID>.dkr.ecr.<YOUR_AWS_REGION>.amazonaws.com/cloudpipe/cloudpipe-flow-runner:latest
        image_pull_policy: Always
        finished_job_ttl: 60
    schedules:
      - cron: "0 2 * * *"
        timezone: UTC
        active: true
    parameters:
      # Metrics run of record — the dedicated versioned bucket, NOT the <YOUR_S3_BUCKET>
      # data bucket. Cost records must land where the Glue `costs` table reads
      # (cloudpipe-metrics/metrics/costs/); pointing this at <YOUR_S3_BUCKET> silently
      # orphans them from Athena. See terraform/metrics_bucket.tf.
      bucket: cloudpipe-metrics
      region: <YOUR_AWS_REGION>
      pipeline: cloudpipe_minproc

  - name: metrics-compactor
    entrypoint: ./flows/metrics_compactor_flow.py:metrics_compactor
    work_pool:
      name: cloudpipe-k8s-pool
      job_variables:
        namespace: prefect
        service_account_name: prefect-worker
        image: <YOUR_AWS_ACCOUNT_ID>.dkr.ecr.<YOUR_AWS_REGION>.amazonaws.com/cloudpipe/cloudpipe-flow-runner:latest
        image_pull_policy: Always
        finished_job_ttl: 60
    schedules:
      # 30 min after kubecost-cost-scraper's 0 2 * * * run, so yesterday's
      # costs records exist before that day is ever compacted.
      - cron: "30 2 * * *"
        timezone: UTC
        active: true
    parameters:
      bucket: cloudpipe-metrics
      region: <YOUR_AWS_REGION>
      # Must stay > kubecost_scraper.SETTLED_AGE_DAYS (3). The 02:00 scrape
      # re-scrapes the report-date 3 days back with reconciled costs; anchored
      # on yesterday, a lookback of 4 re-compacts dt=today-4..today-1 and so
      # covers it. At lookback_days: 1 the Parquet copy of that day would keep
      # the unreconciled day+1 numbers forever while the raw JSON held settled
      # ones, and `costs(compacted=True)` reads Parquet for every closed day.
      # Compaction is idempotent, so the extra days cost only S3 reads (plus a
      # Put per orphan schema_version= partition it reconciles away — see #180;
      # a version bump inside this window is exactly what strands one).
      lookback_days: 4
