# Reads globus/refresh-token from external-secrets-clusterstore.
#
# This referenced the separate `aws-secrets-manager` store until #637. That
# store was the only reason it survived — it was documented as unused and
# proposed for deletion, and this ExternalSecret was its one consumer. Both
# stores resolved to the same thing: the same `service: SecretsManager`, the
# same deployment region, and no auth block on either, so both went through the
# external-secrets controller's own Pod Identity. Repointing changes nothing
# about how this secret is fetched; it removes the second store's reason to
# exist.
#
# Two preconditions, both already true:
#   * the scoped IAM policy grants secret:globus/refresh-token-* (#637), so the
#     controller can still read this key;
#   * external-secrets-clusterstore's spec.conditions include argo-workflows,
#     so this namespace may reference it.
#
# The store deletion is a SEPARATE change that must land after this one is
# syncing. Deleting it first would break this secret quietly — ESO keeps
# serving the last synced Secret and reports the failure only on status.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: globus-credentials
  namespace: argo-workflows
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: external-secrets-clusterstore
    kind: ClusterSecretStore
  target:
    name: globus-credentials
    creationPolicy: Owner
  # Every top-level field of the secret, under its own name:
  #   native-app-client-id, refresh-token  — the https step's Transfer API
  #                                          listing;
  #   https-refresh-token                  — the https step's copy. Present only
  #                                          when the login was given a
  #                                          source_collection_id
  #                                          (openspec add-https-ingress-mode, task 6.0).
  # The name `globus-credentials` is kept although the Globus host is retired
  # (openspec retire-globus-host): the tokens are still Globus Auth tokens.
  # `dataFrom.extract`, not one `data` entry per key. A `data` entry whose
  # property is absent fails the WHOLE sync, so a login that granted no HTTPS
  # token would also stop a fresh transfer token from reaching the cluster, and
  # the Secret would keep serving the stale one. The https step reads its key
  # as optional and refuses (exit 78) without it.
  dataFrom:
    - extract:
        key: globus/refresh-token
