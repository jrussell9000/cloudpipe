apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudpipe-semaphores
  namespace: argo-workflows
data:
  # Maximum concurrent ingress-mode=https copies (each runs rclone with
  # `--transfers 8`, so 8 here is at most 64 GETs on the NBDC source). Bound by
  # the source, not by anything of ours: its HTTP 500s are load-dependent. In
  # wave 1 (2026-10-21), on the code of the time, 8 gave 40.7% of requests
  # answered 500 and 109 subjects/h; 4 gave 13.6% and 112 subjects/h. That
  # predates `--http-no-head` (#855, half the requests per file) and coincided
  # with MSI's Globus node updates; from 2026-10-23 on, 4 saw only 0.1-0.2% of
  # requests answered 500. Raised back to 8 on 2026-10-31 (operator decision,
  # without asking MSI first). If the 500 rate climbs
  # (data/reprocess/ingress_window_stats.py), drop back to 4 and write to MSI
  # (globus-admin@msi.umn.edu). Lowering it is always safe.
  https-transfer: "8"
