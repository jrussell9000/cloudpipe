apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudpipe-semaphores
  namespace: argo-workflows
data:
  # Maximum concurrent ingress-mode=https copies (each runs rclone with
  # `--transfers 8`, so 4 here is at most 32 GETs on the NBDC source). Bound by
  # the source, not by anything of ours: its HTTP 500s are load-dependent. Measured in wave 1 (2026-10-21) on the same code, 8
  # gave 40.7% of requests answered 500 and 109 subjects/h; 4 gave 13.6% and
  # 112 subjects/h. At 8 the rejected requests ate the extra slots. Do not raise
  # it without the source operators' agreement (MSI, globus-admin@msi.umn.edu)
  # and a measured step; lowering it is always safe.
  https-transfer: "4"
