apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: fast-tmpl
  namespace: argo-workflows
spec:

  retryStrategy:
    # Sized for spot churn: gpu-nodepool and cpu-heavy-nodepool are spot-only by
    # design, so consecutive reclaims on one long step are routine (2 back-to-back
    # observed 2026-08-03). At limit 3, four in a row lose the subject outright.
    # See issue #115.
    limit: "8"
    retryPolicy: Always
    # Infrastructure codes only. 64/143 = executor / SIGTERM on node teardown,
    # never emitted by our scripts. 75 = EX_TEMPFAIL, the truncated-surface guard
    # below. 137 is deliberately absent: a real OOMKill here is deterministic
    # (#120, #129, #134 each needed a config change, not a retry), so retrying it
    # only burns the enlarged budget on an identical failure.
    # The codes are matched in the message too: a pod that dies in its init or wait
    # container never populates exitCode, so that arm alone is dead for the whole
    # artifact-staging class (#277). A missing artifact KEY is excluded, though:
    # its producer was skipped or failed, and a consumer retry cannot re-run the
    # producer. See the master template for the detail.
    #
    # An activeDeadlineSeconds kill is ALSO excluded, and that exclusion is what
    # makes the parcellation deadline below work at all. Verified with a probe
    # workflow on 2026-08-18 (argo lint cannot show this): when a template deadline
    # fires, the kubelet SIGTERMs the pod, so Argo records
    #     phase=Failed  exitCode=143
    #     message="Pod was active on the node longer than the specified deadline"
    # The 143 arm above therefore MATCHES a deadline kill. Without this exclusion a
    # 3h deadline would not bound anything — it would retry 8 times for 24h of burn,
    # strictly worse than the unbounded hang it was added to catch. A step that
    # blows a deadline sized at ~1.75x its observed maximum is deterministic, not
    # transient, so it must fail on the first occurrence.
    expression: '(lastRetry.message matches "pod deleted|imminent node shutdown|exit code (64|75|143)" || lastRetry.exitCode in ["0", "64", "75", "143"]) && not (lastRetry.message matches "specified key does not exist|longer than the specified deadline")'
    backoff:
      duration: "1m"
      factor: "2"
      # cap bounds each individual delay (maxDuration would abort the retries
      # instead): 1+2+4+5+5+5+5+5 = 32m worst case, vs 7m at the old limit of 3.
      cap: "5m"

  artifactRepositoryRef:
    key: cloudpipe-artifacts

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000

  # ---------------------------------------------------------------------------
  # No shared EFS volume. Each step works in a private emptyDir at /work and
  # hands the FreeSurfer SUBJECTS_DIR to the next step through S3, per ADR 004.
  #
  # SUBJECTS_DIR is /work/subjects (NOT the image's /opt/freesurfer/subjects) so
  # nothing masks the image's own content and the working set lands on the node's
  # ephemeral storage, which is what `ephemeral-storage` requests actually govern.
  #
  # Intermediates go to scratch/{{workflow.name}}/anat/ and are reaped by an S3
  # lifecycle rule on the scratch/ prefix. They are not derivatives and must
  # never be read by anything outside this workflow.
  # ---------------------------------------------------------------------------

  templates:

  ##############################################
  # A. Template creation + segmentation
  #
  # long_prepare_template.sh then run_fastsurfer.sh --seg_only --base, in ONE
  # pod. Both are gpu-nodepool and strictly sequential, so splitting them cost a
  # second GPU node provision (slow, and the pool is thin — see
  # docs-internal/investigations/2026-07-17-gpu-nodepool-spot-scarcity-g6-enablement.md)
  # plus an S3 round-trip of the whole template, for no parallelism gain.
  #
  # long_prepare_template.sh handles single-timepoint subjects automatically —
  # it produces a within-subject template equivalent to a standard cross-sectional run.
  ##############################################

  - name: fastsurfer-template-build-template
    metadata:
      labels:
        cloudpipe.io/phase: anatomical
        cloudpipe.io/step: template-build
    inputs:
      parameters:
        - name: fastsurfer-command-string
        - name: seg-argstring
        - name: T1w_sessions
        # "cuda" (default) or "cpu" — the GPU spot-drought fallback (#373). See
        # the nodeSelector / podSpecPatch below and the master template's
        # fastsurfer-device parameter, which is where this comes from.
        - name: device
          value: cuda

      artifacts:
      - name: fslicense
        path: '/opt/freesurfer/.license'
        s3:
          endpoint: "s3.{{workflow.parameters.region}}.amazonaws.com"
          bucket: "{{workflow.parameters.bucket}}"
          region: "{{workflow.parameters.region}}"
          key: 'config/fslicense'

    outputs:
      artifacts:
      # The base template, pre-parcellation. Consumed by BOTH template
      # parcellation (B) and longitudinal segmentation (C) — the seg_only brain
      # model is all C needs, which is why C does not wait for B.
      - name: template-base
        path: '/work/subjects/{{workflow.parameters.subjID}}_template'
        archive:
          tar:
            # .mgz payloads are already gzip-compressed internally, so heavy
            # recompression burns CPU on both ends for very little size win.
            compressionLevel: 1
        s3:
          endpoint: "s3.{{workflow.parameters.region}}.amazonaws.com"
          bucket: "{{workflow.parameters.bucket}}"
          region: "{{workflow.parameters.region}}"
          key: 'scratch/{{workflow.name}}/anat/template-base.tar.gz'

    # DEVICE SWITCH (#373). device=cuda runs on a GPU pool exactly as the static
    # resources block below describes; the patch is a no-op there. device=cpu is
    # the spot-drought fallback: the pod moves to cpu-heavy-nodepool, `main` is
    # re-sized for CPU inference, and the GPU limit is ZEROED — a strategic-merge
    # patch cannot delete the key, and a 0-quantity extended resource is skipped
    # by the scheduler's fit check, so the pod lands on a node with no GPU at all
    # (verified on the fastsurfer-cpu-probe workflow, 2026-09-10).
    #
    # The static requests/limits below stay the source of truth for the GPU path:
    # gpu_templates() and every guard in tests/argo/test_gpu_step_resources.py
    # read THEM, and the cuda branch of this patch is pinned equal to them by
    # test. Values-only expressions on purpose: one JSON literal inside a single
    # expression cannot work, because Argo closes the tag at the first `}}` and a
    # nested JSON object ends in `}}`.
    #
    # cpu 7, not the 8 the issue sketched: cpu-heavy's cheapest instance (a
    # 2xlarge) has ~7.21 usable cores after daemonsets, so 7 fills one whole and
    # 8 would force a 4xlarge and hold it alone — the same stranding as the k=4
    # long-parcellation wart. OMP_NUM_THREADS tracks this via the downward API,
    # so `--threads` follows the reservation on both paths. Memory 8G: the model
    # and activations that live in ~3.7 GiB of VRAM on the GPU path live in RAM
    # here, on top of the ~0.9 GB host working set — cgroup memory.peak read
    # 3.96G on the probe, so 8G is ~2x headroom.
    #
    # MEASURED (fastsurfer-cpu-probe-lmkgg, 2026-09-10, one subject's ses-00A,
    # long-segmentation of one session on a c8i-flex.4xlarge spot node at 7
    # threads, against the same session's GPU output from cloudpipe-zztxz):
    #   wall 396 s vs 357 s on a 3-way time-sliced T4 — only ~10% slower, because
    #   inference is 172 s of it (35 s on the GPU) and the rest (bias field,
    #   cereb/hypothalamus nets, stats) is CPU-bound on both paths;
    #   Dice vs GPU: aparc.DKTatlas+aseg 0.9998 mean / 0.9979 min over 95 labels,
    #   voxel agreement 99.9985%; aseg 0.9998; cerebellum 0.99995; hypothalamus
    #   0.9992 — not bit-identical (CUDA vs CPU float kernels), far inside
    #   inter-run variance. Per session it is ~1.4x the GPU cost ($0.012 on a
    #   ~$0.11/hr 2xlarge vs $0.0085 on a $0.086/slice-hr T4 slice).
    # Manifest: scripts/manifests/fastsurfer-cpu-fallback-probe.yaml — a one-off
    # probe, so it stays in the internal repo and is not published (ADR 020).
    #
    # GPU POOLS (#374). On cuda the pod accepts BOTH GPU NodePools: gpu-nodepool
    # (preferred by weight, 3 slices/GPU) and gpu-dense-nodepool (the drought fallback,
    # 4 slices/GPU). A nodeSelector takes one value per key, hence the affinity. One
    # ternary per list entry, because an expression yields a string, not a list: on
    # cpu both entries collapse to cpu-heavy-nodepool, which the API accepts
    # (duplicate `In` values verified by server dry-run, 2026-09-14). Matching on the
    # pool name instead of a shared node label is deliberate — adding a label to an
    # existing NodePool's template drifts, and so replaces, every live node in it.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: karpenter.sh/nodepool
                  operator: In
                  values:
                    - "{{= inputs.parameters.device == 'cpu' ? 'cpu-heavy-nodepool' : 'gpu-nodepool' }}"
                    - "{{= inputs.parameters.device == 'cpu' ? 'cpu-heavy-nodepool' : 'gpu-dense-nodepool' }}"
    podSpecPatch: |
      containers:
        - name: main
          resources:
            requests:
              cpu: "{{= inputs.parameters.device == 'cpu' ? '7' : '1' }}"
              memory: "{{= inputs.parameters.device == 'cpu' ? '8G' : '2G' }}"
            limits:
              nvidia.com/gpu: "{{= inputs.parameters.device == 'cpu' ? '0' : '1' }}"

    # Lowest of the three GPU ranks (#370). This step STARTS new GPU demand —
    # every template it builds spawns a long-segmentation pod behind it — so
    # under scarcity it yields to both steps that retire work in flight. That
    # ordering is the whole lever: it caps work-in-progress instead of letting
    # 47 template-builds win slices ahead of 35 long-segmentations, as happened
    # on 2026-09-10. Like long-seg, it is not switched on `device`.
    # See gitops/apps/cluster-config/templates/gpu-priority-classes.yaml.
    priorityClassName: cloudpipe-gpu-template-build

    volumes:
      - name: work
        emptyDir: {}
      - name: t1w-inputs
        emptyDir: {}

    initContainers:
      - name: download-t1w-inputs
        image: "{{workflow.parameters.ecr-registry}}/cloudpipe/python@sha256:57d929e8ef38d3d481fef3372c29a9545f9b3056b7ace3c2b9a37bced2df3d01"
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: 512M
            cpu: '1'
        env:
          - name: SUBJECT_ID
            value: "{{workflow.parameters.subjID}}"
          - name: T1W_SESSIONS
            value: "{{inputs.parameters.T1w_sessions}}"
          - name: BUCKET
            value: "{{workflow.parameters.bucket}}"
        volumeMounts:
          - name: t1w-inputs
            mountPath: /home/nonroot
        command: [python]
        args:
          - -c
          - |
            import boto3, json, os
            from pathlib import Path

            s3 = boto3.client('s3')
            subj = os.environ['SUBJECT_ID']
            sessions = json.loads(os.environ['T1W_SESSIONS'])

            for ses in sessions:
                key = f"mmps_mproc/{subj}/{ses}/anat/{subj}_{ses}_run-01_T1w.nii.gz"
                dest = Path(f"/home/nonroot/{subj}/{ses}/anat/{subj}_{ses}_run-01_T1w.nii.gz")
                dest.parent.mkdir(parents=True, exist_ok=True)
                bucket = os.environ['BUCKET']
                print(f"Downloading s3://{bucket}/{key} -> {dest}", flush=True)
                s3.download_file(bucket, key, str(dest))

            print(f"Downloaded T1w files for {len(sessions)} session(s).", flush=True)

      # NOTE: there is deliberately no `download-fsaverage` init container here
      # (or on the other three FastSurfer steps) any more — see the fsaverage
      # link in the args block below and the assertion in
      # images/fastsurfer/Dockerfile (#372). An init container holds this pod's
      # GPU time-slice for its whole runtime, so 312 sequential S3 GETs cost
      # slice-hours, and this one fetched a tree FastSurfer never opened.

    container:
      image: "{{workflow.parameters.ecr-registry}}/cloudpipe/fastsurfer@sha256:fd118b11da90760bb8897936af1d3744184298e3be3a18b397af2a9fc9826b7c"
      imagePullPolicy: IfNotPresent
      volumeMounts:
      - name: work
        mountPath: /work
      - name: t1w-inputs
        mountPath: /home/nonroot

      env:
        - name: FS_LICENSE
          value: /opt/freesurfer/.license
        - name: SUBJECTS_DIR
          value: /work/subjects
        # Cap every thread pool at the CPU REQUEST, projected from the pod spec so the
        # resources block below is the single source of truth. `--threads 1` in the master
        # template reaches run_prediction.py only; PyTorch/OpenMP inside FastSurferCNN, and
        # mri_robust_template's own OpenMP region, still size their pools from the HOST core
        # count — this step measured cpu_efficiency 1.10 (2026-07-31 batch) while requesting
        # 1 core. Harmless only because the pods had landed on 32-vCPU g4dn.8xlarge nodes;
        # with gpu-nodepool now capped at xlarge/2xlarge, an uncapped pool would contend
        # with the co-tenant time-sliced pod on a 4-vCPU node.
        #
        # This is a CAP, not a raise — do NOT increase the cpu request to match observed
        # burst. cpu 1 is what lets two GPU pods share one g4dn.xlarge under time-slicing.
        #
        # Cannot be read from the cgroup instead: this container sets no CPU limit, so
        # /sys/fs/cgroup/cpu.max reads "max" and says nothing about the request.
        - name: OMP_NUM_THREADS
          valueFrom: &templateBuildCpuRequest
            resourceFieldRef:
              containerName: main   # Argo's name for the user container
              resource: requests.cpu
              divisor: "1"          # rounds UP to whole cores; keep cpu integral
        - name: MKL_NUM_THREADS
          valueFrom: *templateBuildCpuRequest
        - name: OPENBLAS_NUM_THREADS
          valueFrom: *templateBuildCpuRequest
        - name: ITK_GLOBAL_DEFAULT_NUMBER_OF_THREADS
          valueFrom: *templateBuildCpuRequest

      resources:
        requests:
          # 4G -> 2G. Measured average working set is ~0.86 GB (ram_efficiency 0.23 against
          # the old 4G request, 9 pods, 2026-07-31 batch). Kubecost's ram_efficiency is built
          # from AVERAGE usage, so this keeps >2x headroom over the mean rather than sizing
          # to it. Deliberately no memory LIMIT: the packing benefit comes entirely from the
          # request, and adding a ceiling where none existed would turn an underestimate into
          # an OOM on a step whose failure costs the whole anatomical phase.
          memory: 2G
          # 1 CPU to match `--threads 1` in the master template's command string.
          # Reduced from 2/2: at cpu 2 only ONE GPU pod fit a g4dn.xlarge (3920m
          # allocatable), stranding the second time-sliced GPU slice. At cpu 1 two
          # pods (2000m) fit, so time-slicing actually packs 2/node on the cheapest
          # instance. long_prepare_template.sh forwards --threads to run_prediction.py
          # (FastSurferCNN brainmask inference) only — mri_robust_template is invoked
          # with no thread flag and does not consume them. Since inference runs on the
          # GPU requested below, those threads only cover data loading/view aggregation.
          # Keep this value and --threads in sync: a thread count above the CPU request
          # makes PyTorch oversubscribe the cgroup quota and get throttled, which slows
          # the step while paying for GPU node time.
          cpu: '1'
          # Working set: per-session T1w + the base template being built (~1.2 GB
          # at k=6, extrapolated from the 228-418 MiB long-template tarballs).
          # fsaverage USED to be part of this (~1 GB unpacked into the emptyDir);
          # as of #372 it is a symlink into the image's read-only layers and
          # costs nothing here. Sized flat rather than scaled per-subject
          # because ephemeral-storage is NOT a binding scheduling constraint here:
          # gpu-nodeclass sets no instanceStorePolicy, so every g4dn/g5/g6 reports
          # the same ~140Gi allocatable from its 150Gi root volume.
          # TODO(perf): re-check against observed usage on the first full batch.
          ephemeral-storage: 20G
        limits:
          nvidia.com/gpu: '1'

      command: [bash, -c]
      args:
        - |
          # Device switch (#373). The argstrings carry `--threads 1` for the GPU
          # path; long_prepare_template.sh, run_fastsurfer.sh and run_prediction.py
          # all take the LAST --threads / --device they are given, so appending
          # here overrides them without a second copy of either argstring.
          # OMP_NUM_THREADS is this pod's cpu request via the downward API — 7
          # after the cpu podSpecPatch, 1 on the GPU — so threads track the
          # reservation on both paths. No nvidia-smi on the cpu path: the binary
          # is absent on cpu-heavy nodes.
          DEVICE_FLAGS=""
          MONITOR=""
          if [[ "{{inputs.parameters.device}}" == "cpu" ]]; then
            DEVICE_FLAGS="--device cpu --threads ${OMP_NUM_THREADS}"
            echo "[device] cpu: FastSurfer inference on ${OMP_NUM_THREADS} threads (cpu-heavy-nodepool drought fallback, #373)" >&2
          else
            nvidia-smi --query-gpu=timestamp,name,memory.total,utilization.gpu,utilization.memory,memory.used \
              --format=csv -l 5 >&2 &
            MONITOR=$!
          fi

          # fsaverage (#372). It ships INSIDE the image at
          # $FREESURFER_HOME/subjects/fsaverage, which is where FastSurfer reads
          # it from — recon-surf.sh's rotate_sphere.py, recon-surfreg.sh and
          # fs_balabels.py all resolve it there, never in SUBJECTS_DIR — and
          # images/fastsurfer/Dockerfile fails the build if those files go
          # missing. This link exists only so a consumer that names `fsaverage`
          # as a subject still finds it; it replaces a per-pod 480 MiB S3
          # download that held this pod's GPU slice while it ran.
          #
          # mkdir is load-bearing on THIS step only: the other three get
          # /work/subjects from an unpacked input artifact, while here the
          # deleted init container was what created it. Creating it as uid 1000
          # also keeps recon_surf/functions.sh's ownership check happy — it
          # refuses a root-owned, non-world-writable SUBJECTS_DIR.
          mkdir -p "$SUBJECTS_DIR"
          ln -sfn "${FREESURFER_HOME:-/opt/freesurfer}/subjects/fsaverage" "$SUBJECTS_DIR/fsaverage"

          /fastsurfer/recon_surf/long_prepare_template.sh {{inputs.parameters.fastsurfer-command-string}} ${DEVICE_FLAGS}
          PREP_EXIT=$?
          if [[ $PREP_EXIT -ne 0 ]]; then
            echo "ERROR: long_prepare_template.sh failed (exit ${PREP_EXIT}); not attempting segmentation." >&2
            [[ -n "$MONITOR" ]] && kill $MONITOR 2>/dev/null
            exit $PREP_EXIT
          fi

          /fastsurfer/run_fastsurfer.sh {{inputs.parameters.seg-argstring}} ${DEVICE_FLAGS}
          EXIT=$?; [[ -n "$MONITOR" ]] && kill $MONITOR 2>/dev/null; exit $EXIT

  ##############################################
  # B. Template Parcellation (surf_only --base)
  ##############################################

  - name: fastsurfer-template-parcellation-template
    metadata:
      labels:
        cloudpipe.io/phase: anatomical
        cloudpipe.io/step: template-parcellation
    inputs:
      parameters:
        - name: argstring

      artifacts:
      - name: fslicense
        path: '/opt/freesurfer/.license'
        s3:
          endpoint: "s3.{{workflow.parameters.region}}.amazonaws.com"
          bucket: "{{workflow.parameters.bucket}}"
          region: "{{workflow.parameters.region}}"
          key: 'config/fslicense'

      # The base template from step A, landed directly at its SUBJECTS_DIR path.
      - name: template-base
        path: '/work/subjects/{{workflow.parameters.subjID}}_template'
        s3:
          endpoint: "s3.{{workflow.parameters.region}}.amazonaws.com"
          bucket: "{{workflow.parameters.bucket}}"
          region: "{{workflow.parameters.region}}"
          key: 'scratch/{{workflow.name}}/anat/template-base.tar.gz'

    outputs:
      artifacts:
      # The parcellated template. Consumed by longitudinal parcellation (D).
      - name: template-parcellated
        path: '/work/subjects/{{workflow.parameters.subjID}}_template'
        archive:
          tar:
            compressionLevel: 1
        s3:
          endpoint: "s3.{{workflow.parameters.region}}.amazonaws.com"
          bucket: "{{workflow.parameters.bucket}}"
          region: "{{workflow.parameters.region}}"
          key: 'scratch/{{workflow.name}}/anat/template-parcellated.tar.gz'

    nodeSelector:
      karpenter.sh/nodepool: cpu-heavy-nodepool

    # Backstop for a wedged step. recon-surf.sh runs the hemispheres as sibling
    # PIDs and `wait`s on them in order, and a hemisphere's log reaches stdout
    # only when it FINISHES — so a hung hemisphere presents as a log whose last
    # line is "Waiting for PID ...", with no error anywhere and no exit code ever
    # produced. The exit-75 truncated-surface guard below only runs AFTER
    # run_fastsurfer.sh returns, and the retryStrategy needs a terminal pod to
    # fire. Before this deadline the only backstop was the master workflow's 24h
    # activeDeadlineSeconds, so one such subject held a 4-cpu cpu-heavy pod and a
    # concurrency slot for a full day.
    #
    # The hang itself is now bounded INSIDE the image (#958): the fastsurfer
    # image wraps mris_fix_topology and mris_topo_fixer in a 30 min `timeout`
    # (CLOUDPIPE_TOPOLOGY_TIMEOUT_S below), so a hopeless hemisphere ends as a
    # named failure — exit 70, failure_category `data` — while the other
    # hemisphere finishes, instead of a silent deadline kill at 3h. The args
    # block also traps SIGTERM and dumps the unfinished hemisphere logs, so
    # whatever else ever hangs here leaves its last lines in the pod log.
    #
    # Observed in workflow cloudpipe-qqtg7 (2026-08-18): rh mris_fix_topology
    # ran 3.0h and then FAILED with "euler number != 2", handing off to FreeSurfer's
    # mris_topo_fixer fallback, which spun at 100% cpu with no progress output and
    # no bound. Deterministic — the seed is fixed at 1234 and the input surface is
    # identical, so every retry reproduces it exactly (cf. the #235 HISTOalloc
    # subject-deterministic pattern). Two attempts burned 8.4h and 4.2h. Four more
    # on 2026-10-30 (#958); the one visible hemisphere (an lh built from a
    # saturated T1w) came out of marching cubes with eno=-1954 and ONE defect of
    # 311,919 of its 314,570 vertices, against eno >= -82 and defects <= 902
    # vertices in 600 healthy cohort hemispheres.
    #
    # 3h is sized from 1102 successful parcellation pods in cluster history:
    #     min 21.5m   median 46.9m   p90 67.6m   max 102.4m
    # so 10800s is ~1.75x the observed maximum. Every other historical failure of
    # this step is a spot reclaim, which lands far below the deadline and still
    # retries normally on the "imminent node shutdown" arm. Raise this if healthy
    # p90 ever approaches ~2h; do NOT raise it to accommodate a subject that hangs.
    activeDeadlineSeconds: 10800

    volumes:
      - name: work
        emptyDir: {}

    # No init containers: fsaverage comes from the image, not from S3 (#372).
    # See the fsaverage link in the args block below.

    container:
      image: "{{workflow.parameters.ecr-registry}}/cloudpipe/fastsurfer@sha256:fd118b11da90760bb8897936af1d3744184298e3be3a18b397af2a9fc9826b7c"
      imagePullPolicy: IfNotPresent

      volumeMounts:
      - name: work
        mountPath: /work

      env:
      - name: FS_LICENSE
        value: /opt/freesurfer/.license
      - name: SUBJECTS_DIR
        value: /work/subjects

      # Seconds mris_fix_topology / mris_topo_fixer may run per hemisphere before
      # the image's wrapper kills them (#958; images/fastsurfer/topology_bound.sh,
      # which also holds the sizing: the whole `recon-all -fix` stage took at
      # most 6.9 min across 600 healthy cohort hemispheres). Read by the wrapper
      # through the environment recon-all inherits; tuning it needs no rebuild.
      # Keep it well under activeDeadlineSeconds above or the deadline wins and
      # the failure goes back to being nameless.
      - name: CLOUDPIPE_TOPOLOGY_TIMEOUT_S
        value: "1800"

      # --threads is derived from this value rather than written in the master
      # template, so the resources block below is the single source of truth and
      # the two cannot drift across files. See the args block.
      - name: CPU_REQUEST
        valueFrom:
          resourceFieldRef:
            containerName: main   # Argo's name for the user container
            resource: requests.cpu
            divisor: "1"          # rounds UP to whole cores; keep cpu integral

      # cpu == --threads or the pod loses share under co-tenancy. Note there is no
      # cpu LIMIT here (nor on any step in this pipeline), so the request sets
      # cgroup cpu.weight, not a quota — the invariant protects fair share on a
      # packed node, it is not protection against hard throttling.
      #
      # 6 -> 4, from cpu_efficiency 0.577 (10 pods, 2026-07-31 batch). That figure
      # is trustworthy here: this step stages only 27 s against ~974 s of compute,
      # 2.7%, so it is not meaningfully diluted by the init container (#123, as
      # corrected in #128). 0.577 means ~3.6 of 6 cores, so 4 matches observed use.
      #
      # DO NOT CUT BELOW 2. recon-surf.sh:319-321 is a cliff, not a gradient:
      #     threads > 1  -> threads_hemi = threads/2, hemispheres in PARALLEL
      #     threads == 1 -> threads_hemi = 1,         hemispheres SERIAL
      # `--parallel` does not change this — run_fastsurfer.sh consumes that flag as
      # the obsolete legacy_parallel_hemi and never forwards it to recon-surf.sh.
      # So cpu 1 would not halve the thread count, it would roughly DOUBLE the
      # surface stage. 4 -> threads_hemi 2 (was 3 at cpu 6); 2 is the floor and
      # still parcellates both hemispheres concurrently.
      resources:
        requests:
          # 8G -> 3G. Measured average working set is ~1.05 GB (ram_efficiency 0.14 —
          # the lowest of any FastSurfer step — against the old 8G request, 10 pods,
          # 2026-07-31 batch). ram_efficiency is AVERAGE-based, so 3G keeps ~3x headroom
          # over the mean. No memory LIMIT on purpose: the packing benefit is all in the
          # request, and a ceiling where none existed would convert an underestimate
          # into an OOM. Memory is deliberately NOT touched by the CPU cut: ram_efficiency
          # 0.366 is inside the intended ~3x-headroom band.
          memory: 3G
          cpu: '4'
          # cpu-heavy nodes report >=~90Gi allocatable ephemeral storage on every
          # eligible instance type: Bottlerocket's 100Gi /dev/xvdb data volume when
          # the type has no instance store, or the RAID0'd NVMe (200-950 GB) when it
          # does. So this request does not narrow the spot pool — verified against
          # actual usage, where non-NVMe types (c5.2xlarge, c5.4xlarge, m8i.4xlarge)
          # dominate the hours while func-preproc already requests 20G here.
          ephemeral-storage: 20G

      command: [bash, -c]
      args:
        - |
          SD=/work/subjects
          BASE={{workflow.parameters.subjID}}_template

          # A killed recon-all leaves scripts/IsRunning.* behind, and FastSurfer
          # refuses to start when it finds one. The emptyDir is fresh, but the
          # lock can arrive INSIDE the input tarball: run_fastsurfer.sh traps
          # SIGTERM and exits 0 with its child killed, so an interrupted upstream
          # step can still "succeed" and publish a tarball carrying the lock.
          # Scrub inherited state rather than inheriting a wedged SUBJECTS_DIR.
          find "$SD" -name '*IsRunning*' -delete

          # fsaverage comes from the image — see the full note on step A's args
          # block and images/fastsurfer/Dockerfile (#372). recon-surf.sh reads
          # it from $FREESURFER_HOME; the link is for anything that resolves
          # `fsaverage` as a subject name inside SUBJECTS_DIR.
          ln -sfn "${FREESURFER_HOME:-/opt/freesurfer}/subjects/fsaverage" "$SD/fsaverage"

          # --threads comes from the cpu request (downward API), not from the master
          # template's argstring, so the resources block is the only place the two are
          # written. Floor of 2: at 1, recon-surf.sh drops hemisphere parallelism
          # entirely (see the resources comment) — clamp loudly rather than silently
          # doubling the surface stage if someone trims cpu to 1.
          THREADS="$CPU_REQUEST"
          if [[ "$THREADS" -lt 2 ]]; then
            echo "WARNING: cpu request ${CPU_REQUEST} would serialize hemispheres in recon-surf.sh;" >&2
            echo "         using --threads 2 instead. Raise the cpu request to match." >&2
            THREADS=2
          fi
          echo "cpu request=${CPU_REQUEST} --threads=${THREADS} (threads_hemi=$((THREADS / 2)))" >&2

          # Post-mortem on SIGTERM (#958). recon-surf.sh's RunBatchJobs writes each
          # hemisphere to scripts/<hemi>.processing.cmdf.log and appends it to the
          # pod log only when that hemisphere FINISHES, so a hemisphere that is
          # still running when the deadline or a reclaim kills the pod leaves
          # nothing behind. Argo's executor signals the whole process group, so
          # the children die first; bash runs this handler once run_fastsurfer.sh
          # has returned, inside the kubelet's grace period, and tails whatever
          # per-hemisphere logs are still on disk — the finished one was already
          # appended and deleted. Exit 143 as an untrapped SIGTERM would have.
          dump_unfinished_hemisphere_logs() {
            local f
            for f in "$SD/$BASE"/scripts/*.processing.cmdf.log; do
              [[ -f "$f" ]] || continue
              echo "=== post-mortem: $(basename "$f") was still running; last 40 lines ===" >&2
              tail -n 40 "$f" >&2
            done
          }
          trap 'echo "SIGTERM: deadline or node reclaim; dumping unfinished hemisphere logs (#958)" >&2; dump_unfinished_hemisphere_logs; exit 143' TERM

          /fastsurfer/run_fastsurfer.sh {{inputs.parameters.argstring}} --threads "$THREADS"
          EXIT=$?
          trap - TERM

          # A hemisphere whose topology correction ran past its bound (#958). The
          # image's wrapper around mris_fix_topology / mris_topo_fixer leaves this
          # marker; recon-all turns the kill into a plain exit 1, so the marker is
          # the only thing that distinguishes "the surface is not a brain" from a
          # crash. Checked BEFORE the exit-75 guard below: the hemisphere's white
          # surface is missing too, and 75 would retry a deterministic failure
          # eight times. 70 is TOPOLOGY_UNFIXABLE_EXIT_CODE in
          # images/shared/step_outcome.py — failure_category `data` — and is in
          # no retry expression.
          if compgen -G "$SD/$BASE/scripts/topology-unfixable.*" > /dev/null; then
            echo "ERROR: topology correction exceeded its bound; this subject's surface cannot be fixed (#958):" >&2
            cat "$SD/$BASE"/scripts/topology-unfixable.* >&2
            exit 70
          fi

          # Truncated-template guard (#115), gated on run_fastsurfer.sh's exit (#961).
          #
          # Written for one case: a spot reclaim kills recon-all mid-reconstruction,
          # run_fastsurfer.sh traps the SIGTERM and returns 0, and a base template
          # with no white surfaces and no filled.mgz is promoted — to detonate two
          # steps later at segment-subregions ("base-tps: No such file or directory").
          # So the guard checks the files long_compat_segmentHA.py / segment_subregions
          # depend on and exits 75 (EX_TEMPFAIL, in the retryStrategy above) so the
          # step re-runs on a fresh node.
          #
          # It did not look at the exit code, and the per-attempt archive (#961;
          # argo-nodes snapshots 2026-08-10 → 10-30, 14,371 attempts of this step)
          # says that was the wrong half to guard:
          #   - every one of the 706 reclaims landed as exit 143 — bash dies of the
          #     SIGTERM before reaching this line (explicitly now, via the trap above)
          #     — so the guard has never once fired on a reclaim;
          #   - all 153 exit-75s were ONE deterministic failure (HISTOalloc, #235 /
          #     #422) on 6 subjects, each retried until the 8-attempt budget was gone:
          #     ~8 h of 4-cpu pod time per subject to fail identically, recorded as a
          #     retry exhaustion rather than as its cause.
          # run_fastsurfer.sh:1456 turns a failed or killed recon-surf.sh into exit 1
          # (its SIGTERM trap only echoes, and bash 5.1 keeps PIPESTATUS across it),
          # so recon-all's "exited with ERRORS" always arrives here as EXIT=1.
          #
          # Hence: a non-zero EXIT is the failure and propagates as-is — 1 is in no
          # retry arm, and a reclaim that lands non-zero is already retried by the
          # `imminent node shutdown` / `pod deleted` MESSAGE arm. The missing files
          # are still named for the pod log. 75 is kept for the one shape the guard
          # was written for — EXIT=0 with a principal output missing — which a
          # deterministic recon-all failure cannot produce.
          #
          # This used to exit 137, which collided with a genuine kernel OOMKill and
          # forced the retry expression to treat both alike. 75 is ours alone; nothing
          # in the cluster emits it. See issue #115.
          MISSING=""
          for f in surf/lh.white surf/rh.white mri/filled.mgz; do
            [[ -s "${SD}/${BASE}/${f}" ]] || MISSING="${MISSING} ${BASE}/${f}"
          done
          if [[ "$EXIT" -ne 0 ]]; then
            if [[ -n "$MISSING" ]]; then
              echo "ERROR: run_fastsurfer.sh exited ${EXIT}; base template output missing:${MISSING}" >&2
              echo "       a failed reconstruction is deterministic — not forcing a retry (#961); see the recon-all ERRORS above." >&2
            fi
            exit "$EXIT"
          fi
          if [[ -n "$MISSING" ]]; then
            echo "ERROR: run_fastsurfer.sh exited 0 but base template output is missing:${MISSING}" >&2
            echo "       surface reconstruction was interrupted; forcing retry (exit 75)." >&2
            exit 75
          fi
          exit 0
