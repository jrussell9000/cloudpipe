apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: fast-tmpl
  namespace: argo-workflows
spec:

  retryStrategy:
    limit: "3"
    retryPolicy: Always
    expression: 'lastRetry.message matches "pod deleted|imminent node shutdown" || lastRetry.exitCode in [64, 137, 143]'
    backoff:
      duration: "1m"
      factor: "2"

  artifactRepositoryRef:
    key: cloudpipe-artifacts

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000

  templates:

  ##############################################
  # 1. Template Creation (long_prepare_template)
  ##############################################

  # NOTE: The code in long_prepare_template.sh will automagically handle timepoints with only baseline data
  - name: fastsurfer-template-creation-template
    metadata:
      labels:
        cloudpipe.io/phase: anatomical
        cloudpipe.io/step: template-creation
    inputs:
      parameters:
        - name: fastsurfer-command-string
        - name: T1w_sessions

      artifacts:
      - name: fslicense
        path: '/opt/freesurfer/.license'
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'config/fslicense'

    nodeSelector:
      karpenter.sh/nodepool: gpu-nodepool

    volumes:
      - name: t1w-inputs
        emptyDir: {}

    initContainers:
      - name: download-t1w-inputs
        image: "{{workflow.parameters.ecr-registry}}/cloudpipe/python:sha-5c9f627400e80dafdf1494b054da7d0b2540f1d3"
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: 512M
            cpu: '1'
        env:
          - name: SUBJECT_ID
            value: "{{workflow.parameters.subjID}}"
          - name: T1W_SESSIONS
            value: "{{inputs.parameters.T1w_sessions}}"
          - name: BUCKET
            value: "{{workflow.parameters.bucket}}"
        volumeMounts:
          - name: t1w-inputs
            mountPath: /home/nonroot
        command: [python]
        args:
          - -c
          - |
            import boto3, json, os
            from pathlib import Path

            s3 = boto3.client('s3')
            subj = os.environ['SUBJECT_ID']
            sessions = json.loads(os.environ['T1W_SESSIONS'])

            for ses in sessions:
                key = f"mmps_mproc/{subj}/{ses}/anat/{subj}_{ses}_run-01_T1w.nii.gz"
                dest = Path(f"/home/nonroot/{subj}/{ses}/anat/{subj}_{ses}_run-01_T1w.nii.gz")
                dest.parent.mkdir(parents=True, exist_ok=True)
                bucket = os.environ['BUCKET']
                print(f"Downloading s3://{bucket}/{key} -> {dest}", flush=True)
                s3.download_file(bucket, key, str(dest))

            print(f"Downloaded T1w files for {len(sessions)} session(s).", flush=True)

      - name: download-fsaverage
        image: "{{workflow.parameters.ecr-registry}}/cloudpipe/python:sha-5c9f627400e80dafdf1494b054da7d0b2540f1d3"
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: 256M
            cpu: '1'
        env:
          - name: BUCKET
            value: "{{workflow.parameters.bucket}}"
        mirrorVolumeMounts: true
        command: [python]
        args:
          - -c
          - |
            import boto3, os
            from pathlib import Path

            dest = Path("/opt/freesurfer/subjects/fsaverage")
            if dest.exists():
                print("fsaverage already present, skipping download.", flush=True)
            else:
                s3 = boto3.client('s3')
                bucket = os.environ['BUCKET']
                prefix = 'config/fsaverage/'
                paginator = s3.get_paginator('list_objects_v2')
                for page in paginator.paginate(Bucket=bucket, Prefix=prefix):
                    for obj in page.get('Contents', []):
                        key = obj['Key']
                        rel = key[len(prefix):]
                        if not rel:
                            continue
                        local = dest / rel
                        local.parent.mkdir(parents=True, exist_ok=True)
                        s3.download_file(bucket, key, str(local))
                print("fsaverage downloaded.", flush=True)

      - name: clear-is-running
        image: public.ecr.aws/docker/library/alpine:3.21
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            ephemeral-storage: 300M
        command: ["find", "/opt/freesurfer/subjects", "-name", "*IsRunning*", "-delete"]
        mirrorVolumeMounts: true

    container:
      image: "{{workflow.parameters.ecr-registry}}/cloudpipe/fastsurfer:sha-c36b2605dc6f07a55d0f5a491d8b6820413fa0f3"
      imagePullPolicy: IfNotPresent
      volumeMounts:
      - name: "{{=lower(workflow.parameters.subjID)}}"
        mountPath: /opt/freesurfer/subjects
        subPath: opt/freesurfer/subjects
      - name: t1w-inputs
        mountPath: /home/nonroot

      env:
        - name: FS_LICENSE
          value: /opt/freesurfer/.license

      resources:
        requests:
          memory: 4G
          cpu: '2'
        limits:
          nvidia.com/gpu: '1'

      command: [bash, -c]
      args:
        - |
          nvidia-smi --query-gpu=timestamp,utilization.gpu,utilization.memory,memory.used \
            --format=csv -l 5 >&2 &
          MONITOR=$!
          /fastsurfer/recon_surf/long_prepare_template.sh {{inputs.parameters.fastsurfer-command-string}}
          EXIT=$?; kill $MONITOR 2>/dev/null; exit $EXIT

  ##############################################
  # 2. Template Segmentation (seg_only --base)
  ##############################################

  - name: fastsurfer-template-segmentation-template
    metadata:
      labels:
        cloudpipe.io/phase: anatomical
        cloudpipe.io/step: template-segmentation
    inputs:
      parameters:
        - name: argstring

    nodeSelector:
      karpenter.sh/nodepool: gpu-nodepool

    initContainers:
      - name: clear-is-running
        image: public.ecr.aws/docker/library/alpine:3.21
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            ephemeral-storage: 300M
        command: ["find", "/opt/freesurfer/subjects", "-name", "*IsRunning*", "-delete"]
        mirrorVolumeMounts: true

    container:
      image: "{{workflow.parameters.ecr-registry}}/cloudpipe/fastsurfer:sha-c36b2605dc6f07a55d0f5a491d8b6820413fa0f3"
      imagePullPolicy: IfNotPresent
      volumeMounts:
      - name: "{{=lower(workflow.parameters.subjID)}}"
        mountPath: /opt/freesurfer/subjects
        subPath: opt/freesurfer/subjects

      resources:
        requests:
          memory: 2G
          cpu: '2'
        limits:
          nvidia.com/gpu: '1'

      command: [bash, -c]
      args:
        - |
          nvidia-smi --query-gpu=timestamp,utilization.gpu,utilization.memory,memory.used \
            --format=csv -l 5 >&2 &
          MONITOR=$!
          /fastsurfer/run_fastsurfer.sh {{inputs.parameters.argstring}}
          EXIT=$?; kill $MONITOR 2>/dev/null; exit $EXIT

  ##############################################
  # 3. Template Parcellation (surf_only --base)
  ##############################################

  - name: fastsurfer-template-parcellation-template
    metadata:
      labels:
        cloudpipe.io/phase: anatomical
        cloudpipe.io/step: template-parcellation
    inputs:
      parameters:
        - name: argstring

      artifacts:
      - name: fslicense
        path: '/opt/freesurfer/.license'
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'config/fslicense'

    nodeSelector:
      karpenter.sh/nodepool: cpu-heavy-nodepool

    initContainers:
      - name: clear-is-running
        image: public.ecr.aws/docker/library/alpine:3.21
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            ephemeral-storage: 300M
        command: ["find", "/opt/freesurfer/subjects", "-name", "*IsRunning*", "-delete"]
        mirrorVolumeMounts: true

    container:
      image: "{{workflow.parameters.ecr-registry}}/cloudpipe/fastsurfer:sha-c36b2605dc6f07a55d0f5a491d8b6820413fa0f3"
      imagePullPolicy: IfNotPresent

      volumeMounts:
      - name: "{{=lower(workflow.parameters.subjID)}}"
        mountPath: /opt/freesurfer/subjects
        subPath: opt/freesurfer/subjects

      env:
      - name: FS_LICENSE
        value: /opt/freesurfer/.license

      resources:
        requests:
          memory: 4G
          cpu: '4'

      command: [bash, -c]
      args: ["/fastsurfer/run_fastsurfer.sh {{inputs.parameters.argstring}}"]
