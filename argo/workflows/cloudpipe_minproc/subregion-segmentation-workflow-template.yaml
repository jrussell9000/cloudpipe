apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: subregion-seg
  namespace: argo-workflows
spec:

  entrypoint: subregion-seg-dag-template
  serviceAccountName: argo-workflows-runner

  arguments:
    parameters:
      - name: subjID
      - name: bucket
      - name: ecr-registry
      - name: T1w_sessions

  retryStrategy:
    # Sized for spot churn: gpu-nodepool and cpu-heavy-nodepool are spot-only by
    # design, so consecutive reclaims on one long step are routine (2 back-to-back
    # observed 2026-08-03). At limit 3, four in a row lose the subject outright.
    # See issue #115.
    limit: "8"
    retryPolicy: Always
    # Infrastructure codes only. 64/143 = executor / SIGTERM on node teardown,
    # never emitted by our scripts. 75 = EX_TEMPFAIL, reserved for the "a reclaim
    # truncated my output, re-run me" guards in the fastsurfer templates. 137 is
    # deliberately absent: a real OOMKill here is deterministic — #129/#134 split
    # this very step's TensorFlow tail out to fix one, and no retry would have —
    # so retrying it only burns the enlarged budget on an identical failure.
    # The codes are matched in the message too: a pod that dies in its init or wait
    # container never populates exitCode, so that arm alone is dead for the whole
    # artifact-staging class (#277). A missing artifact KEY is excluded, though:
    # its producer was skipped or failed, and a consumer retry cannot re-run the
    # producer. See the master template for the detail.
    expression: '(lastRetry.message matches "pod deleted|imminent node shutdown|exit code (64|75|143)" || lastRetry.exitCode in ["64", "75", "143"]) && not (lastRetry.message matches "specified key does not exist|longer than the specified deadline")'
    backoff:
      duration: "1m"
      factor: "2"
      # cap bounds each individual delay (maxDuration would abort the retries
      # instead): 1+2+4+5+5+5+5+5 = 32m worst case, vs 7m at the old limit of 3.
      cap: "5m"

  artifactRepositoryRef:
    key: cloudpipe-artifacts

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  templates:

  ##############################################
  # Entry-point DAG
  #
  #   segment-gems (~50 min, 4.5G)
  #
  # ONE task. There used to be a second, concurrent
  # `segment-dl` pod running FreeSurfer's TensorFlow
  # tools (GitHub #134 split it out). Both are gone:
  #
  #   - mri_segment_hypothalamic_subunits, dropped
  #     2026-09-16 for FastSurfer's HypVINN, which the
  #     anatomical phase already writes per session
  #     (stats/hypothalamus.HypVINN.stats).
  #   - mri_sclimbic_seg, dropped 2026-09-16. Its
  #     nucleus accumbens is in FastSurfer's aseg and
  #     its fornix/mammillary bodies are in HypVINN;
  #     only basal forebrain and septal nuclei were
  #     unique, and those were not needed.
  #
  # Both had published LAST-SESSION-ONLY trees for every
  # subject until then (a repeated-`--s` bug), so the
  # legacy `hypothalamic/` and `sclimbic/` prefixes are
  # retired, not merely unused. What the DL pod taught
  # — TensorFlow memory growing per session in one
  # process, memory.peak not resettable in these
  # containers, a 2 Hz sampler missing a 0.8 G spike —
  # is recorded in docs/pipelines.md; read it before
  # adding a TensorFlow step here again.
  #
  # No shared EFS volume (GitHub #77) and no hydrate
  # step: the pod declares the FastSurfer trees as S3
  # input artifacts and stages them onto its own private
  # emptyDir (mirrors fast-tmpl/fast-long post-PR #82).
  #
  # Per-region resume now comes from S3, not a
  # retry-persistent volume: each region's derivative
  # key (derivatives/subregions/{subjID}/{subjID}_
  # {region}.tar.gz — the same key the pod's final
  # Argo output.artifacts upload uses) is checked
  # before that region runs and written to
  # immediately after it completes, so a pod retry —
  # or a full workflow resubmit — skips regions
  # already done rather than only surviving an
  # in-workflow pod retry as the old PVC guard did.
  ##############################################

  - name: subregion-seg-dag-template
    inputs:
      parameters:
        - name: T1w_sessions

    # Still a DAG with one task rather than the entrypoint pointing straight at
    # the GEMS template: the master references `subregion-seg-dag-template` by
    # name, and keeping the shape leaves room for a future sibling step without
    # touching the master.
    dag:
      tasks:
        - name: segment-gems-dagtask
          template: segment-subregions-gems-template
          arguments:
            parameters:
              - name: T1w_sessions
                value: "{{inputs.parameters.T1w_sessions}}"

  ##############################################
  # Segmentation, part 1 of 2 — the GEMS regions.
  #
  # Long and cheap: ~50 minutes at a ~3.5 GB plateau.
  # Stages the FastSurfer outputs from S3 onto its own
  # private emptyDir (Argo's native input-artifact
  # loader, same extraction semantics fastsurfer-long
  # used to archive them — no hydrate step). Every
  # per-session artifact is optional: true — not every
  # subject has a ses-00A (baseline) scan, e.g. missed
  # baseline visit with only follow-ups present — so no
  # single session can be assumed mandatory. Runs, in
  # order:
  #
  #   1. segment_subregions thalamus  (~30-45 min)
  #   2. segment_subregions brainstem (~15-25 min)
  #   3. segment_subregions hippo-amygdala (~30-60 min)
  #
  # All three are GEMS/Bayesian and CPU-only — no
  # TensorFlow is imported in this pod at all, which
  # is what lets the request drop to 4.5G.
  #
  # Per-region resume now checks S3 (GitHub #77): before
  # each region runs, the script HEADs its final
  # derivatives/subregions/... key; if present (and past
  # the size floor) it downloads+extracts that tarball
  # instead of recomputing, and uploads the tarball
  # itself immediately after a region completes — not
  # only via Argo's own outputs.artifacts upload at pod
  # completion. This survives a full workflow resubmit,
  # not just an in-workflow pod retry. This is the pod
  # where that matters: 50 minutes of work to lose.
  #
  # Outputs (per-session + template, in mri/):
  #   ThalamicNuclei.v13.T1.mgz / .volumes.txt
  #   brainstemSsLabels.v13.T1.mgz / brainstemSsVolumes.v13.txt
  #   {lh,rh}.hippoAmygLabels*.mgz / .hippoSfVolumes*.txt / .amygNucVolumes*.txt
  ##############################################

  - name: segment-subregions-gems-template
    metadata:
      labels:
        cloudpipe.io/phase: subregion-segmentation
        cloudpipe.io/step: segment-gems
    inputs:
      parameters:
        - name: T1w_sessions

      artifacts:
        - name: fslicense
          path: /opt/freesurfer/.license
          s3:
            endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
            bucket: "{{workflow.parameters.bucket}}"
            region: <YOUR_AWS_REGION>
            key: config/fslicense

        - name: long-template
          path: /opt/freesurfer/subjects/{{workflow.parameters.subjID}}_template
          archive:
            none: {}
          s3:
            endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
            bucket: "{{workflow.parameters.bucket}}"
            region: <YOUR_AWS_REGION>
            key: derivatives/fastsurfer/{{workflow.parameters.subjID}}/long-template

        - name: ses-00A-templated
          path: /opt/freesurfer/subjects/ses-00A
          optional: true
          archive:
            none: {}
          s3:
            endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
            bucket: "{{workflow.parameters.bucket}}"
            region: <YOUR_AWS_REGION>
            key: derivatives/fastsurfer/{{workflow.parameters.subjID}}/ses-00A

        - name: ses-02A-templated
          path: /opt/freesurfer/subjects/ses-02A
          optional: true
          archive:
            none: {}
          s3:
            endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
            bucket: "{{workflow.parameters.bucket}}"
            region: <YOUR_AWS_REGION>
            key: derivatives/fastsurfer/{{workflow.parameters.subjID}}/ses-02A

        - name: ses-04A-templated
          path: /opt/freesurfer/subjects/ses-04A
          optional: true
          archive:
            none: {}
          s3:
            endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
            bucket: "{{workflow.parameters.bucket}}"
            region: <YOUR_AWS_REGION>
            key: derivatives/fastsurfer/{{workflow.parameters.subjID}}/ses-04A

        - name: ses-06A-templated
          path: /opt/freesurfer/subjects/ses-06A
          optional: true
          archive:
            none: {}
          s3:
            endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
            bucket: "{{workflow.parameters.bucket}}"
            region: <YOUR_AWS_REGION>
            key: derivatives/fastsurfer/{{workflow.parameters.subjID}}/ses-06A

        - name: ses-08A-templated
          path: /opt/freesurfer/subjects/ses-08A
          optional: true
          archive:
            none: {}
          s3:
            endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
            bucket: "{{workflow.parameters.bucket}}"
            region: <YOUR_AWS_REGION>
            key: derivatives/fastsurfer/{{workflow.parameters.subjID}}/ses-08A

        - name: ses-10A-templated
          path: /opt/freesurfer/subjects/ses-10A
          optional: true
          archive:
            none: {}
          s3:
            endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
            bucket: "{{workflow.parameters.bucket}}"
            region: <YOUR_AWS_REGION>
            key: derivatives/fastsurfer/{{workflow.parameters.subjID}}/ses-10A

    # NO OUTPUT ARTIFACTS (ADR 017). thalamus/brainstem/hippoamyg are published
    # in-pod by checkpoint_save, one object per file under
    # derivatives/subregions/{subj}/{region}/, with _complete.json written last.
    #
    # These five trees carry NO symlinks at all — 0 across all 125 measured — so
    # unlike the FastSurfer trees they never needed tarballing in the first
    # place; they inherited it from the sibling prefix. They are exploded here
    # for one reason only: `_complete.json` is what makes the resume guard and
    # `check_subregions_derivatives` honest about a half-finished upload.
    #
    # Declaring them as artifacts as well would re-upload identical bytes to the
    # same keys at pod exit, and — worse — Argo does not order artifact uploads,
    # so it could land a file object AFTER the marker that claims completeness.

    nodeSelector:
      karpenter.sh/nodepool: cpu-heavy-nodepool

    # /out is the packaging scratch dir the script collects results into before
    # artifact upload. The container runs as non-root (UID 1000), which cannot
    # mkdir at the image root filesystem, so /out and the FastSurfer subjects
    # dir must both be writable emptyDirs (no shared PVC — GitHub #77).
    volumes:
      - name: out
        emptyDir: {}
      - name: subjects
        emptyDir: {}

    container:
      image: "{{workflow.parameters.ecr-registry}}/cloudpipe/freesurfer@sha256:985e30bfc07718fe134762ab57b0708aaa2a0abc391773eb2045f0cdc987f49a"
      imagePullPolicy: IfNotPresent

      volumeMounts:
        - name: out
          mountPath: /out
        - name: subjects
          mountPath: /opt/freesurfer/subjects

      resources:
        requests:
          # PROVISIONAL — 3.5 G observed plateau + ~1 G headroom. This is NOT
          # read from cgroup v2 memory.peak; it comes from a 1 Hz trace (the
          # since-deleted scripts/manifests/subregion-oom-probe.yaml, in git
          # history), which sampled ~3.5 G flat across steps 1-3 but can miss a
          # short spike — a 2 Hz sampler missed a 0.8 G one on sclimbic. To
          # measure it properly, probe this pod ALONE and read memory.peak once
          # at the end: memory.peak cannot be reset in these containers, so it is
          # only exact for the whole pod. Until then the 1 G is deliberate slack,
          # not a measurement.
          #
          # History, so nobody re-derives it: this template was 16G -> 5G (#95)
          # -> 13G (#129) as ONE fused pod. The 5G came from ram_efficiency
          # 0.117-0.211 (a 3.38 GB lifetime average) and was right for these
          # three regions and catastrophically wrong for the fused pod, because
          # ram_efficiency is an AVERAGE and is structurally blind to the
          # TensorFlow tail's 25-second, 11.87 GB spike. #134 removed that tail
          # from this pod, so a GEMS-sized request is now correct here for the
          # first time. Do not restore 13G. (A separate DL pod owned that number
          # until its TensorFlow steps were dropped on 2026-09-16.)
          #
          # Do not lower this from an averaged efficiency metric either. Use the
          # probe, which reads the peak directly.
          memory: 4.5G
          # 3.5, NOT 4, and deliberately half a core BELOW the `--threads 4` on
          # every segment_subregions call below. This breaks the old
          # "keep the request in sync with --threads" rule on purpose; read this
          # before restoring 4.
          #
          # Why: a request of 4 is the single worst number for bin-packing on
          # this pool. Measured 2026-08-11 mid-batch at 200 concurrent, a
          # c*.2xlarge has 7.91 cpu allocatable and 0.705 cpu of DaemonSet
          # requests, leaving 7.21 usable. Two 4-cpu pods need 8 and do not fit,
          # so each of these pods took a whole node to itself: 83 of 148
          # cpu-heavy nodes were carrying exactly ONE workflow pod, and the pool
          # ran at 45% of allocatable cpu. At 3.5 two fit (7.0 <= 7.21), and a
          # 4xlarge (15.19 usable) fits four instead of three.
          #
          # What it costs: measured usage is median 3.55 / p90 4.12 cpu, so this
          # pod already wants slightly more than 4 and will now be mildly
          # oversubscribed. There is NO cpu limit here, so 3.5 is a scheduling
          # weight, not a cap — an unpacked node still lets all 4 threads run
          # flat out. Only when a node is genuinely full does each co-tenant
          # settle near 3.5/4 = ~90% of its threads, i.e. ~50 min -> ~55 min on
          # this step. Halving its node count is worth 5 minutes.
          #
          # --threads stays at 4 on purpose: thread-count changes in this
          # codebase have been non-monotonic and have altered numerical basins
          # (see #138 / t1w-to-mni), so the safe lever is the request, which
          # cannot change results.
          cpu: '3.5'
          # The three GEMS regions are the bulk of /out — per-timepoint label
          # volumes plus the template dir. Unchanged from the fused pod's 5G
          # rather than re-apportioned, since these outputs dominated it.
          ephemeral-storage: 5G

      env:
        - name: SUBJECTS_DIR
          value: /opt/freesurfer/subjects
        - name: FS_LICENSE
          value: /opt/freesurfer/.license

      command: [bash, -c]
      args:
        - |
          set -euo pipefail
          SD=/opt/freesurfer/subjects
          BASE={{workflow.parameters.subjID}}_template
          SUBJ={{workflow.parameters.subjID}}
          BUCKET={{workflow.parameters.bucket}}
          # FreeSurfer's bundled interpreter shadows /usr/bin/python3 earlier on
          # PATH (FREESURFER_HOME/python/bin precedes it) — call the apt-installed
          # interpreter (python3-boto3, images/freesurfer/Dockerfile) explicitly.
          PY=/usr/bin/python3

          # SetUpFreeSurfer.sh is not `set -u`-safe (references unbound vars, e.g.
          # FUNCTIONALS_DIR) and returns non-zero, so it must be sourced with the
          # strict flags relaxed — otherwise the shell aborts silently before any
          # segmentation runs. Re-enable strict mode immediately after.
          set +eu
          source "${FREESURFER_HOME}/SetUpFreeSurfer.sh" >/dev/null 2>&1 || true
          set -eu

          # ADR 017: the FastSurfer inputs above are exploded prefixes now, and
          # Argo cannot recreate a symlink. Replay each staged tree's manifest
          # BEFORE anything reads it.
          #
          # This is not optional housekeeping here: `base-tps` in the template
          # tree IS one of the 14 aliases (base-tps -> base-tps.fastsurfer), and
          # the very next line reads it. Without the replay both loops below
          # would fail on a missing file, and `set -eu` would abort the pod
          # before a single segmentation ran.
          #
          # An `if` rather than `[[ ... ]] && ...`: under `set -e` a false test as
          # the last command in a loop body aborts the script.
          for tree in "${SD}/${BASE}" "${SD}"/ses-*; do
            if [[ -d "$tree" ]]; then
              "$PY" /app/restore_links.py "$tree"
            fi
          done

          # segment_subregions --long-base expects timepoints named {tp}.long.{base}.
          # FastSurfer writes bare session IDs (ses-00A, ses-02A, ...). Symlinks bridge
          # the naming gap; writes from segment_subregions land in the real directories.
          # (Unrelated to the manifest replay above — these are OUR links, created
          # at stage time, and are never published.)
          while IFS= read -r tp; do
            [[ -n "$tp" ]] && ln -sfn "${SD}/${tp}" "${SD}/${tp}.long.${BASE}"
          done < "${SD}/${BASE}/base-tps"

          mapfile -t SESSIONS < <(grep -v '^$' "${SD}/${BASE}/base-tps")

          # S3 checkpoint helpers (GitHub #77), now on the exploded layout (ADR 017).
          # Each region's checkpoint prefix IS its final derivative prefix
          # (derivatives/subregions/{subj}/{region}/ — the same prefix
          # src/inventory.py:check_subregions_derivatives checks), so "checkpoint
          # restored" and "already done in a prior run" remain the same check.
          #
          # Two things got simpler in the move off tarballs:
          #
          #   - The size-floor heuristic is gone. It existed because a tarball key
          #     that exists is not proof the tarball is whole, so an implausibly
          #     small object was treated as absent. `_complete.json` answers that
          #     question directly: it is written only after every file object
          #     lands, so its presence IS completeness. A guess is replaced by a
          #     fact.
          #   - Argo's redundant end-of-pod re-upload is gone. The declarative
          #     outputs.artifacts entries used to re-upload identical bytes to the
          #     key checkpoint_save had already written; publishing in-pod means
          #     the write happens exactly once.
          #
          # A checkpoint is still only ever written AFTER a region's tool exits 0
          # and its output is collected into /out/<region> — never before.
          checkpoint_restore() {
            local region=$1 outdir=$2
            "$PY" /app/fs_derivatives.py stage "$outdir" \
              --bucket "$BUCKET" \
              --prefix "derivatives/subregions/${SUBJ}/${region}"
          }

          # A publish that dies on a SIGNAL exits 128+signum, and under `set -e` that
          # status becomes the pod's — 139 for a SIGSEGV, which the master
          # retryStrategy expression does not match, so a transient crash would fail
          # the phase permanently. Map it to 75 (EX_TEMPFAIL, retryable and ours
          # alone). A clean non-zero exit is left alone: that is PublishError (empty
          # tree, escaping link), deterministic, and should not retry. Same defect
          # as the one that cost sub-UPDUETFG on the fastsurfer side in the
          # 2026-08-14 batch — see issue #268 and the matching guard in
          # fastsurfer-long-phase-workflow-template.yaml.
          #
          # Retrying is safe: publish overwrites, `_prune_stale` clears a partial
          # previous attempt, and `_complete.json` lands last, so a retried publish
          # either completes the tree or leaves it markerless.
          checkpoint_save() {
            local region=$1 outdir=$2 rc=0
            "$PY" /app/fs_derivatives.py publish "$outdir" \
              --bucket "$BUCKET" \
              --prefix "derivatives/subregions/${SUBJ}/${region}" \
              --source-step subregion-segmentation || rc=$?
            if [[ $rc -ge 128 ]]; then
              echo "ERROR: publish of ${region} died on signal $((rc - 128)) (exit ${rc}); forcing retry (exit 75)." >&2
              exit 75
            fi
            # A non-zero return still aborts the script via `set -e` at the call
            # site, exactly as it did before.
            return $rc
          }

          # Local-disk fallback guard: true only when EVERY timepoint already has an
          # output matching the pattern on THIS pod's emptyDir. Only fires within a
          # single still-running pod (e.g. a region's collection step ran but a later
          # region in this same script failed) — an emptyDir does not survive a pod
          # retry, so cross-attempt resume is checkpoint_restore's job now, not this.
          #
          # Both weaker forms are actively harmful here:
          #
          #   ${BASE}/mri/<pat>  — segment_subregions --long-base writes per-timepoint
          #     and never into the base dir, so a base-dir guard never fires and the
          #     region recomputes from scratch on every retry (verified: the template
          #     mri/ dir is empty in every subject's uploaded tarball).
          #
          #   ${SESSIONS[0]}/mri/<pat> — the segmentation tools process all timepoints
          #     in one invocation, so an interruption can leave the first timepoint
          #     complete and later ones missing. A first-timepoint guard would skip the
          #     region and silently upload a PARTIAL segmentation.
          have_all_tps() {
            local pattern=$1 tp
            [[ ${#SESSIONS[@]} -gt 0 ]] || return 1
            for tp in "${SESSIONS[@]}"; do
              compgen -G "${SD}/${tp}/mri/${pattern}" >/dev/null || return 1
            done
            return 0
          }

          # Per-session coverage check on a COLLECTED tree under /out: true only
          # when every timepoint has every pattern. `_complete.json` is per REGION,
          # so it proves the upload finished, not that the tool covered every
          # session — the collection `cp ... || true` below will happily publish a
          # tree with sessions missing, and the since-removed DL pod did exactly that
          # for every subject until 2026-09-15 (a repeated-`--s` bug; see
          # docs/pipelines.md). So this gates both ends:
          #
          #   after checkpoint_restore — an incomplete checkpoint counts as absent
          #     and is recomputed, which is also how already-published partial
          #     trees heal on a plain resubmit, with no flush;
          #   before checkpoint_save   — a partial tree fails the phase instead of
          #     being published under a marker that claims it is whole.
          #
          # Patterns match the per-session volume tables — the files a downstream
          # reader wants — and were checked against 300 published subjects
          # (859/859 sessions for all three regions here) before gating on them.
          tree_has_all_tps() {
            local outdir=$1 tp pat
            shift
            [[ ${#SESSIONS[@]} -gt 0 ]] || return 1
            for tp in "${SESSIONS[@]}"; do
              for pat in "$@"; do
                if ! compgen -G "${outdir}/${tp}/${pat}" >/dev/null; then
                  echo "coverage: ${outdir} has no ${tp}/${pat}" >&2
                  return 1
                fi
              done
            done
          }

          mkdir -p /out/thalamus /out/brainstem /out/hippoamyg

          # 1. Thalamic nuclei — GEMS/Bayesian, CPU.
          if checkpoint_restore thalamus /out/thalamus \
             && tree_has_all_tps /out/thalamus 'mri/ThalamicNuclei*volumes*'; then
            echo "thalamus checkpoint found in S3 -- restored, skipping recompute"
          else
            # A checkpoint that restored but fails coverage leaves its files here;
            # start clean so the publish below mirrors only this attempt's output.
            rm -rf /out/thalamus && mkdir -p /out/thalamus
            if have_all_tps 'ThalamicNuclei*'; then
              echo "thalamus outputs present for all timepoints on local disk -- skipping compute"
            else
              segment_subregions thalamus --long-base "$BASE" --sd "$SD" --threads 4
            fi
            while IFS= read -r tp; do
              [[ -n "$tp" ]] || continue
              mkdir -p "/out/thalamus/${tp}/mri"
              cp "${SD}/${tp}/mri/"ThalamicNuclei* "/out/thalamus/${tp}/mri/" 2>/dev/null || true
            done < "${SD}/${BASE}/base-tps"
            mkdir -p "/out/thalamus/${BASE}/mri"
            cp "${SD}/${BASE}/mri/"ThalamicNuclei* "/out/thalamus/${BASE}/mri/" 2>/dev/null || true
            # A plain exit 1, not 75: a tool that skipped a session will skip it
            # again, so this must fail the phase rather than burn retries.
            tree_has_all_tps /out/thalamus 'mri/ThalamicNuclei*volumes*' || exit 1
            checkpoint_save thalamus /out/thalamus
          fi

          # 2. Brainstem substructures — GEMS/Bayesian, CPU.
          if checkpoint_restore brainstem /out/brainstem \
             && tree_has_all_tps /out/brainstem 'mri/brainstemSs*volumes*'; then
            echo "brainstem checkpoint found in S3 -- restored, skipping recompute"
          else
            rm -rf /out/brainstem && mkdir -p /out/brainstem
            if have_all_tps 'brainstemSs*'; then
              echo "brainstem outputs present for all timepoints on local disk -- skipping compute"
            else
              segment_subregions brainstem --long-base "$BASE" --sd "$SD" --threads 4
            fi
            while IFS= read -r tp; do
              [[ -n "$tp" ]] || continue
              mkdir -p "/out/brainstem/${tp}/mri"
              cp "${SD}/${tp}/mri/"brainstemSs* "/out/brainstem/${tp}/mri/" 2>/dev/null || true
            done < "${SD}/${BASE}/base-tps"
            mkdir -p "/out/brainstem/${BASE}/mri"
            cp "${SD}/${BASE}/mri/"brainstemSs* "/out/brainstem/${BASE}/mri/" 2>/dev/null || true
            tree_has_all_tps /out/brainstem 'mri/brainstemSs*volumes*' || exit 1
            checkpoint_save brainstem /out/brainstem
          fi

          # 3. Hippocampal subfields + amygdala nuclei — GEMS/Bayesian, CPU.
          #    Uses the HippoSF atlas already kept in the image (see
          #    images/freesurfer/Dockerfile). Longitudinal timepoints are inferred
          #    from base-tps, same as thalamus/brainstem. Emits per-hemisphere label
          #    maps (lh./rh.) plus subfield and amygdala-nuclei volume tables; globs
          #    stay loose because the version suffix (e.g. .v22) varies across
          #    FreeSurfer releases.
          HIPPO_TABLES=('mri/lh.hippoSfVolumes*' 'mri/rh.hippoSfVolumes*' 'mri/lh.amygNucVolumes*' 'mri/rh.amygNucVolumes*')
          if checkpoint_restore hippoamyg /out/hippoamyg \
             && tree_has_all_tps /out/hippoamyg "${HIPPO_TABLES[@]}"; then
            echo "hippo-amygdala checkpoint found in S3 -- restored, skipping recompute"
          else
            rm -rf /out/hippoamyg && mkdir -p /out/hippoamyg
            if have_all_tps '*hippoAmygLabels*'; then
              echo "hippo-amygdala outputs present for all timepoints on local disk -- skipping compute"
            else
              segment_subregions hippo-amygdala --long-base "$BASE" --sd "$SD" --threads 4
            fi
            while IFS= read -r tp; do
              [[ -n "$tp" ]] || continue
              mkdir -p "/out/hippoamyg/${tp}/mri"
              cp "${SD}/${tp}/mri/"*hippoAmygLabels* "/out/hippoamyg/${tp}/mri/" 2>/dev/null || true
              cp "${SD}/${tp}/mri/"*hippoSfVolumes*  "/out/hippoamyg/${tp}/mri/" 2>/dev/null || true
              cp "${SD}/${tp}/mri/"*amygNucVolumes*  "/out/hippoamyg/${tp}/mri/" 2>/dev/null || true
            done < "${SD}/${BASE}/base-tps"
            mkdir -p "/out/hippoamyg/${BASE}/mri"
            cp "${SD}/${BASE}/mri/"*hippoAmygLabels* "/out/hippoamyg/${BASE}/mri/" 2>/dev/null || true
            tree_has_all_tps /out/hippoamyg "${HIPPO_TABLES[@]}" || exit 1
            checkpoint_save hippoamyg /out/hippoamyg
          fi
