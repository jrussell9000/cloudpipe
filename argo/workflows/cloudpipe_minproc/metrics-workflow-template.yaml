apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: metrics-exit-handler
  namespace: argo-workflows

spec:
  serviceAccountName: argo-workflows-runner

  templates:

  ###########################################################################
  # Workflow exit handler — runs after every cloudpipe workflow (success or
  # failure) via onExit.  Writes a WorkflowRun JSON to
  # s3://{metrics-bucket}/metrics/workflow-runs/dt={date}/{workflow-name}__{workflow-uid}__{subject}_run_summary.json.
  ###########################################################################

  - name: workflow-exit-handler
    metadata:
      labels:
        cloudpipe.io/phase: observability
        cloudpipe.io/step: workflow-run-metrics
    inputs:
      parameters:
        - name: workflow-name
        # {{workflow.uid}}. Argo reuses names; the UID is what keeps this run's
        # step outcomes and start marker apart from another run's under the same
        # name (#638). Defaulted like batch-label, for the same reason.
        - name: workflow-uid
          value: ''
        - name: subject
        - name: status
        - name: started-at
        - name: duration-s
        - name: metrics-bucket
        - name: pipeline
        # Era/batch label. Defaulted here as well as at the workflow level so an
        # older caller that does not pass it still resolves rather than failing
        # the exit handler — which runs via onExit and would otherwise lose the
        # run record for the very workflows most worth recording.
        - name: batch-label
          value: ''

    nodeSelector:
      karpenter.sh/nodepool: cpu-light-nodepool

    container:
      image: "{{workflow.parameters.ecr-registry}}/cloudpipe/python@sha256:57d929e8ef38d3d481fef3372c29a9545f9b3056b7ace3c2b9a37bced2df3d01"
      imagePullPolicy: IfNotPresent

      resources:
        requests:
          memory: 128M
          cpu: 100m

      command: [python, /app/exit_handler.py]
      args:
        - --workflow-name
        - '{{inputs.parameters.workflow-name}}'
        - --workflow-uid
        - '{{inputs.parameters.workflow-uid}}'
        - --subject
        - '{{inputs.parameters.subject}}'
        - --status
        - '{{inputs.parameters.status}}'
        - --started-at
        - '{{inputs.parameters.started-at}}'
        - --duration-s
        - '{{inputs.parameters.duration-s}}'
        - --metrics-bucket
        - '{{inputs.parameters.metrics-bucket}}'
        - --pipeline
        - '{{inputs.parameters.pipeline}}'
        - --batch-label
        - '{{inputs.parameters.batch-label}}'

  ###########################################################################
  # Records the wall-clock time the DAG began running, into
  # s3://{metrics-bucket}/metrics/workflow-starts/dt={date}/{workflow-name}__{workflow-uid}.json.
  # A separate, no-`depends` DAG task (not threaded through Argo's
  # workflow.outputs.parameters) so the exit handler can read it back from S3
  # without depending on a global-output pattern that argo lint --offline
  # can't resolve inside onExit templates (#147).
  ###########################################################################

  - name: record-workflow-start-template
    metadata:
      labels:
        cloudpipe.io/phase: observability
        cloudpipe.io/step: workflow-start-marker
    inputs:
      parameters:
        - name: workflow-name
        # {{workflow.uid}} — see workflow-exit-handler above (#638).
        - name: workflow-uid
          value: ''
        - name: metrics-bucket

    nodeSelector:
      karpenter.sh/nodepool: cpu-light-nodepool

    container:
      image: "{{workflow.parameters.ecr-registry}}/cloudpipe/python@sha256:57d929e8ef38d3d481fef3372c29a9545f9b3056b7ace3c2b9a37bced2df3d01"
      imagePullPolicy: IfNotPresent

      resources:
        requests:
          memory: 128M
          cpu: 100m

      command: [python, /app/record_workflow_start.py]
      args:
        - --workflow-name
        - '{{inputs.parameters.workflow-name}}'
        - --workflow-uid
        - '{{inputs.parameters.workflow-uid}}'
        - --metrics-bucket
        - '{{inputs.parameters.metrics-bucket}}'

  ###########################################################################
  # The workflow's verdict, the last task of cloudpipe-long-master's DAG:
  # exits 1 when any of this run's StepOutcome rows records a failure, so a
  # failure a recorder absorbed still fails the workflow. See the comment on
  # workflow-verdict-dagtask there.
  #
  # A script, not a new /app module: it uses only what this image digest
  # already ships (boto3, /app/exit_handler.py's date range and run filter), so
  # a merge needs no image rebuild, and no workflow submitted before a pin can
  # run a template naming a module its image lacks.
  # tests/argo/test_workflow_verdict.py runs this source.
  ###########################################################################

  - name: workflow-verdict-template
    metadata:
      labels:
        cloudpipe.io/phase: observability
        cloudpipe.io/step: workflow-verdict
    inputs:
      parameters:
        - name: workflow-name
        - name: workflow-uid
        - name: subject
        - name: started-at
        - name: metrics-bucket

    nodeSelector:
      karpenter.sh/nodepool: cpu-light-nodepool

    script:
      image: "{{workflow.parameters.ecr-registry}}/cloudpipe/python@sha256:57d929e8ef38d3d481fef3372c29a9545f9b3056b7ace3c2b9a37bced2df3d01"
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          memory: 128M
          cpu: 100m
      command: [python]
      source: |
        import json
        import sys

        sys.path.insert(0, "/app")

        # Statuses that fail the workflow. Skipped and omitted steps are not
        # failures: their upstream's own row is.
        FAILING = ("failed", "error", "errored")
        # A registration gate that worked and rejected its transform (exit 65).
        # The run is correctly excluded; nothing broke.
        NOT_A_FAILURE = ("qc_rejected",)
        # Status-only rollups of a whole sub-DAG (the master template's
        # record-outcome-anatomical/session-dagtask). A session whose every run
        # the gate rejects exits 65 at bold-to-t1w, which fails that session's
        # sub-DAG, so session-phase records a bare `failed` (category unknown)
        # beside the qc_rejected row that is the whole story: on 2026-10-27 that
        # failed func-reprocess-05-12 workflows whose outputs were complete.
        ROLLUPS = ("anatomical-phase", "session-phase")
        # EX_TEMPFAIL: the workflow retryStrategy retries it.
        TEMPFAIL = 75


        def load_rows(s3, bucket, name, dates, keep):
            """Every StepOutcome row under this workflow's name on `dates`, for which
            keep(row) is true. Strict, unlike the exit handler's loader, which logs
            and skips a row it cannot read: a skipped row could be the failed one,
            so any read error propagates (and main() retries)."""
            rows = []
            for dt in dates:
                pages = s3.get_paginator("list_objects_v2").paginate(
                    Bucket=bucket, Prefix=f"metrics/step-outcomes/dt={dt}/{name}__"
                )
                for page in pages:
                    for obj in page.get("Contents", []):
                        row = json.loads(s3.get_object(Bucket=bucket, Key=obj["Key"])["Body"].read())
                        if keep(row):
                            rows.append(row)
            return rows


        def failures(rows):
            """The rows that fail this workflow, in a stable order for the log.

            A rollup's bare `failed` is explained, and dropped, when the run also
            recorded a qc_rejected row and no real (non-rollup) failure: the
            rejection is why the sub-DAG failed. A rollup `failed` with no
            rejection anywhere still counts, since it is the only trace of a
            step that died without recording itself, and a rollup `error`
            (infrastructure) always counts.
            """
            bad = [
                r
                for r in rows
                if (r.get("status") or "").lower() in FAILING
                and r.get("failure_category") not in NOT_A_FAILURE
            ]
            real = [r for r in bad if r.get("step") not in ROLLUPS]
            rejected = any(r.get("failure_category") in NOT_A_FAILURE for r in rows)
            if not real and rejected:
                bad = [
                    r for r in bad
                    if not (r.get("step") in ROLLUPS and (r.get("status") or "").lower() == "failed")
                ]
            return sorted(
                bad,
                key=lambda r: tuple(r.get(k) or "" for k in ("step", "session", "task", "run")),
            )


        def verdict(rows):
            """(exit code, lines to print) for this run's StepOutcome rows."""
            if not rows:
                # Every workflow that gets this far has written rows (a skipped
                # step still writes one), so none means they are lost or
                # unreadable, and nothing here can vouch for the run.
                return 1, ["no StepOutcome rows found for this run; cannot vouch for it"]
            bad = failures(rows)
            lines = [f"{len(rows)} StepOutcome row(s), {len(bad)} failure(s)"]
            for r in bad:
                where = "/".join(r.get(k) or "na" for k in ("session", "task", "run"))
                reason = " ".join((r.get("failure_reason") or "").split())[:300]
                lines.append(
                    f"FAILED {r.get('step')} {where}: {r.get('failure_category') or 'unknown'}"
                    + (f" ({reason})" if reason else "")
                )
            return (1 if bad else 0), lines


        def main():
            from datetime import datetime, timezone

            import boto3
            import exit_handler
            from botocore.exceptions import BotoCoreError, ClientError

            name = "{{inputs.parameters.workflow-name}}"
            uid = "{{inputs.parameters.workflow-uid}}"
            subj = "{{inputs.parameters.subject}}"
            now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
            s3 = boto3.client("s3", region_name=exit_handler.deployment_env.region())
            try:
                rows = load_rows(
                    s3,
                    "{{inputs.parameters.metrics-bucket}}",
                    name,
                    exit_handler._date_range("{{inputs.parameters.started-at}}", now),
                    lambda r: exit_handler._belongs_to_this_run(r, uid, subj),
                )
            except (BotoCoreError, ClientError, ValueError) as exc:
                print(
                    f"ERROR: could not read StepOutcome rows ({type(exc).__name__}: {exc}); "
                    f"forcing retry (exit {TEMPFAIL}).",
                    file=sys.stderr,
                )
                sys.exit(TEMPFAIL)
            code, lines = verdict(rows)
            for line in lines:
                print(line, file=sys.stderr if code else sys.stdout)
            if code:
                print(f"{name}: failing the workflow on the recorded failure(s) above.", file=sys.stderr)
            sys.exit(code)


        main()
