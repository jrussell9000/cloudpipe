apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: metrics-exit-handler
  namespace: argo-workflows

spec:
  serviceAccountName: argo-workflows-runner

  templates:

  ###########################################################################
  # Workflow exit handler — runs after every cloudpipe workflow (success or
  # failure) via onExit.  Writes a WorkflowRun JSON to
  # s3://{metrics-bucket}/metrics/workflow-runs/dt={date}/{workflow-name}__{workflow-uid}__{subject}_run_summary.json.
  ###########################################################################

  - name: workflow-exit-handler
    metadata:
      labels:
        cloudpipe.io/phase: observability
        cloudpipe.io/step: workflow-run-metrics
    inputs:
      parameters:
        - name: workflow-name
        # {{workflow.uid}}. Argo reuses names; the UID is what keeps this run's
        # step outcomes and start marker apart from another run's under the same
        # name (#638). Defaulted like batch-label, for the same reason.
        - name: workflow-uid
          value: ''
        - name: subject
        - name: status
        - name: started-at
        - name: duration-s
        - name: metrics-bucket
        - name: pipeline
        # Era/batch label. Defaulted here as well as at the workflow level so an
        # older caller that does not pass it still resolves rather than failing
        # the exit handler — which runs via onExit and would otherwise lose the
        # run record for the very workflows most worth recording.
        - name: batch-label
          value: ''

    nodeSelector:
      karpenter.sh/nodepool: cpu-light-nodepool

    container:
      image: "{{workflow.parameters.ecr-registry}}/cloudpipe/python@sha256:b90721d0274cdad5632a0f5cbc52a7c442b37d32d3e6865ebab43c32f11a166a"
      imagePullPolicy: IfNotPresent

      resources:
        requests:
          memory: 128M
          cpu: 100m

      command: [python, /app/exit_handler.py]
      args:
        - --workflow-name
        - '{{inputs.parameters.workflow-name}}'
        - --workflow-uid
        - '{{inputs.parameters.workflow-uid}}'
        - --subject
        - '{{inputs.parameters.subject}}'
        - --status
        - '{{inputs.parameters.status}}'
        - --started-at
        - '{{inputs.parameters.started-at}}'
        - --duration-s
        - '{{inputs.parameters.duration-s}}'
        - --metrics-bucket
        - '{{inputs.parameters.metrics-bucket}}'
        - --pipeline
        - '{{inputs.parameters.pipeline}}'
        - --batch-label
        - '{{inputs.parameters.batch-label}}'

  ###########################################################################
  # Records the wall-clock time the DAG began running, into
  # s3://{metrics-bucket}/metrics/workflow-starts/dt={date}/{workflow-name}__{workflow-uid}.json.
  # A separate, no-`depends` DAG task (not threaded through Argo's
  # workflow.outputs.parameters) so the exit handler can read it back from S3
  # without depending on a global-output pattern that argo lint --offline
  # can't resolve inside onExit templates (#147).
  ###########################################################################

  - name: record-workflow-start-template
    metadata:
      labels:
        cloudpipe.io/phase: observability
        cloudpipe.io/step: workflow-start-marker
    inputs:
      parameters:
        - name: workflow-name
        # {{workflow.uid}} — see workflow-exit-handler above (#638).
        - name: workflow-uid
          value: ''
        - name: metrics-bucket

    nodeSelector:
      karpenter.sh/nodepool: cpu-light-nodepool

    container:
      image: "{{workflow.parameters.ecr-registry}}/cloudpipe/python@sha256:b90721d0274cdad5632a0f5cbc52a7c442b37d32d3e6865ebab43c32f11a166a"
      imagePullPolicy: IfNotPresent

      resources:
        requests:
          memory: 128M
          cpu: 100m

      command: [python, /app/record_workflow_start.py]
      args:
        - --workflow-name
        - '{{inputs.parameters.workflow-name}}'
        - --workflow-uid
        - '{{inputs.parameters.workflow-uid}}'
        - --metrics-bucket
        - '{{inputs.parameters.metrics-bucket}}'
