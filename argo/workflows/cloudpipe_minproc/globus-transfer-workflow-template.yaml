# The network ingress step. The WorkflowTemplate and file keep the name
# `globus-transfer` although the Globus Transfer task and the Globus Connect
# Server host it ran on are retired (openspec retire-globus-host): the master,
# confounds-rerun and both fmriprep_bench templates call it by this name, and a
# rename would have to change every caller at once.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: globus-transfer
  namespace: argo-workflows

spec:
  templates:

  ###########################################################################
  # ingress-mode=https (openspec add-https-ingress-mode). Lists the subject
  # through the Globus Transfer API with production's scan-type filter
  # (`listing.discover_files`), then copies it with rclone over the source
  # collection's own HTTPS server, straight into
  # s3://{dest-bucket}{dest-base-path}/{subject}/, and checks every object's
  # size against the listing (images/globus/https_ingress.py). No Globus host
  # of ours is involved.
  #
  # Runs on ingress-nodepool: public-subnet nodes whose public address carries
  # this download, so it pays no NAT. Nothing else tolerates that pool's taint
  # (tests/argo/test_ingress_modes.py), and the nodes admit no inbound from the
  # internet (tests/test_ingress_node_isolation.py; plan 018 §8, option B).
  #
  # Inputs:
  #   source-collection-id  UUID of the remote Globus collection
  #   source-base-path      Collection root on the source (subject ID appended automatically)
  #   dest-bucket           S3 bucket the copy writes to
  #   dest-base-path        Prefix within dest-bucket (subject ID appended automatically)
  #   scan-types            JSON array of BIDS scan types, e.g. '["T1w","T2w","rest"]'
  ###########################################################################

  - name: https-transfer-template
    metadata:
      labels:
        cloudpipe.io/phase: transfer
        cloudpipe.io/step: https-transfer
    # Caps concurrent copies against the source; the value and why it is not
    # higher are in cloudpipe-semaphores-configmap.yaml.
    synchronization:
      semaphores:
        - configMapKeyRef:
            name: cloudpipe-semaphores
            key: https-transfer
    # `Always`, not `OnFailure`. OnFailure retries phase=Failed only, and a
    # throttled control plane produces phase=Error — `pod deleted`, or a wait
    # container that cannot report status at all. So the retry budget was
    # unreachable for exactly the failure class retries exist to absorb: in the
    # 300-subject batch of 2026-08-14, four subjects died on the ingress step
    # (then Globus's) inside a 41-second window on `etcdserver: throttle: too
    # many requests`, each with one attempt and zero retries. See issue #269.
    #
    # Not the workflow-level `expression` from
    # cloudpipe-long-master-workflow-template.yaml either. That one exists to
    # keep an 8-attempt budget away from deterministic failures on expensive GPU
    # and cpu-heavy steps. This step's work is idempotent (a rerun copies only
    # what is missing), and it exits 1 on transient Transfer API conditions
    # (auth refresh, rate limiting) — an infrastructure-codes-only expression
    # would silently REDUCE coverage here.
    #
    # One exception: exit 78 is the step REFUSING — a session past the 30-day
    # rule, or no HTTPS token — and it fails identically on every attempt, so a
    # retry would only delay the message. Any other code, including an absent
    # one (an init or wait container died), still retries. This is the one
    # expression tests/argo/test_retry_expression.py allows to differ from the
    # canonical string, and only as exactly this.
    #
    # limit is 3 rather than the workflow's 8: this step holds a semaphore
    # (above), so its attempts are serialized against every other subject's
    # copy.
    retryStrategy:
      limit: "3"
      retryPolicy: Always
      expression: 'lastRetry.exitCode != "78"'
      backoff:
        duration: "60s"
        factor: "2"
    activeDeadlineSeconds: 7200

    inputs:
      parameters:
        - name: source-collection-id
        - name: source-base-path
        - name: dest-bucket
        - name: dest-base-path
        - name: scan-types

    nodeSelector:
      karpenter.sh/nodepool: ingress-nodepool
    tolerations:
      - key: cloudpipe.io/ingress
        operator: Equal
        value: "true"
        effect: NoSchedule

    container:
      # The cloudpipe/globus image, pinned by digest (the pin job rewrites this
      # line): it ships https_ingress.py with the listing module it imports.
      image: "{{workflow.parameters.ecr-registry}}/cloudpipe/globus@sha256:5ee53a82de205dc8f656a07461e6b797c446e17c9355d5163ad1625751d54bab"
      imagePullPolicy: IfNotPresent

      # Plan 018 §7: one subject peaked at 1,118 MiB, about 8.4 CPU-s per GiB
      # at ~420 MiB/s.
      resources:
        requests:
          memory: 2Gi
          cpu: '2'
          ephemeral-storage: 200M
        limits:
          memory: 3Gi

      # Tokens only ever arrive as env, never args: argv is visible in the pod
      # spec and in Argo's UI.
      env:
        - name: AWS_DEFAULT_REGION
          valueFrom:
            configMapKeyRef:
              name: cloudpipe-config
              key: region
        # The contact in rclone's User-Agent, so the source's operators can
        # reach us about this traffic. Optional: without it the User-Agent
        # still names cloudpipe, just with no address.
        - name: INGRESS_CONTACT
          valueFrom:
            configMapKeyRef:
              name: cloudpipe-config
              key: ingress_contact
              optional: true
        - name: GLOBUS_NATIVE_APP_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: globus-credentials
              key: native-app-client-id
        - name: GLOBUS_REFRESH_TOKEN
          valueFrom:
            secretKeyRef:
              name: globus-credentials
              key: refresh-token
        # Optional, so a Secret that does not carry the key yet (no login has
        # granted the HTTPS scope) gives an immediate refusal — exit 78, naming
        # `pixi run globus login` — rather than a pod stuck in
        # CreateContainerConfigError until the deadline.
        - name: GLOBUS_HTTPS_REFRESH_TOKEN
          valueFrom:
            secretKeyRef:
              name: globus-credentials
              key: https-refresh-token
              optional: true

      command: [python, /app/https_ingress.py]
      args:
        - --subject-id
        - '{{workflow.parameters.subjID}}'
        - --source-collection-id
        - '{{inputs.parameters.source-collection-id}}'
        - --source-base-path
        - '{{inputs.parameters.source-base-path}}'
        - --dest-bucket
        - '{{inputs.parameters.dest-bucket}}'
        - --dest-base-path
        - '{{inputs.parameters.dest-base-path}}'
        - --scan-types
        - '{{inputs.parameters.scan-types}}'

