apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: fast-long
  namespace: argo-workflows
spec:

  retryStrategy:
    limit: "3"
    retryPolicy: Always
    expression: 'lastRetry.message matches "pod deleted|imminent node shutdown" || lastRetry.exitCode in [64, 137, 143]'
    backoff:
      duration: "1m"
      factor: "2"

  artifactRepositoryRef:
    key: cloudpipe-artifacts

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000

  templates:

  ##############################################
  # 1. Long Segmentation (seg_only --long)
  ##############################################

  - name: fastsurfer-long-segmentation-template
    metadata:
      labels:
        cloudpipe.io/phase: anatomical
        cloudpipe.io/step: long-segmentation
    inputs:
      parameters:
        - name: argstring

    nodeSelector:
      karpenter.sh/nodepool: gpu-nodepool

    initContainers:
      - name: clear-is-running
        image: public.ecr.aws/docker/library/alpine:3.21
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            ephemeral-storage: 300M
        command: ["find", "/opt/freesurfer/subjects", "-name", "*IsRunning*", "-delete"]
        mirrorVolumeMounts: true

    container:
      image: "{{workflow.parameters.ecr-registry}}/cloudpipe/fastsurfer:sha-c36b2605dc6f07a55d0f5a491d8b6820413fa0f3"
      imagePullPolicy: IfNotPresent

      volumeMounts:
      - name: "{{=lower(workflow.parameters.subjID)}}"
        mountPath: /opt/freesurfer/subjects
        subPath: opt/freesurfer/subjects

      resources:
        requests:
          memory: 2G
          cpu: '2'
        limits:
          nvidia.com/gpu: '1'

      command: [bash, -c]
      args:
        - |
          nvidia-smi --query-gpu=timestamp,utilization.gpu,utilization.memory,memory.used \
            --format=csv -l 5 >&2 &
          MONITOR=$!
          /fastsurfer/brun_fastsurfer.sh {{inputs.parameters.argstring}}
          EXIT=$?; kill $MONITOR 2>/dev/null; exit $EXIT

  ##############################################
  # 2. Long Parcellation (surf_only --long)
  ##############################################

  - name: fastsurfer-long-parcellation-template
    metadata:
      labels:
        cloudpipe.io/phase: anatomical
        cloudpipe.io/step: long-parcellation
    inputs:
      parameters:
        - name: argstring
        - name: T1w_sessions

      artifacts:
      - name: fslicense
        path: '/opt/freesurfer/.license'
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'config/fslicense'

    outputs:
      artifacts:
      - name: long-template-complete
        path: '/opt/freesurfer/subjects/{{workflow.parameters.subjID}}_template'
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'derivatives/fastsurfer/{{workflow.parameters.subjID}}/{{workflow.parameters.subjID}}_long-template.tar.gz'

      - name: ses-00A-templated
        path: '/opt/freesurfer/subjects/ses-00A'
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'derivatives/fastsurfer/{{workflow.parameters.subjID}}/{{workflow.parameters.subjID}}_ses-00A_templated.tar.gz'

      - name: ses-02A-templated
        path: '/opt/freesurfer/subjects/ses-02A'
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'derivatives/fastsurfer/{{workflow.parameters.subjID}}/{{workflow.parameters.subjID}}_ses-02A_templated.tar.gz'
        optional: true

      - name: ses-04A-templated
        path: '/opt/freesurfer/subjects/ses-04A'
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'derivatives/fastsurfer/{{workflow.parameters.subjID}}/{{workflow.parameters.subjID}}_ses-04A_templated.tar.gz'
        optional: true

      - name: ses-06A-templated
        path: '/opt/freesurfer/subjects/ses-06A'
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'derivatives/fastsurfer/{{workflow.parameters.subjID}}/{{workflow.parameters.subjID}}_ses-06A_templated.tar.gz'
        optional: true

      - name: ses-08A-templated
        path: '/opt/freesurfer/subjects/ses-08A'
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'derivatives/fastsurfer/{{workflow.parameters.subjID}}/{{workflow.parameters.subjID}}_ses-08A_templated.tar.gz'
        optional: true

      - name: ses-10A-templated
        path: '/opt/freesurfer/subjects/ses-10A'
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'derivatives/fastsurfer/{{workflow.parameters.subjID}}/{{workflow.parameters.subjID}}_ses-10A_templated.tar.gz'
        optional: true

      - name: ses-00A-anat-qc
        path: '/tmp/{{workflow.parameters.subjID}}_ses-00A_anat_qc.json'
        optional: true
        archive:
          none: {}
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'metrics/anat/{{workflow.parameters.subjID}}_ses-00A_anat_qc.json'

      - name: ses-02A-anat-qc
        path: '/tmp/{{workflow.parameters.subjID}}_ses-02A_anat_qc.json'
        optional: true
        archive:
          none: {}
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'metrics/anat/{{workflow.parameters.subjID}}_ses-02A_anat_qc.json'

      - name: ses-04A-anat-qc
        path: '/tmp/{{workflow.parameters.subjID}}_ses-04A_anat_qc.json'
        optional: true
        archive:
          none: {}
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'metrics/anat/{{workflow.parameters.subjID}}_ses-04A_anat_qc.json'

      - name: ses-06A-anat-qc
        path: '/tmp/{{workflow.parameters.subjID}}_ses-06A_anat_qc.json'
        optional: true
        archive:
          none: {}
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'metrics/anat/{{workflow.parameters.subjID}}_ses-06A_anat_qc.json'

      - name: ses-08A-anat-qc
        path: '/tmp/{{workflow.parameters.subjID}}_ses-08A_anat_qc.json'
        optional: true
        archive:
          none: {}
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'metrics/anat/{{workflow.parameters.subjID}}_ses-08A_anat_qc.json'

      - name: ses-10A-anat-qc
        path: '/tmp/{{workflow.parameters.subjID}}_ses-10A_anat_qc.json'
        optional: true
        archive:
          none: {}
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'metrics/anat/{{workflow.parameters.subjID}}_ses-10A_anat_qc.json'

    # Set the number of CPUs requested to 2x the number of sessions, k; memory to 2k + 2 (GB).
    # --parallel k --threads 2 runs k concurrent FastSurfer instances: both hemispheres run in
    # parallel at 1 thread each (threads_hemi = 2//2 = 1, same as --threads 3 which gave
    # threads_hemi = 3//2 = 1) — identical hemisphere parallelism at 33% less CPU cost.
    # Rightsized from observed ~44% CPU efficiency and ~1 GiB/session RAM usage across 57 pods.
    podSpecPatch: |
      containers:
        - name: main
          resources:
            requests:
              cpu: '{{=len(jsonpath(inputs.parameters.T1w_sessions, "$[*]"))*2}}'
              memory: '{{=len(jsonpath(inputs.parameters.T1w_sessions, "$[*]"))*2 + 2}}G'

    nodeSelector:
      karpenter.sh/nodepool: cpu-heavy-nodepool

    initContainers:
      - name: clear-is-running
        image: public.ecr.aws/docker/library/alpine:3.21
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            ephemeral-storage: 300M
        command: ["find", "/opt/freesurfer/subjects", "-name", "*IsRunning*", "-delete"]
        mirrorVolumeMounts: true

    container:
      image: "{{workflow.parameters.ecr-registry}}/cloudpipe/fastsurfer:sha-c36b2605dc6f07a55d0f5a491d8b6820413fa0f3"
      imagePullPolicy: IfNotPresent

      volumeMounts:
      - name: "{{=lower(workflow.parameters.subjID)}}"
        mountPath: /opt/freesurfer/subjects
        subPath: opt/freesurfer/subjects

      env:
        - name: FS_LICENSE
          value: /opt/freesurfer/.license

      command: [bash, -c]
      args:
        - |
          /fastsurfer/brun_fastsurfer.sh {{inputs.parameters.argstring}}
          FASTSURFER_EXIT=$?
          for ses in $(python3 -c "import json,sys; print(' '.join(json.loads(sys.argv[1])))" '{{inputs.parameters.T1w_sessions}}'); do
            python3 /app/extract_qc.py \
              --subjects-dir /opt/freesurfer/subjects \
              --subj {{workflow.parameters.subjID}} \
              --ses "$ses" \
              --pipeline cloudpipe_minproc || true
          done
          python3 /fastsurfer/recon_surf/long_compat_segmentHA.py \
            --sd /opt/freesurfer/subjects \
            --sid {{workflow.parameters.subjID}}_template \
            --fs_license /opt/freesurfer/.license \
            --threads 2 || true
          exit $FASTSURFER_EXIT
