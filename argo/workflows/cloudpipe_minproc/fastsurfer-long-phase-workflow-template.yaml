apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: fast-long
  namespace: argo-workflows
spec:

  retryStrategy:
    # Sized for spot churn: gpu-nodepool and cpu-heavy-nodepool are spot-only by
    # design, so consecutive reclaims on one long step are routine (2 back-to-back
    # observed on fastsurfer-long-parcellation, 2026-08-03). At limit 3, four in a
    # row lose the subject outright. See issue #115.
    limit: "8"
    retryPolicy: Always
    # Infrastructure codes only. 64/143 = executor / SIGTERM on node teardown,
    # never emitted by our scripts. 75 = EX_TEMPFAIL, the base-tps guard below.
    # 137 is deliberately absent: a real OOMKill here is deterministic (#120,
    # #129, #134 each needed a config change, not a retry), so retrying it only
    # burns the enlarged budget on an identical failure.
    expression: 'lastRetry.message matches "pod deleted|imminent node shutdown" || lastRetry.exitCode in ["64", "75", "143"]'
    backoff:
      duration: "1m"
      factor: "2"
      # cap bounds each individual delay (maxDuration would abort the retries
      # instead): 1+2+4+5+5+5+5+5 = 32m worst case, vs 7m at the old limit of 3.
      cap: "5m"

  artifactRepositoryRef:
    key: cloudpipe-artifacts

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000

  # ---------------------------------------------------------------------------
  # No shared EFS volume — see the header on fast-tmpl. SUBJECTS_DIR is
  # /work/subjects on a private emptyDir; state crosses pods via S3 (ADR 004).
  #
  # The per-session artifacts below are declared one-per-possible-session and
  # marked optional because Argo resolves inputs/outputs.artifacts statically
  # when the pod spec is built — a variable-length session list cannot be
  # expressed any other way. Same pattern as subregion-seg's hydrate step.
  # ---------------------------------------------------------------------------

  templates:

  ##############################################
  # C. Long Segmentation (seg_only --long)
  #
  # Reads the base template from step A (seg_only output is sufficient — this is
  # why C does not wait for the template parcellation in B) and writes the
  # per-session directories consumed by D.
  ##############################################

  - name: fastsurfer-long-segmentation-template
    metadata:
      labels:
        cloudpipe.io/phase: anatomical
        cloudpipe.io/step: long-segmentation
    inputs:
      parameters:
        - name: argstring

      artifacts:
      - name: template-base
        path: '/work/subjects/{{workflow.parameters.subjID}}_template'
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'scratch/{{workflow.name}}/anat/template-base.tar.gz'

    outputs:
      artifacts:
      - name: ses-00A-seg
        path: '/work/subjects/ses-00A'
        optional: true
        archive:
          tar:
            compressionLevel: 1
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'scratch/{{workflow.name}}/anat/sessions-seg/ses-00A.tar.gz'

      - name: ses-02A-seg
        path: '/work/subjects/ses-02A'
        optional: true
        archive:
          tar:
            compressionLevel: 1
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'scratch/{{workflow.name}}/anat/sessions-seg/ses-02A.tar.gz'

      - name: ses-04A-seg
        path: '/work/subjects/ses-04A'
        optional: true
        archive:
          tar:
            compressionLevel: 1
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'scratch/{{workflow.name}}/anat/sessions-seg/ses-04A.tar.gz'

      - name: ses-06A-seg
        path: '/work/subjects/ses-06A'
        optional: true
        archive:
          tar:
            compressionLevel: 1
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'scratch/{{workflow.name}}/anat/sessions-seg/ses-06A.tar.gz'

      - name: ses-08A-seg
        path: '/work/subjects/ses-08A'
        optional: true
        archive:
          tar:
            compressionLevel: 1
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'scratch/{{workflow.name}}/anat/sessions-seg/ses-08A.tar.gz'

      - name: ses-10A-seg
        path: '/work/subjects/ses-10A'
        optional: true
        archive:
          tar:
            compressionLevel: 1
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'scratch/{{workflow.name}}/anat/sessions-seg/ses-10A.tar.gz'

    nodeSelector:
      karpenter.sh/nodepool: gpu-nodepool

    volumes:
      - name: work
        emptyDir: {}

    initContainers:
      # --seg_only should not touch fsaverage, but the argstring still carries
      # --fsaparc and under the old shared volume this directory was always
      # present (step A put it there and every later step saw it). Re-creating
      # that guarantee costs ~480 MiB of in-region S3 per pod and a few seconds
      # of GPU node time; discovering the assumption was wrong costs a failed
      # batch. TODO: drop this once a real run confirms seg_only never reads it.
      - name: download-fsaverage
        image: "{{workflow.parameters.ecr-registry}}/cloudpipe/python:sha-229e7240327b18c2efad1bc4da083870f7f379a8"
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: 256M
            cpu: '1'
        mirrorVolumeMounts: true
        env:
          - name: BUCKET
            value: "{{workflow.parameters.bucket}}"
        command: [python]
        args:
          - -c
          - |
            import boto3, os
            from pathlib import Path

            dest = Path("/work/subjects/fsaverage")
            if dest.exists():
                print("fsaverage already present, skipping download.", flush=True)
            else:
                s3 = boto3.client('s3')
                bucket = os.environ['BUCKET']
                prefix = 'config/fsaverage/'
                paginator = s3.get_paginator('list_objects_v2')
                for page in paginator.paginate(Bucket=bucket, Prefix=prefix):
                    for obj in page.get('Contents', []):
                        key = obj['Key']
                        rel = key[len(prefix):]
                        if not rel:
                            continue
                        local = dest / rel
                        local.parent.mkdir(parents=True, exist_ok=True)
                        s3.download_file(bucket, key, str(local))
                print("fsaverage downloaded.", flush=True)

    container:
      image: "{{workflow.parameters.ecr-registry}}/cloudpipe/fastsurfer:sha-2478b13eb1e5e4cb901c37f03effcf43b9ee0dad"
      imagePullPolicy: IfNotPresent

      volumeMounts:
      - name: work
        mountPath: /work

      env:
        - name: SUBJECTS_DIR
          value: /work/subjects
        # Cap every thread pool at the CPU REQUEST, projected from the pod spec so the
        # resources block below is the single source of truth. `--threads 1` in the master
        # template only reaches run_prediction.py's own argument; PyTorch/OpenMP inside
        # FastSurferCNN still size their pools from the HOST core count, which is why this
        # step measured cpu_efficiency 1.22 (~1.2 cores against a 1-core request) on the
        # 2026-07-31 batch. That was harmless only because the pods had landed on 32-vCPU
        # g4dn.8xlarge nodes; now that gpu-nodepool is capped at xlarge/2xlarge, an
        # uncapped pool would contend with the co-tenant time-sliced pod on a 4-vCPU node.
        #
        # This is a CAP, not a raise — do NOT increase the cpu request to match observed
        # burst. cpu 1 is what lets two GPU pods share one g4dn.xlarge under time-slicing.
        #
        # Cannot be read from the cgroup instead: this container sets no CPU limit, so
        # /sys/fs/cgroup/cpu.max reads "max" and says nothing about the request.
        - name: OMP_NUM_THREADS
          valueFrom: &longSegCpuRequest
            resourceFieldRef:
              containerName: main   # Argo's name for the user container
              resource: requests.cpu
              divisor: "1"          # rounds UP to whole cores; keep cpu integral
        - name: MKL_NUM_THREADS
          valueFrom: *longSegCpuRequest
        - name: OPENBLAS_NUM_THREADS
          valueFrom: *longSegCpuRequest
        - name: ITK_GLOBAL_DEFAULT_NUMBER_OF_THREADS
          valueFrom: *longSegCpuRequest

      resources:
        requests:
          # 2G -> 1G. Measured average working set is ~0.63 GB (ram_efficiency 0.33 against
          # the old 2G request, 11 pods, 2026-07-31 batch). Kubecost's ram_efficiency is
          # built from AVERAGE usage, so this keeps ~1.6x headroom over the mean rather
          # than sizing to it. Deliberately no memory LIMIT: the packing benefit comes
          # entirely from the request, and adding a ceiling where none existed would turn
          # an underestimate into an OOM on a step whose failure costs a segmentation.
          memory: 1G
          # cpu 1 / --threads 1 (was 2/4): fit two GPU pods per g4dn.xlarge under
          # time-slicing. seg_only is GPU-inference-bound; the CPU-heavy surface work
          # (surf_only) runs on cpu-heavy-nodepool, so fewer CPU threads here costs
          # little wall-time. Keep cpu == --threads (master template) to avoid throttling,
          # and see the env block above, which projects this value into the thread pools.
          cpu: '1'
          # Base template (~1.2 GB at k=6) plus one segmented session directory per
          # timepoint. gpu-nodeclass sets no instanceStorePolicy, so every g4dn/g5/g6
          # reports the same ~140Gi allocatable from its 150Gi root volume — this
          # request does not narrow the (already thin) GPU spot pool.
          ephemeral-storage: 20G
        limits:
          nvidia.com/gpu: '1'

      command: [bash, -c]
      args:
        - |
          nvidia-smi --query-gpu=timestamp,name,memory.total,utilization.gpu,utilization.memory,memory.used \
            --format=csv -l 5 >&2 &
          MONITOR=$!

          # See the equivalent note in fast-tmpl: an interrupted upstream step can
          # exit 0 and publish a tarball carrying scripts/IsRunning.*, which would
          # wedge FastSurfer here even though this emptyDir is fresh.
          find /work/subjects -name '*IsRunning*' -delete

          /fastsurfer/brun_fastsurfer.sh {{inputs.parameters.argstring}}
          EXIT=$?; kill $MONITOR 2>/dev/null; exit $EXIT

  ##############################################
  # D. Long Parcellation (surf_only --long)
  #
  # The terminal anatomical step. Reassembles SUBJECTS_DIR from the parcellated
  # template (B) and the segmented sessions (C), runs surface reconstruction for
  # every timepoint, then promotes the real derivatives to S3. Those output keys
  # are the pipeline's contract with inventory / registration / func-preproc /
  # subregion-seg and are UNCHANGED by the move off EFS.
  ##############################################

  - name: fastsurfer-long-parcellation-template
    metadata:
      labels:
        cloudpipe.io/phase: anatomical
        cloudpipe.io/step: long-parcellation
    inputs:
      parameters:
        - name: argstring
        - name: T1w_sessions

      artifacts:
      - name: fslicense
        path: '/opt/freesurfer/.license'
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'config/fslicense'

      # Parcellated template from B — NOT the pre-parcellation one from A.
      # long_compat_segmentHA.py's cortical-ribbon step needs its white surfaces.
      - name: template-parcellated
        path: '/work/subjects/{{workflow.parameters.subjID}}_template'
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'scratch/{{workflow.name}}/anat/template-parcellated.tar.gz'

      - name: ses-00A-seg
        path: '/work/subjects/ses-00A'
        optional: true
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'scratch/{{workflow.name}}/anat/sessions-seg/ses-00A.tar.gz'

      - name: ses-02A-seg
        path: '/work/subjects/ses-02A'
        optional: true
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'scratch/{{workflow.name}}/anat/sessions-seg/ses-02A.tar.gz'

      - name: ses-04A-seg
        path: '/work/subjects/ses-04A'
        optional: true
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'scratch/{{workflow.name}}/anat/sessions-seg/ses-04A.tar.gz'

      - name: ses-06A-seg
        path: '/work/subjects/ses-06A'
        optional: true
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'scratch/{{workflow.name}}/anat/sessions-seg/ses-06A.tar.gz'

      - name: ses-08A-seg
        path: '/work/subjects/ses-08A'
        optional: true
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'scratch/{{workflow.name}}/anat/sessions-seg/ses-08A.tar.gz'

      - name: ses-10A-seg
        path: '/work/subjects/ses-10A'
        optional: true
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'scratch/{{workflow.name}}/anat/sessions-seg/ses-10A.tar.gz'

    outputs:
      artifacts:
      - name: long-template-complete
        path: '/work/subjects/{{workflow.parameters.subjID}}_template'
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'derivatives/fastsurfer/{{workflow.parameters.subjID}}/{{workflow.parameters.subjID}}_long-template.tar.gz'

      - name: ses-00A-templated
        path: '/work/subjects/ses-00A'
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'derivatives/fastsurfer/{{workflow.parameters.subjID}}/{{workflow.parameters.subjID}}_ses-00A_templated.tar.gz'
        optional: true

      - name: ses-02A-templated
        path: '/work/subjects/ses-02A'
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'derivatives/fastsurfer/{{workflow.parameters.subjID}}/{{workflow.parameters.subjID}}_ses-02A_templated.tar.gz'
        optional: true

      - name: ses-04A-templated
        path: '/work/subjects/ses-04A'
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'derivatives/fastsurfer/{{workflow.parameters.subjID}}/{{workflow.parameters.subjID}}_ses-04A_templated.tar.gz'
        optional: true

      - name: ses-06A-templated
        path: '/work/subjects/ses-06A'
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'derivatives/fastsurfer/{{workflow.parameters.subjID}}/{{workflow.parameters.subjID}}_ses-06A_templated.tar.gz'
        optional: true

      - name: ses-08A-templated
        path: '/work/subjects/ses-08A'
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'derivatives/fastsurfer/{{workflow.parameters.subjID}}/{{workflow.parameters.subjID}}_ses-08A_templated.tar.gz'
        optional: true

      - name: ses-10A-templated
        path: '/work/subjects/ses-10A'
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'derivatives/fastsurfer/{{workflow.parameters.subjID}}/{{workflow.parameters.subjID}}_ses-10A_templated.tar.gz'
        optional: true

      - name: ses-00A-anat-qc
        path: '/tmp/{{workflow.parameters.subjID}}_ses-00A_anat_qc.json'
        optional: true
        archive:
          none: {}
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.metrics-bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'metrics/anat-qc/dt={{workflow.creationTimestamp.Y}}-{{workflow.creationTimestamp.m}}-{{workflow.creationTimestamp.d}}/{{workflow.parameters.subjID}}_ses-00A_anat_qc.json'

      - name: ses-02A-anat-qc
        path: '/tmp/{{workflow.parameters.subjID}}_ses-02A_anat_qc.json'
        optional: true
        archive:
          none: {}
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.metrics-bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'metrics/anat-qc/dt={{workflow.creationTimestamp.Y}}-{{workflow.creationTimestamp.m}}-{{workflow.creationTimestamp.d}}/{{workflow.parameters.subjID}}_ses-02A_anat_qc.json'

      - name: ses-04A-anat-qc
        path: '/tmp/{{workflow.parameters.subjID}}_ses-04A_anat_qc.json'
        optional: true
        archive:
          none: {}
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.metrics-bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'metrics/anat-qc/dt={{workflow.creationTimestamp.Y}}-{{workflow.creationTimestamp.m}}-{{workflow.creationTimestamp.d}}/{{workflow.parameters.subjID}}_ses-04A_anat_qc.json'

      - name: ses-06A-anat-qc
        path: '/tmp/{{workflow.parameters.subjID}}_ses-06A_anat_qc.json'
        optional: true
        archive:
          none: {}
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.metrics-bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'metrics/anat-qc/dt={{workflow.creationTimestamp.Y}}-{{workflow.creationTimestamp.m}}-{{workflow.creationTimestamp.d}}/{{workflow.parameters.subjID}}_ses-06A_anat_qc.json'

      - name: ses-08A-anat-qc
        path: '/tmp/{{workflow.parameters.subjID}}_ses-08A_anat_qc.json'
        optional: true
        archive:
          none: {}
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.metrics-bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'metrics/anat-qc/dt={{workflow.creationTimestamp.Y}}-{{workflow.creationTimestamp.m}}-{{workflow.creationTimestamp.d}}/{{workflow.parameters.subjID}}_ses-08A_anat_qc.json'

      - name: ses-10A-anat-qc
        path: '/tmp/{{workflow.parameters.subjID}}_ses-10A_anat_qc.json'
        optional: true
        archive:
          none: {}
        s3:
          endpoint: s3.<YOUR_AWS_REGION>.amazonaws.com
          bucket: "{{workflow.parameters.metrics-bucket}}"
          region: <YOUR_AWS_REGION>
          key: 'metrics/anat-qc/dt={{workflow.creationTimestamp.Y}}-{{workflow.creationTimestamp.m}}-{{workflow.creationTimestamp.d}}/{{workflow.parameters.subjID}}_ses-10A_anat_qc.json'

    # CPU request is the TOTAL thread count: max(4, 2k) for k sessions, spent as
    # `--threads cpu/k` across k concurrent --parallel instances. The container
    # derives --threads from this request via the downward API (see the args
    # block), so cpu == total threads by construction rather than by keeping two
    # files in agreement. The division is exact at every k: 4/1, 4/2, 6/3, 8/4.
    #
    # Memory is 13G at k<=3 / 18G at k=4 and is deliberately NOT tied to this — see
    # below. It does not scale on 2k: peak is set by how many sessions sit in the
    # memory-heavy normalization stage at once, which the measured table below
    # captures directly.
    #
    # 6 -> max(4, 2k), i.e. the floor drops 6 -> 4 and k>=3 is unchanged.
    # WHY ONLY THE FLOOR MOVES: --threads 2 is a hard floor per instance, because
    # recon-surf.sh:319-321 is a cliff rather than a gradient:
    #
    #     threads > 1  -> threads_hemi = threads/2, hemispheres in PARALLEL
    #     threads == 1 -> threads_hemi = 1,         hemispheres SERIAL
    #
    # (`--parallel` here is brun_fastsurfer.sh's SUBJECT-level flag and does not
    # reach that branch; run_fastsurfer.sh consumes its own --parallel as the
    # obsolete legacy_parallel_hemi and never forwards it to recon-surf.sh.) So
    # dropping a k>=3 subject to cpu 4 would emit --threads 1 and roughly DOUBLE
    # the surface stage on the pipeline's longest step. The cut is therefore worth
    # 2 cores at k<=2 and nothing above it:
    #
    #     k=1: cpu 6 -> 4, --threads 6 -> 4 (threads_hemi 3 -> 2)
    #     k=2: cpu 6 -> 4, --threads 3 -> 2 (threads_hemi 1 -> 1, i.e. FREE)
    #     k=3: cpu 6,      --threads 2      unchanged
    #     k=4: cpu 8,      --threads 2      unchanged
    #
    # WHY NOT LOWER, given cpu_efficiency 0.473? Because that 0.473 is not an
    # oversized request. Staging is only ~30 s against 1216-2214 s of compute here
    # (1-2%, so #123's dilution does not apply — see #128), which means the idle
    # cores are real. But they are ALGORITHMIC: recon-surf.sh alternates
    # hemisphere-parallel sections with long serial joint sections, so a k=3 pod
    # oscillates between 3 and 6 busy cores and averages ~2.9. Trimming the request
    # to that average does not reclaim the serial sections, it only starves the
    # parallel ones. This is also why the earlier re-check came back negative:
    # cpu_efficiency was 0.45 before the floor went to 6 and 0.473 after, because
    # the extra threads were never the binding constraint.
    #
    # Known wart, deliberately not fixed here: k=4 requests 8 and therefore needs a
    # 4xlarge, and that is 32.2% of subjects — not an edge case. Session counts over
    # the 11830 subjects in tools/nss_volumes.csv (a BOLD-derived proxy for the T1w
    # session count, so approximate):
    #
    #     k=1  12.3%  cpu 4   2xlarge
    #     k=2  21.0%  cpu 4   2xlarge
    #     k=3  34.5%  cpu 6   2xlarge
    #     k=4  32.2%  cpu 8   4xlarge   <-- here
    #
    # (Only ses-00A..ses-06A exist today; the ses-08A/ses-10A artifact declarations
    # are forward-looking, so k=4 is the current maximum.)
    #
    # There is no packing trick available. cpu-heavy-nodepool admits only 2xlarge and
    # 4xlarge, and 8000m exceeds a 2xlarge's 7910m ALLOCATABLE outright — before the
    # ~635m of daemonsets (guardduty 200m, cloudwatch 250m, kube-proxy 100m,
    # aws-node 25m, ebs-csi 10m, kubecost 50m) that leave ~7275m schedulable.
    # (This was ~685m/~7225m before fluent-bit's 50m came off with the
    # CloudWatch container-log pipeline; the conclusion is unchanged.) So
    # trimming daemonsets cannot help either; the constraint is structural.
    #
    # Nor is the request oversized: a k=4 pod runs 4 instances x 2 threads = 8 threads
    # of real work, ~4/3 of a k=3 pod's. The only waste is stranding — 8000m held on
    # ~15205m schedulable — and the pod leaves ~7.2 cores that the scheduler fills
    # with other pipeline pods whenever the batch has pending work. consolidationPolicy
    # WhenEmpty means Karpenter will not repack it afterwards, so the loss is real
    # only at the tail of a batch. That makes this a co-packing DENSITY question for
    # #75, whose levers are batch shape and instance floor — NOT a thread cut. Capping
    # cpu at 6 would emit --threads 1 at k=4 and serialize hemispheres.
    #
    # MEMORY IS SIZED FROM MEASURED PEAK, NOT ram_efficiency (#235). The previous
    # 6G/8G came from ram_efficiency 0.30 and was described as "~2.7x/1.9x headroom
    # over the mean". It was 0.43x-0.48x of the PEAK. Max pod_memory_working_set
    # over every parcellation pod of the 2026-08-10 200-subject batch:
    #
    #                 request     n   median      p95      max   max/request
    #     k<=3            6G    147   8.99 G  11.44 G  12.40 G      2.07x
    #     k=4             8G     75  13.94 G  16.29 G  17.42 G      2.18x
    #
    # EVERY k=4 pod exceeded its request; the median exceeded it by 74%. A 2xlarge
    # has only 14.82 G allocatable, so a k<=3 pod at p95 was holding 77% of the whole
    # node's kubepods limit while telling the scheduler it needed 6 G. 13G/18G clears
    # the observed max at both k and still fits its instance class (13 G + ~0.56 G of
    # daemonset requests < 14.82 G on a 2xlarge; 18 G < 30.4 G on a 4xlarge, leaving
    # room for the ~7.2 spare cores' worth of co-tenants). The raise is therefore
    # close to free: `cpu: 6` already makes a k<=3 pod near-sole-tenant on a 2xlarge.
    #
    # This is the #129 lesson applied here — see docs/pipelines.md on segment-subregions:
    # ram_efficiency is a LIFETIME AVERAGE and is structurally blind to a peak. It is
    # not a sizing input. The two steps in this pipeline sized from cgroup peaks
    # (segment-subregions-dl, fsqc) are the only two whose max/request is below 1.0.
    #
    # STILL NO MEMORY LIMIT, but NOT for the reason previously given here ("an
    # underestimate should degrade to burst, not to an OOM" — it degraded to an OOM
    # anyway, at the kubepods.slice level). The reason is that a limit cannot address
    # what actually killed cloudpipe-zkrmj on 2026-08-11, and a limit tight enough to
    # be useful would convert rare legitimate bursts into new deterministic failures.
    # What the raised REQUEST buys is the thing the limit was wanted for: the scheduler
    # now reserves what the pod actually takes, so the pod can no longer be a
    # node-pressure victim of a co-tenant packed into memory it was already using.
    #
    # WHAT KILLED zkrmj, for the record, because it is NOT a sizing miss and must not
    # be "fixed" by raising memory again. Kernel dmesg,
    # /aws/containerinsights/cloudpipe/host, node ip-10-0-46-230, 00:41:35Z:
    #
    #     [  pid  ] ... rss_anon ...  name          (rss_anon is in 4 KB PAGES)
    #     [  81799]      118799       mri_normalize     464 MB
    #     [  81847]      118718       mri_normalize     464 MB
    #     [  82259]     6807079       mri_normalize   25.97 GiB   <- victim
    #     [  82365]      102425       mri_normalize     400 MB
    #     oom-kill: constraint=CONSTRAINT_MEMCG, oom_memcg=/kubepods.slice,
    #               task=mri_normalize, pid=82259
    #
    # ONE mri_normalize held 25.97 GiB of ANONYMOUS (unreclaimable) RSS during
    # Intensity Normalization2 while its three siblings — same binary, same stage,
    # same 256^3 uchar inputs — sat at 464/464/400 MB. A 57x single-process outlier,
    # i.e. an allocation fault, NOT demand that scales with k or with the data.
    #
    # DO NOT restate this as "four concurrent streams are ~14 G" (an earlier draft of
    # this comment did). The kernel table above is the whole pod's process list at the
    # OOM instant: the three healthy streams held ~1.3 G COMBINED. The ~14 G median in
    # the table above is pod_memory_working_set across all stages INCLUDING page cache,
    # not four concurrent normalize processes. The request sizing stands on those pod
    # peaks; the per-process story is separate and much smaller.
    #
    # No request and no limit prevents a runaway of that size — but a per-process
    # RLIMIT_AS does, and the args block below now sets one (ulimit -v 8G) so a repeat
    # loses one session instead of the whole workflow. The node was at 74.9% of
    # capacity with one under-request co-tenant, so the co-tenancy story in #235 is
    # not what happened either.
    #
    # RULED OUT — intensity scaling. mri_info-level and intensity-statistics checks on
    # all four sessions of sub-R4PV7WZ3 come back clean: every volume is 256^3 uchar
    # (aseg int16), 0-255, no float and no out-of-range values, and the FIRST
    # mri_normalize in the same pod (nu.mgz -> T1.mgz) prints "white matter peak found
    # at 110" for all four and exits 0 at ~572 MB max RSS. Measured WM mode is
    # 110/110/109/109 and WM mean 104.5/104.5/103.1/104.5. A pre-flight mri_info gate
    # would be a NO-OP here; do not add one. The one real outlier in the victim session
    # (ses-04A) is segmentation extent, not intensity: 313,587 WM voxels vs 404-441k in
    # its siblings, and 1211 control points removed vs 292/593/366.
    #
    # SOURCE READ (mri_normalize.cpp / utils/mrinorm.cpp @ 4d15e6a) — see docs/pipelines.md:
    #   - Do NOT read the last log line as the crash site. mri_normalize never calls
    #     setbuf/setvbuf, so stdout is block-buffered and SIGKILL discards the pending
    #     buffer. The last unconditional fflush is mri_normalize.cpp:907, so everything
    #     after it (MRI3dGentleNormalize, both MRI3dNormalize passes) is invisible.
    #   - No allocation on this path exceeds one 256^3 volume (<=67 MB as float); the
    #     count-scaled callocs in mrinorm.cpp are all in the -f / label paths this
    #     command does not take. 25.97 GiB needs ~400 volume-sized allocations at once,
    #     which is an allocation fault, not data-scaled demand.
    #   - MRIbuildBiasImage (mrinorm.cpp:1347) does leak a volume per call — it ignores
    #     its mri_bias output parameter and re-MRIclones at line 1358 without freeing.
    #     At num_3d_iter=2 that is ~134 MB. Real, but not the 26 GiB.
    #
    # The sampler in the args block below emits cgroup v2 memory.peak plus the
    # anon/file split, so the NEXT batch replaces the table above with a number that
    # separates real demand from reclaimable page cache (pod_memory_working_set
    # includes active page cache, so the figures above are an upper bound).
    #
    # ephemeral-storage scales with k here (unlike the other anatomical steps,
    # which take a flat 20G) because this pod holds the most at once: the
    # template, every session directory, surface intermediates for all k
    # timepoints in parallel, and the output tarballs during upload.
    podSpecPatch: |
      containers:
        - name: main
          resources:
            requests:
              cpu: '{{=len(jsonpath(inputs.parameters.T1w_sessions, "$[*]"))*2 > 4 ? len(jsonpath(inputs.parameters.T1w_sessions, "$[*]"))*2 : 4}}'
              memory: '{{=len(jsonpath(inputs.parameters.T1w_sessions, "$[*]")) > 3 ? 18 : 13}}G'
              ephemeral-storage: '{{=12 + 4 * len(jsonpath(inputs.parameters.T1w_sessions, "$[*]"))}}G'

    nodeSelector:
      karpenter.sh/nodepool: cpu-heavy-nodepool

    volumes:
      - name: work
        emptyDir: {}

    initContainers:
      # recon-surf.sh registers each timepoint to fsaverage, which is not carried
      # in either the template or the per-session scratch tarballs.
      - name: download-fsaverage
        image: "{{workflow.parameters.ecr-registry}}/cloudpipe/python:sha-229e7240327b18c2efad1bc4da083870f7f379a8"
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: 256M
            cpu: '1'
        mirrorVolumeMounts: true
        env:
          - name: BUCKET
            value: "{{workflow.parameters.bucket}}"
        command: [python]
        args:
          - -c
          - |
            import boto3, os
            from pathlib import Path

            dest = Path("/work/subjects/fsaverage")
            if dest.exists():
                print("fsaverage already present, skipping download.", flush=True)
            else:
                s3 = boto3.client('s3')
                bucket = os.environ['BUCKET']
                prefix = 'config/fsaverage/'
                paginator = s3.get_paginator('list_objects_v2')
                for page in paginator.paginate(Bucket=bucket, Prefix=prefix):
                    for obj in page.get('Contents', []):
                        key = obj['Key']
                        rel = key[len(prefix):]
                        if not rel:
                            continue
                        local = dest / rel
                        local.parent.mkdir(parents=True, exist_ok=True)
                        s3.download_file(bucket, key, str(local))
                print("fsaverage downloaded.", flush=True)

    container:
      image: "{{workflow.parameters.ecr-registry}}/cloudpipe/fastsurfer:sha-2478b13eb1e5e4cb901c37f03effcf43b9ee0dad"
      imagePullPolicy: IfNotPresent

      volumeMounts:
      - name: work
        mountPath: /work

      env:
        - name: FS_LICENSE
          value: /opt/freesurfer/.license
        - name: SUBJECTS_DIR
          value: /work/subjects

        # The TOTAL cpu request, from the podSpecPatch above. --threads is derived
        # from it per --parallel instance rather than written in the master
        # template, so there is one place to change and no cross-file drift.
        - name: CPU_REQUEST
          valueFrom:
            resourceFieldRef:
              containerName: main   # Argo's name for the user container
              resource: requests.cpu
              divisor: "1"          # rounds UP to whole cores; keep cpu integral

      command: [bash, -c]
      args:
        - |
          SD=/work/subjects
          BASE={{workflow.parameters.subjID}}_template

          # See the equivalent note in fast-tmpl: an interrupted upstream step can
          # exit 0 and publish a tarball carrying scripts/IsRunning.*, which would
          # wedge FastSurfer here even though this emptyDir is fresh. This step
          # reassembles SUBJECTS_DIR from TWO upstream tarballs (B and C), so it
          # has the most inherited state of any anatomical pod.
          find "$SD" -name '*IsRunning*' -delete

          # --threads is the per-instance share of the pod's TOTAL cpu request, and
          # the argstring already carries `--parallel K` for the same K. Deriving it
          # here rather than in the master template is what makes the resources block
          # the single source of truth for both numbers.
          K=$(python3 -c "import json,sys; print(len(json.loads(sys.argv[1])))" '{{inputs.parameters.T1w_sessions}}')
          THREADS=$(( CPU_REQUEST / K ))
          # Floor of 2. Below it recon-surf.sh takes its serial-hemisphere branch
          # (threads==1 -> ParallelHemi=false), which roughly doubles the surface
          # stage instead of halving the threads. max(4,2k) never actually trips
          # this — the guard is here so a future cpu trim fails loudly and visibly
          # rather than silently paying 2x wall time on the longest step.
          if [[ "$THREADS" -lt 2 ]]; then
            echo "WARNING: cpu request ${CPU_REQUEST} over K=${K} sessions gives --threads ${THREADS}," >&2
            echo "         which serializes hemispheres in recon-surf.sh. Using 2; raise cpu to 2*K." >&2
            THREADS=2
          fi
          echo "cpu request=${CPU_REQUEST} K=${K} --threads=${THREADS} (threads_hemi=$((THREADS / 2)))" >&2

          # Memory instrumentation (#235). The sizing above had to be reconstructed
          # from CloudWatch after the fact because this step carried no sampler; the
          # numbers it replaced came from ram_efficiency, a lifetime AVERAGE that is
          # structurally blind to a peak. `anon` is the unreclaimable half of the
          # footprint and `file` is page cache the kernel drops under pressure —
          # pod_memory_working_set folds the two together, so only this split can say
          # whether the 13G/18G request is real demand or cache. 30 s gives enough
          # shape over a 20-40 min step without flooding the archived log.
          ( while :; do
              awk -v t="$(date -u +%H:%M:%S)" '
                /^anon /{a=$2} /^file /{f=$2}
                END {printf "[mem] %s anon=%.2fG file=%.2fG\n", t, a/1e9, f/1e9}' \
                /sys/fs/cgroup/memory.stat 2>/dev/null
              sleep 30
            done ) >&2 &
          MEMMON=$!

          # PER-PROCESS ADDRESS-SPACE CAP (#235). RLIMIT_AS is per-process and is
          # inherited by every child, so this caps each FreeSurfer binary
          # individually — it is NOT an aggregate budget across the K instances.
          #
          # WHY: what killed cloudpipe-zkrmj was ONE mri_normalize at 26.0 GiB RSS /
          # 30.2 GiB VA while its three siblings sat at 464/464/400 MB. Because
          # memory.oom.group is set on this container, that single runaway took
          # argoexec, bash and all four brun_fastsurfer instances with it, losing the
          # whole workflow. Capping address space converts that into one failed
          # mri_normalize (malloc returns NULL -> FreeSurfer ErrorExit) and one failed
          # session, leaving the other K-1 to finish.
          #
          # WHY 8G: the largest per-process max-RSS FreeSurfer's own FSTIME wrapper
          # recorded across four COMPLETE k=4 parcellation runs (267g8, 28dmm, 2hpvg,
          # 2sq7m) is 1.93 GB. 8G is 4.1x that, and the runaway is cut at ~1/4 of the
          # VA it actually reached. It also holds at every k: one capped runaway plus
          # K-1 healthy streams (~0.5 G each) stays under the 13G/18G request.
          #
          # RLIMIT_AS caps VIRTUAL address space, not RSS, so the margin is only real
          # while FreeSurfer's VA/RSS ratio stays near 1 — it was 1.06 on the healthy
          # processes in the zkrmj kernel dump. glibc can reserve up to 8*ncores 64 MB
          # malloc arenas under thread contention, but --threads 2 per instance keeps
          # that to a few; if a future cpu raise makes arenas material, set
          # MALLOC_ARENA_MAX rather than inflating this number.
          #
          # Scoped to a subshell on purpose: RLIMIT_AS cannot be raised again by an
          # unprivileged process, so leaking it into the extract_qc.py loop below
          # would cap those too for no reason.
          ( ulimit -v $((8 * 1024 * 1024))   # KB
            exec /fastsurfer/brun_fastsurfer.sh {{inputs.parameters.argstring}} --threads "$THREADS" )
          FASTSURFER_EXIT=$?
          kill $MEMMON 2>/dev/null
          # cgroup v2 memory.peak is an exact kernel-maintained high-water mark for
          # this container, not a sample, so a sub-30s transient cannot hide from it.
          echo "[mem] K=${K} surface-stage peak=$(awk '{printf "%.2f", $1/1e9}' /sys/fs/cgroup/memory.peak 2>/dev/null || echo n/a)G" >&2

          # PER-SESSION COMPLETION GUARD (#245). brun_fastsurfer.sh EXITS 0 EVEN WHEN
          # A SESSION FAILED. Measured directly on sub-R4PV7WZ3 (the #235 repro,
          # 2026-08-12): ses-04A died in 3d normalization with
          #
          #   error: HISTOalloc(2001892225): could not allocate histogram
          #   recon-all -s ses-04A exited with ERRORS
          #
          # while the wrapper reported `brun_fastsurfer exit=0` and the other three
          # sessions finished cleanly. Without this guard the step exits 0 and
          # publishes a ses-04A tarball containing scripts/IsRunning.lh+rh, 66 entries
          # and no white/pial surfaces. `check_fastsurfer_derivatives` is a bare
          # head_object, so that tarball marks the subject PERMANENTLY complete: the
          # anatomical phase is skipped on every future submission and the subject can
          # never self-heal, while registration and func-preproc run against a surf/
          # missing its principal outputs.
          #
          # The fix is to not publish it. Every per-session output artifact is
          # `optional: true`, so deleting an incomplete session directory means Argo
          # skips that artifact — the derivative is then genuinely absent, the
          # existence check correctly reports the session missing, and the next
          # submission re-runs the phase. Self-healing is restored by making the
          # failure legible rather than by adding a second source of truth.
          #
          # Rejection criteria, cheapest-first: an IsRunning marker is FastSurfer's own
          # crashed/interrupted flag (the same hazard the input-side
          # `find -name '*IsRunning*' -delete` above defends against, applied to
          # outputs), and the four surface files are the principal outputs everything
          # downstream consumes. Both are directory reads — no tarball inspection.
          COMPLETE_SESSIONS=""
          INCOMPLETE_SESSIONS=""
          for ses in $(python3 -c "import json,sys; print(' '.join(json.loads(sys.argv[1])))" '{{inputs.parameters.T1w_sessions}}'); do
            sesdir="${SD}/${ses}"
            reason=""
            if [[ ! -d "$sesdir" ]]; then
              reason="session directory absent"
            elif compgen -G "${sesdir}/scripts/IsRunning.*" > /dev/null; then
              reason="scripts/IsRunning.* present (recon-all did not finish)"
            else
              for surf in lh.white rh.white lh.pial rh.pial; do
                if [[ ! -s "${sesdir}/surf/${surf}" ]]; then
                  reason="surf/${surf} missing or empty"
                  break
                fi
              done
            fi
            if [[ -n "$reason" ]]; then
              echo "REJECTED ${ses}: ${reason} — not publishing its tarball (#245)." >&2
              rm -rf "$sesdir"
              INCOMPLETE_SESSIONS="${INCOMPLETE_SESSIONS} ${ses}"
            else
              COMPLETE_SESSIONS="${COMPLETE_SESSIONS} ${ses}"
            fi
          done
          echo "[guard] complete:${COMPLETE_SESSIONS:- none} | rejected:${INCOMPLETE_SESSIONS:- none}" >&2

          # Nothing usable came out of the pod. Exit 1 rather than 75: the one observed
          # cause is a deterministic, data-dependent allocation in mri_normalize, and
          # retrying it re-runs an identical failure — the #115 reasoning that keeps
          # 137 out of the retry expression.
          if [[ -z "$COMPLETE_SESSIONS" ]]; then
            echo "ERROR: no session passed the completion guard; nothing to publish." >&2
            exit 1
          fi

          # QC only for sessions that will actually be published — a rejected session's
          # directory is gone, and QC for a derivative nobody can read is noise in the
          # anat-qc table.
          for ses in $COMPLETE_SESSIONS; do
            python3 /app/extract_qc.py \
              --subjects-dir "$SD" \
              --subj {{workflow.parameters.subjID}} \
              --ses "$ses" \
              --pipeline cloudpipe_minproc || true   # QC metrics are non-critical
          done

          # Modify files and add links as necessary to allow future subfield segmentation of
          # subcortical subfields/subregions using the longitudinal model. This bridge is
          # what writes the plain `base-tps` timepoint list that the segment-subregions
          # step reads; its cortical-ribbon step needs the base template's white surfaces
          # (surf/lh.white, mri/filled.mgz). Do NOT swallow its failure (was `|| true`) —
          # a missing base-tps otherwise surfaces two steps later as a cryptic
          # "base-tps: No such file or directory".
          python3 /fastsurfer/recon_surf/long_compat_segmentHA.py \
            --sd "$SD" \
            --sid "$BASE" \
            --fs_license /opt/freesurfer/.license \
            --threads 2
          COMPAT_EXIT=$?

          # base-tps is the artifact segment-subregions hard-depends on. If the bridge
          # did not produce it (e.g. base template surfaces missing after an interrupted
          # template-parcellation), fail here with a retryable code (75 = EX_TEMPFAIL, per
          # retryStrategy) so the anatomical phase re-runs rather than promoting an
          # unusable template.
          #
          # This used to exit 137, which collided with a genuine kernel OOMKill and
          # forced the retry expression to treat both alike. 75 is ours alone; nothing
          # in the cluster emits it. See issue #115.
          if [[ ! -s "${SD}/${BASE}/base-tps" ]]; then
            echo "ERROR: long_compat_segmentHA.py did not produce ${BASE}/base-tps (exit ${COMPAT_EXIT})." >&2
            echo "       base template is incomplete (white surfaces missing?); forcing retry (exit 75)." >&2
            exit 75
          fi

          # base-tps is written from the template's timepoint list, not from what is on
          # disk, so a session the guard above rejected is still named in it. Leaving it
          # there turns one bad session into a segment-subregions failure for the whole
          # subject — the step reads base-tps and looks for a directory that no longer
          # exists. Prune the rejected names so the k-1 good sessions still get their
          # subregion outputs.
          if [[ -n "$INCOMPLETE_SESSIONS" ]]; then
            # One line on purpose: a YAML literal block scalar ends at the first line
            # indented less than the block, so a column-0 python body would terminate
            # the script, and an indented one would be an IndentationError.
            python3 -c "import pathlib, sys; p = pathlib.Path(sys.argv[1]); rej = set(sys.argv[2:]); kept = [ln for ln in p.read_text().splitlines() if ln.strip() not in rej]; p.write_text('\n'.join(kept) + '\n'); print('[guard] pruned', sorted(rej), 'from base-tps;', len(kept), 'timepoints remain')" \
              "$SD/$BASE/base-tps" $INCOMPLETE_SESSIONS
          fi

          exit $FASTSURFER_EXIT
