apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: fmri-first-level-proc
  namespace: argo-workflows

###########################################################################
# First-level analysis for one subject, from cloudpipe's own func outputs
# (OpenSpec change first-level-direct-inputs; replaces ABCD_fmri_orchestrator_S3).
#
#   list-sessions  the subject's sessions with a func _complete.json
#                  (stage_first_level.py list-sessions)
#   first-level    one pod per session: download derivatives/func/{subj}/{ses}/,
#                  run fmri-first-level-abcd on it (staging and every analysis live
#                  in that repo), publish to derivatives/first_levels/{subj}/{ses}/
#                  with _complete.json last
#
# Sessions run independently: one session's failure, retry or deadline does not
# touch another's. A session with no usable rest runs skips rest, the marker says
# why, and the n-back analyses still run. subjID may be given with or without its
# sub- prefix. Submitted by the first-level-queue-manager Prefect flow.
###########################################################################

spec:
  serviceAccountName: argo-workflows-runner

  workflowMetadata:
    annotations:
      karpenter.sh/do-not-disrupt: "true"
    labels:
      pipeline: fmri-first-level-proc
      subjectid: "{{workflow.parameters.subjID}}"

  podMetadata:
    labels:
      app: fmri-first-level-proc
      subjectid: "{{workflow.parameters.subjID}}"

  podGC:
    strategy: OnWorkflowCompletion

  ttlStrategy:
    secondsAfterCompletion: 86400

  podDisruptionBudget:
    minAvailable: "100%"

  # Backstop only. Each step carries its own deadline below; sessions run in
  # parallel, so this is one session's worst case plus retries, not a sum.
  activeDeadlineSeconds: 14400

  arguments:
    parameters:
      - name: subjID

      # Private ECR registry prefix — set by Terraform in cloudpipe-config.
      - name: ecr-registry
        valueFrom:
          configMapKeyRef:
            name: cloudpipe-config
            key: ecr_registry

      # Data bucket: derivatives/func/ is read, derivatives/first_levels/ written.
      - name: bucket
        valueFrom:
          configMapKeyRef:
            name: cloudpipe-config
            key: bucket

      # "true": run only the sessions with no first-level _complete.json, leaving the
      # subject's other sessions alone. For a session-scoped reprocess
      # (scripts/reprocess_t1w_mni.py, #1105), which flushes only what it replaced;
      # the first-level-queue-manager flow sets it from its missing_only parameter.
      # "false" (default) is the original behaviour: every complete func session.
      - name: missing-only
        value: "false"

  volumes:
    - name: scratch
      emptyDir:
        sizeLimit: 300Gi

  entrypoint: first-level-subject

  templates:

  - name: first-level-subject
    dag:
      tasks:
        - name: list-sessions
          template: list-sessions
        - name: first-level
          depends: list-sessions
          template: first-level-session
          withParam: "{{tasks.list-sessions.outputs.parameters.sessions}}"
          arguments:
            parameters:
              - name: ses
                value: "{{item.ses}}"

  - name: list-sessions
    metadata:
      labels:
        cloudpipe.io/phase: first-level
        cloudpipe.io/step: list-sessions
    activeDeadlineSeconds: 900
    retryStrategy:
      limit: "4"
      retryPolicy: Always
      expression: '(lastRetry.message matches "pod deleted|imminent node shutdown|exit code (64|75|143)" || lastRetry.exitCode in ["0", "64", "75", "143"]) && not (lastRetry.message matches "specified key does not exist|longer than the specified deadline")'
      backoff:
        duration: "1m"
        factor: "2"
        cap: "5m"
    nodeSelector:
      karpenter.sh/nodepool: first-level-nodepool
    container:
      image: "{{workflow.parameters.ecr-registry}}/cloudpipe/fmri-first-level-proc@sha256:257a40faaf45fe0402722efbd6c2fc38fab77a09d926feba6eb95646511d59e9"
      imagePullPolicy: IfNotPresent
      command: ["python3", "/app/stage_first_level.py"]
      args:
        - list-sessions
        - --subj
        - "{{workflow.parameters.subjID}}"
        - --bucket
        - "{{workflow.parameters.bucket}}"
        - --out
        - /tmp/sessions.json
      # An env var, not a flag: see MISSING_ONLY_ENV in stage_first_level.py.
      env:
        - name: FIRST_LEVEL_MISSING_ONLY
          value: "{{workflow.parameters.missing-only}}"
      resources:
        requests:
          cpu: "250m"
          memory: 512Mi
        limits:
          memory: 1Gi
    outputs:
      parameters:
        - name: sessions
          valueFrom:
            path: /tmp/sessions.json

  - name: first-level-session
    metadata:
      labels:
        cloudpipe.io/phase: first-level
        cloudpipe.io/step: first-level
    inputs:
      parameters:
        - name: ses
    # One session's staging plus three analyses; the old per-subject cap covered
    # up to four sessions in sequence.
    activeDeadlineSeconds: 7200
    retryStrategy:
      # Sized for spot churn: consecutive reclaims on one long step are routine on
      # the spot-only nodepools. activeDeadlineSeconds above is the real ceiling
      # here — retries cannot extend it. See issue #115.
      limit: "8"
      # Was OnFailure, which could never honour the spot clause in the expression
      # below: a reclaimed pod lands in phase Error, not Failed, and OnFailure
      # retries Failed only. The expression is what filters retries here; the policy
      # just has to be permissive enough to let it run.
      retryPolicy: Always
      # Infrastructure codes only. 64/143 = executor / SIGTERM on node teardown.
      # 75 = EX_TEMPFAIL, the stager's exit on an S3 error. 1 (a session failure:
      # a bad input, a package bug, a tool failure) is deliberately absent, and so
      # is 137: both are deterministic, so a retry only repeats them.
      # The codes are matched in the message too: a pod that dies in its init or
      # wait container never populates exitCode (#277).
      expression: '(lastRetry.message matches "pod deleted|imminent node shutdown|exit code (64|75|143)" || lastRetry.exitCode in ["0", "64", "75", "143"]) && not (lastRetry.message matches "specified key does not exist|longer than the specified deadline")'
      backoff:
        duration: "1m"
        factor: "2"
        # cap bounds each individual delay (maxDuration would abort the retries
        # instead): 1+2+4+5+5+5+5+5 = 32m worst case.
        cap: "5m"

    nodeSelector:
      karpenter.sh/nodepool: first-level-nodepool

    container:
      image: "{{workflow.parameters.ecr-registry}}/cloudpipe/fmri-first-level-proc@sha256:257a40faaf45fe0402722efbd6c2fc38fab77a09d926feba6eb95646511d59e9"
      imagePullPolicy: IfNotPresent

      volumeMounts:
        - name: scratch
          mountPath: /scratch

      # Thread budget for fmri-first-level-proc (`num_cores: auto` in its
      # proc_config_final.yaml reads OMP_NUM_THREADS, capped at the cgroup's CPU limit).
      # Projected from requests.cpu so the resources block below stays the single
      # source of truth and the thread count can never drift from the reservation.
      env:
        - name: OMP_NUM_THREADS
          valueFrom: &firstLevelCpuRequest
            resourceFieldRef:
              containerName: main   # Argo's name for the user container
              resource: requests.cpu
              divisor: "1"          # rounds UP to whole cores; keep cpu integral
        - name: MKL_NUM_THREADS
          valueFrom: *firstLevelCpuRequest
        - name: OPENBLAS_NUM_THREADS
          valueFrom: *firstLevelCpuRequest

      resources:
        requests:
          cpu: "1"          # integral, = limit, = OMP_NUM_THREADS; design.md D10 has the open probe
          memory: 10Gi
          # fmri-first-level-proc 4.0.0+cp.11 keeps the staged runs and the stages'
          # temporaries uncompressed (four to five times their .nii.gz size), so a 2 n-back
          # + 4 rest session's work dir peaked at 22.3 GB (20.8 GiB), in rest's residuals
          # stage. ~1.5x that, for sessions with more or longer runs. The scratch volume's
          # sizeLimit (300Gi) stays the hard cap; this request is what Karpenter packs by.
          ephemeral-storage: 32Gi
        limits:
          cpu: "1"
          memory: 10Gi

      command: ["python3", "/app/stage_first_level.py"]
      args:
        - run
        - --subj
        - "{{workflow.parameters.subjID}}"
        - --ses
        - "{{inputs.parameters.ses}}"
        - --bucket
        - "{{workflow.parameters.bucket}}"
        - --workdir
        - /scratch/first-level
