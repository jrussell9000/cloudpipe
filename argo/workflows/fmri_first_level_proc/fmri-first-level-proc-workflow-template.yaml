apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: fmri-first-level-proc
  namespace: argo-workflows

spec:
  serviceAccountName: argo-workflows-runner

  workflowMetadata:
    annotations:
      karpenter.sh/do-not-disrupt: "true"
    labels:
      pipeline: fmri-first-level-proc
      subjectid: "{{workflow.parameters.subjID}}"

  podMetadata:
    labels:
      app: fmri-first-level-proc
      subjectid: "{{workflow.parameters.subjID}}"

  podGC:
    strategy: OnWorkflowCompletion

  ttlStrategy:
    secondsAfterCompletion: 86400

  podDisruptionBudget:
    minAvailable: "100%"

  # 2-hour hard cap — matches the Batch job timeout
  activeDeadlineSeconds: 7200

  retryStrategy:
    # Sized for spot churn: consecutive reclaims on one long step are routine on
    # the spot-only nodepools. Note activeDeadlineSeconds above (7200) is the real
    # ceiling here — retries cannot extend it, so the budget below is an upper
    # bound that the 2h cap may cut short. See issue #115.
    limit: "8"
    # Was OnFailure, which could never honour the spot clause in the expression
    # below: a reclaimed pod lands in phase Error, not Failed, and OnFailure
    # retries Failed only. The expression is what filters retries here; the policy
    # just has to be permissive enough to let it run.
    retryPolicy: Always
    # Infrastructure codes only. 64/143 = executor / SIGTERM on node teardown,
    # never emitted by our scripts. 75 = EX_TEMPFAIL, reserved for the "a reclaim
    # truncated my output, re-run me" guards in the fastsurfer templates. 137 is
    # deliberately absent: a real OOMKill is deterministic (#120, #129, #134 each
    # needed a config change, not a retry), so retrying it only burns the enlarged
    # budget on an identical failure.
    # The codes are matched in the message too: a pod that dies in its init or wait
    # container never populates exitCode, so that arm alone is dead for the whole
    # artifact-staging class (#277). A missing artifact KEY is excluded, though:
    # its producer was skipped or failed, and a consumer retry cannot re-run the
    # producer. See the cloudpipe master template for the detail.
    expression: '(lastRetry.message matches "pod deleted|imminent node shutdown|exit code (64|75|143)" || lastRetry.exitCode in ["64", "75", "143"]) && not (lastRetry.message matches "specified key does not exist|longer than the specified deadline")'
    backoff:
      duration: "1m"
      factor: "2"
      # cap bounds each individual delay (maxDuration would abort the retries
      # instead): 1+2+4+5+5+5+5+5 = 32m worst case, vs 7m at the old limit of 3.
      cap: "5m"

  arguments:
    parameters:
      - name: subjID

  volumes:
    - name: scratch
      emptyDir:
        sizeLimit: 300Gi

  entrypoint: first-level-proc-template

  templates:

  - name: first-level-proc-template
    metadata:
      labels:
        cloudpipe.io/phase: first-level
        cloudpipe.io/step: orchestrate

    nodeSelector:
      karpenter.sh/nodepool: first-level-nodepool

    container:
      image: "<YOUR_AWS_ACCOUNT_ID>.dkr.ecr.<YOUR_AWS_REGION>.amazonaws.com/cloudpipe/fmri-first-level-proc@sha256:1423bedb9da05e9acea28b547f952037629f54ac7bd125280d17bd2a9a7d4bd5"
      imagePullPolicy: IfNotPresent

      volumeMounts:
        - name: scratch
          mountPath: /scratch

      resources:
        requests:
          cpu: "1200m"
          memory: 10Gi
          ephemeral-storage: 20Gi
        limits:
          cpu: "2"
          memory: 10Gi

      # Override the image ENTRYPOINT to strip the "sub-" prefix before
      # passing the NDAR ID to orchestrate_first_level.py, which expects
      # a bare ID (e.g. "NDARABC123") and prepends "sub-" itself.
      command: ["/bin/bash", "-c"]
      args:
        - |
          cd /app/ABCD_fmri_orchestrator_S3 && \
          python3 orchestrate_first_level.py \
            --orchestrate_config orch_config_final.yaml \
            --proc_config proc_config_final.yaml \
            --subj_id "${SUBJ_ID#sub-}"
      env:
        - name: SUBJ_ID
          value: "{{workflow.parameters.subjID}}"
