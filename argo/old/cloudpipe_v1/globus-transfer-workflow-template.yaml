apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: globus-transfer
  namespace: argo-workflows

spec:
  templates:

  ###########################################################################
  # Entry point — called once per subject from the master DAG.
  #
  # Submits a single Globus transfer task containing all subject files and
  # polls until the transfer succeeds or fails.  Uses sync_level=checksum so
  # re-runs skip files already present at the destination.
  #
  # Credentials are read from the 'globus-credentials' Kubernetes Secret
  # (synced from AWS Secrets Manager via External Secrets).  Each lab or user
  # stores their own refresh token under globus/refresh-token in Secrets
  # Manager and maps it to that secret — no changes to this template needed.
  #
  # Inputs:
  #   source-collection-id  UUID of the remote Globus collection
  #   source-base-path      Collection root on the source (subject ID appended automatically)
  #                         e.g. /abcd/raw
  #   dest-collection-id    UUID of the S3-backed GCS collection
  #   dest-base-path        Collection root on the destination (subject ID appended automatically)
  #                         e.g. /mmps_mproc
  #   scan-types            JSON array of BIDS scan types to transfer.
  #                         Valid values: T1w, T2w, rest, nback, sst, mid, dwi
  #                         e.g. '["T1w", "T2w", "rest", "dwi"]'
  #                         Files are discovered across all available sessions
  #                         by listing the source collection at runtime.
  ###########################################################################

  ###########################################################################
  # Starts the Globus Connect Server EC2 instance and waits until it passes
  # its status checks before the transfer step runs.  The instance ID is
  # read from SSM Parameter Store so the template stays infrastructure-agnostic.
  ###########################################################################

  - name: start-globus-instance-template
    nodeSelector:
      karpenter.sh/nodepool: cpu-light-nodepool

    script:
      image: public.ecr.aws/l9e7l1h1/cloudpipe/bravepy:latest
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          memory: 128M
          cpu: '100m'
          ephemeral-storage: 200M
      command: ["sh", "-c"]
      source: |
        python - <<EOF
        import boto3
        import sys

        region = '<YOUR_AWS_REGION>'
        ssm = boto3.client('ssm', region_name=region)
        ec2 = boto3.client('ec2', region_name=region)

        instance_id = ssm.get_parameter(
            Name='/cloudpipe/globus/instance-id'
        )['Parameter']['Value']

        state = ec2.describe_instance_status(
            InstanceIds=[instance_id],
            IncludeAllInstances=True
        )['InstanceStatuses'][0]['InstanceState']['Name']

        if state == 'running':
            print(f"Instance {instance_id} is already running.")
        else:
            print(f"Starting instance {instance_id} (current state: {state})...")
            ec2.start_instances(InstanceIds=[instance_id])
            waiter = ec2.get_waiter('instance_status_ok')
            waiter.wait(
                InstanceIds=[instance_id],
                WaiterConfig={'Delay': 15, 'MaxAttempts': 40}
            )
            print(f"Instance {instance_id} is ready.")
        EOF

  - name: globus-transfer-template
    inputs:
      parameters:
        - name: source-collection-id
        - name: source-base-path
        - name: dest-collection-id
        - name: dest-base-path
        - name: scan-types

    nodeSelector:
      karpenter.sh/nodepool: cpu-light-nodepool

    container:
      image: public.ecr.aws/l9e7l1h1/cloudpipe/globus:latest
      imagePullPolicy: IfNotPresent

      resources:
        requests:
          memory: 256M
          cpu: '100m'
          ephemeral-storage: 200M

      env:
        - name: GLOBUS_NATIVE_APP_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: globus-credentials
              key: native-app-client-id
        - name: GLOBUS_REFRESH_TOKEN
          valueFrom:
            secretKeyRef:
              name: globus-credentials
              key: refresh-token

      command: [python, /app/transfer.py]
      args:
        - --subject-id
        - '{{workflow.parameters.subjID}}'
        - --source-collection-id
        - '{{inputs.parameters.source-collection-id}}'
        - --source-base-path
        - '{{inputs.parameters.source-base-path}}'
        - --dest-collection-id
        - '{{inputs.parameters.dest-collection-id}}'
        - --dest-base-path
        - '{{inputs.parameters.dest-base-path}}'
        - --scan-types
        - '{{inputs.parameters.scan-types}}'
