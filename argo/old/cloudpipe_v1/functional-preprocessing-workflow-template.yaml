        optional: true



    nodeSelector:
      karpenter.sh/nodepool: cpu-heavy-nodepool

    # If FastSurfer has to start over due to pod deletion, it will leave behind the isRunning files
    # fmriprep will crash if these are present
    # initContainers:
    #   - name: clear-is-running
    #     image: public.ecr.aws/docker/library/alpine:latest
    #     imagePullPolicy: IfNotPresent
    #     command: ["find", "/data/sourcedata/freesurfer", "-name", "*IsRunning*", "-delete"]

    container:
      securityContext:
        runAsUser: 0
      # Pull from our public repository containing slightly modified fmriprep images
      image: public.ecr.aws/l9e7l1h1/cloudpipe/fmriprep:latest
      imagePullPolicy: IfNotPresent

      # Silencing the horde of Python warnings fmriprep spits out - seriously...
      env:
        - name: PYTHONWARNINGS
          value: "ignore"
        - name: MPLCONFIGDIR
          value: "/work/.cache/matplotlib"
        # Some smriprep components still look for this...
        - name: SUBJECTS_DIR
          value: "/data/sourcedata/freesurfer"

      resources:
        requests:
          memory: 8G
          cpu: '4'
          ephemeral-storage: 200G
        limits:
          cpu: '4'

      command: ["/bin/sh", "-c"]

      args:
        - |
          set -e # Exit immediately if any command fails

          FINAL_OUTPUT="/fmriprep_output"
          TEMP_OUTPUT="/tmp_output"

          echo "🚀 Starting fmriprep wrapper..."
          echo "📂 Writing temporary output to: $TEMP_OUTPUT"

          fmriprep \
          --nprocs 4 \
          --mem 8000 \
          --skip-bids-validation \
          --notrack \
          --fs-license-file=/data/.license \
          --fs-subjects-dir=/data/sourcedata/freesurfer \
          --work-dir=/work \
          --clean-workdir \
          --no-msm \
          --fs-no-resume \
          --ignore fieldmaps \
          --derivatives freesurfer=/data/sourcedata/freesurfer \
          --skull-strip-fixed-seed \
          --random-seed 52618 \
          /data \
          $TEMP_OUTPUT \
          participant

          echo "✅ fmriprep finished successfully."
          echo "📦 Moving artifacts from $TEMP_OUTPUT to $FINAL_OUTPUT..."

          mkdir -p $FINAL_OUTPUT
          mv $TEMP_OUTPUT/* $FINAL_OUTPUT

          echo "🎉 Done. Artifacts are ready for Argo upload."

    outputs:
      artifacts:
      - name: fmriprep-output
        path: /fmriprep_output/{{workflow.parameters.subjID}}/
        s3:
          endpoint: s3-accelerate.amazonaws.com
          bucket: '<YOUR_INPUT_S3_BUCKET>'
          key: 'derivatives/fmriprep/{{workflow.parameters.subjID}}/{{inputs.parameters.session}}/{{workflow.parameters.subjID}}_{{inputs.parameters.session}}_fmriprep-output.tar.gz'
          region: <YOUR_AWS_REGION>