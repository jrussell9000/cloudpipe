apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: func-preproc
  namespace: argo-workflows
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::<YOUR_AWS_ACCOUNT_ID>:role/argo-workflows-runner

spec:

  workflowMetadata:
    annotations:
      workflows.argoproj.io/title: "{{workflow.parameters.subjID}}"

  retryStrategy:
    limit: "3"
    retryPolicy: "OnFailure"
    # This expression ensures we only retry on infrastructure-level failures
    # or non-zero exit codes that look like preemptions.
    expression: 'lastRetry.message matches "pod deleted" || lastRetry.exitCode == 137 || lastRetry.exitCode == 143'
    backoff:
      duration: "10s"
      factor: "2"
      maxDuration: "3m"

  # podMetadata:
  #   labels:
  #     subjectid: "{{workflow.parameters.subjID}}"

  artifactRepositoryRef:
    key: cloudpipe-artifacts

  # Workflow pods should be deleted on workflow completion
  podGC:
    strategy: OnWorkflowCompletion

  # Maximum workflow runtime (https://argo-workflows.readthedocs.io/en/latest/walk-through/timeouts/)
  activeDeadlineSeconds: 43200

  # IRSA for running the workflow
  serviceAccountName: argo-workflows-runner

  # Time to live after workflow is completed, replaces ttlSecondsAfterFinished
  ttlStrategy:
    secondsAfterCompletion: 60

  podDisruptionBudget:
    minAvailable: "100%"

  templates:
  - name: func-preproc-steps
    inputs:
      parameters:
        - name: session
    steps:
    - - name: fmri-data-inventory-step
        template: fmri-data-inventory
        arguments:
          parameters:
            - name: session
              value: '{{inputs.parameters.session}}'

    - - name: fmriprep
        template: fmriprep-template
        arguments:
          parameters:
            - name: session
              value: '{{inputs.parameters.session}}'
        # Proceed when True (no existing fmriprep output found)
        when: '{{steps.fmri-data-inventory-step.outputs.result}} == True'

  - name: fmri-data-inventory
    inputs:
      parameters:
        - name: session

    securityContext:
      runAsUser: 0

    nodeSelector:
      karpenter.sh/nodepool: cpu-light-nodepool

    script:
      image: public.ecr.aws/l9e7l1h1/cloudpipe/bravepy:latest
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          memory: 256M
          ephemeral-storage: 300M
      command: ["sh", "-c"]

      env:
        - name: SUBJECT_ID
          value: "{{workflow.parameters.subjID}}"
        - name: SESSION
          value: '{{inputs.parameters.session}}'
        - name: BUCKET_NAME
          value: "<YOUR_INPUT_S3_BUCKET>"

      source: |

        #!/bin/sh
        # Install required Python packages quietly
        #python -m pip install -q --disable-pip-version-check --root-user-action=ignore boto3 botocore

        # Switch to python by using a bash heredoc
        python - <<EOF
        import boto3
        import os
        import re
        import sys

        from pathlib import PurePosixPath
        from botocore.exceptions import ClientError

        s3_client = boto3.client('s3')

        # Check if fmriprep output already exists for this subject
        # Note: Argo Workflows doesn't upload the output unless fmriprep was successful
        def check_for_existing_fmriprep_output(bucket_name:str, directory_path: str, file_name: str):
          s3_client = boto3.client('s3')

          # Construct the full S3 key (object path)
          # Ensure directory_path ends with a '/' if it represents a folder
          if not directory_path.endswith('/'):
              directory_path += '/'

          s3_key = directory_path + file_name

          try:
            # If an object is found at this path return True
            s3_client.head_object(Bucket=bucket_name, Key=s3_key)
            return('True')
          except ClientError as e:
            # If a 404 error is raised (no object exists at this location) return False
            if e.response['Error']['Code'] == '404':
              return('False')
            else:
              print(e)
              sys.exit(1)

        # Return the names of the fMRI tasks (including rest) available for this subject ID and session
        def find_tasks_in_s3(bucket: str, subject_id: str, session: str) -> set:
          prefix = f'mmps_mproc/{subject_id}/{session}/func/'
          found_tasks = set()

          paginator = s3_client.get_paginator('list_objects_v2')
          pages = paginator.paginate(Bucket=bucket, Prefix=prefix)

          for page in pages:
            if 'Contents' not in page:
              continue

            for obj in page.get('Contents', []):
              key = obj.get('Key', '')
              if key.endswith(('.nii', '.nii.gz')):
                filename = PurePosixPath(key).name
                match = re.search(r'task-([a-zA-Z0-9]+)', filename)
                if match:
                  task_name = match.group(1)
                  found_tasks.add(task_name)
          return found_tasks

        def main():
          subj_id = os.environ.get('SUBJECT_ID')
          session = os.environ.get('SESSION')
          bucket_name = os.environ.get('BUCKET_NAME')
          directory_path = f"derivatives/fmriprep/{subj_id}/{session}"
          file_name = "fmriprep-output.tar.gz"

          if not all([subj_id, session, bucket_name]):
            sys.exit(1)

          already_done = check_for_existing_fmriprep_output(bucket_name, directory_path, file_name)
          tasks = find_tasks_in_s3(bucket_name, subj_id, session)

          # Compare the list of available fMRI tasks against those we want to process (rest and nback)
          # and return 'True' if a match exists, 'False' otherwise
          target_tasks = {"rest", "nback"}

          # If there are tasks to process and processing isn't already done, print 'True'
          if tasks.intersection(target_tasks) and already_done == 'False':
            print("True")
          else:
            print("False")

        if __name__ == "__main__":
          main()

        # End of bash heredoc
        EOF

  - name: fmriprep-template

    inputs:
      parameters:
        - name: session

      artifacts:
      #--- BIDS Dataset Description ---# (fmriprep will fail to recognize the input if this is missing)
      - name: dataset-description
        path: /data/dataset_description.json
        s3:
          key: 'config/dataset_description.json'

      #--- Freesurfer License ---# (fmriprep uses Freesurfer tools, ergo a license is required)
      - name: fslicense
        path: /data/.license
        s3:
          key: 'config/fslicense'

      #--- FastSurfer Output ---#
      # see: https://fmriprep.org/en/stable/usage.html#using-a-previous-run-of-freesurfer
      # Here we pull in a segmented, parcellated, and within-subjects template aligned anatomical for the specified session
      # However, fmriprep is expecting a directory name matching the subject ID (NOT the session), so we'll just unpack to that path.
      - name: fastsurfer-long-output-reg2wstemplate
        path: /data/sourcedata/freesurfer/{{workflow.parameters.subjID}}_{{inputs.parameters.session}}
        s3:
          key: 'derivatives/fastsurfer/{{workflow.parameters.subjID}}/{{workflow.parameters.subjID}}_{{inputs.parameters.session}}_templated.tar.gz'

