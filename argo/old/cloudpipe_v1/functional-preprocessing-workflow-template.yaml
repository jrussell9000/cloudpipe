        path: /data/{{workflow.parameters.subjID}}/{{inputs.parameters.session}}/anat/{{workflow.parameters.subjID}}_{{inputs.parameters.session}}_run-01_T1w.nii.gz
        s3:
          key: 'mmps_mproc/{{workflow.parameters.subjID}}/{{inputs.parameters.session}}/anat/{{workflow.parameters.subjID}}_{{inputs.parameters.session}}_run-01_T1w.nii.gz'
      ## JSON
      - name: T1w-json
        path: /data/{{workflow.parameters.subjID}}/{{inputs.parameters.session}}/anat/{{workflow.parameters.subjID}}_{{inputs.parameters.session}}_run-01_T1w.json
        s3:
          key: 'mmps_mproc/{{workflow.parameters.subjID}}/{{inputs.parameters.session}}/anat/{{workflow.parameters.subjID}}_{{inputs.parameters.session}}_run-01_T1w.json'

      # T2w (optional)
      ## NIFTI
