grafana:
  # ---------------------------------------------------------------------------
  # Service account — must match the Pod Identity association created in
  # terraform/modules/metrics/iam.tf (grafana_sa_name = "grafana").
  # ---------------------------------------------------------------------------
  serviceAccount:
    create: true
    name: grafana

  # ---------------------------------------------------------------------------
  # Plugins — Athena datasource plugin (installed from Grafana plugin registry)
  # ---------------------------------------------------------------------------
  plugins:
    - grafana-athena-datasource

  # Datasources — Prometheus and Athena — are rendered by Terraform into this
  # app's Helm values (local.argocd_app_overrides in terraform/modules/stack/argocd.tf), not
  # set here. Only the Athena entry's region is deployment-specific, but it sits
  # inside a list and Helm replaces a list whole, so the whole `datasources` map
  # is Terraform's. Athena credentials come from the Pod Identity role either
  # way (no explicit key/secret).

  # ---------------------------------------------------------------------------
  # Dashboard provisioning — sidecar watches ConfigMaps labelled
  # grafana_dashboard=1 in the grafana namespace and auto-loads them.
  # ---------------------------------------------------------------------------
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: grafana

  # ---------------------------------------------------------------------------
  # ALB Ingress — routes the Grafana hostname → Grafana svc
  #
  # Neither the hostname nor whether the ingress exists is here: `enabled`,
  # `hosts` and the external-dns hostname annotation come from this app's entry
  # in local.argocd_app_overrides (terraform/modules/stack/argocd.tf), which
  # turns the ingress off for a deployment with no domain (port-forward mode).
  # The annotations below stay, and Terraform's precondition reads that
  # override merged over this file.
  #
  # A member of the shared internal `cloudpipe-ui` ALB, with ArgoCD, Argo
  # Workflows, Prefect and Kubecost (plan 012). Reachable only from inside the
  # VPC — operators come in over Cloudflare WARP.
  #
  # No certificate-arn: the controller discovers the wildcard ACM certificate
  # from the host rule (and the group's HTTPS listener carries it anyway).
  # ---------------------------------------------------------------------------
  ingress:
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/backend-protocol: HTTP
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/healthcheck-path: /api/health
      alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
      # --- Group-level: MUST equal local.ui_alb_group_annotations in
      # terraform/modules/stack/ui_alb.tf byte for byte. One differing value stops the
      # controller reconciling the whole shared ALB. Terraform's plan fails on a
      # mismatch (precondition in terraform/modules/stack/argocd.tf), so change both together.
      # Hardcoded because this ingress is GitOps-managed and cannot read
      # Terraform outputs: the SG is referenced by Name tag, the access-log
      # bucket (SSE-S3; ALB cannot deliver to the SSE-KMS cloudpipe-logging
      # bucket) by name.
      #
      # Do NOT add alb.ingress.kubernetes.io/wafv2-acl-arn here. The shared ALB's
      # WAF association (Security Hub ELB.16) is set on the ArgoCD ingress alone,
      # because the ARN is Terraform-generated and cannot be hardcoded reliably.
      # It is Exclusive, so a second member setting it stops the whole group
      # reconciling; Terraform's plan fails if this file grows that key.
      #
      # The `-Res-` in ssl-policy is required by Security Hub ELB.17, whose list of
      # acceptable policies is not customizable and excludes the ALB default
      # ELBSecurityPolicy-TLS13-1-2-2021-06. See the header comment in
      # terraform/modules/stack/ui_alb.tf before changing it.
      alb.ingress.kubernetes.io/group.name: cloudpipe-ui
      alb.ingress.kubernetes.io/scheme: internal
      alb.ingress.kubernetes.io/security-groups: cloudpipe-ui-alb-sg
      alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-Res-2021-06
      alb.ingress.kubernetes.io/load-balancer-attributes: access_logs.s3.enabled=true,access_logs.s3.bucket=cloudpipe-logging-access,access_logs.s3.prefix=alb-ui,idle_timeout.timeout_seconds=4000,deletion_protection.enabled=true
    path: /
    pathType: Prefix

  # ---------------------------------------------------------------------------
  # Scheduling — use the backend nodegroup (same as Prefect, Argo server, etc.)
  # ---------------------------------------------------------------------------
  nodeSelector:
    eks.amazonaws.com/nodegroup: backend

  tolerations:
    - key: CriticalAddonsOnly
      value: "true"
      effect: NoSchedule

  resources:
    requests:
      cpu: 100m
      memory: 256Mi

  # ---------------------------------------------------------------------------
  # Persistence — keep dashboard state across pod restarts
  #
  # The volume is RWO EBS: exactly one node may attach it. With the chart's
  # default 25% maxSurge the replacement pod is created before the old one goes
  # away, and if it lands on another node it waits on Multi-Attach while the old
  # pod keeps the volume — a rollout that never finishes.
  #
  # maxSurge: 0 makes the old pod terminate first, which releases the volume;
  # with one replica that is a few seconds of downtime per deploy, and it is
  # what lets a rollout finish at all here.
  #
  # NOT `type: Recreate`, though it describes the same behaviour: `rollingUpdate`
  # is owned by other field managers (kubectl-rollout, kube-controller-manager),
  # and Argo CD's server-side apply owns only `strategy.type`. Switching the type
  # leaves the old `rollingUpdate` block in place, and the API server rejects
  # that combination — "may not be specified when strategy `type` is 'Recreate'".
  # Verified against the live object 2026-09-17.
  # ---------------------------------------------------------------------------
  persistence:
    enabled: true
    size: 5Gi

  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  # ---------------------------------------------------------------------------
  # Local admin account — the Terraform-managed secret (terraform/modules/stack/grafana.tf),
  # NOT the chart's own. Left to itself the chart generates a fresh random
  # adminPassword on every render, and the Deployment's checksum/secret
  # annotation turns that into a new rollout on every sync. Pointing at a stable
  # secret also stops the chart templating a Secret at all, so the annotation
  # becomes constant.
  # ---------------------------------------------------------------------------
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  # ---------------------------------------------------------------------------
  # Secrets from Terraform-managed objects (terraform/modules/stack/grafana.tf),
  # so neither is hardcoded here. Grafana expands the client secret with
  # $__env{...} inside grafana.ini below.
  # ---------------------------------------------------------------------------
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-sso
        key: clientSecret
    # Must equal the renderer's AUTH_TOKEN (imageRenderer below).
    GF_RENDERING_RENDERER_TOKEN:
      secretKeyRef:
        name: grafana-renderer-token
        key: token

  # ---------------------------------------------------------------------------
  # Image renderer — a separate Deployment + Service that renders panels and
  # dashboards to PNG/PDF with headless Chromium ("Share > Direct link rendered
  # image", images in alert notifications). The chart also points Grafana at it
  # (GF_RENDERING_SERVER_URL / GF_RENDERING_CALLBACK_URL, both in-cluster).
  #
  # Pinned: the chart defaults to `latest` + pullPolicy Always, so any pod
  # restart could change the version. v5 is multi-arch, which the arm64
  # (m7g) backend nodes need. v5 is the Go rewrite; the chart's default env
  # (HTTP_HOST, XDG_*) is from v4 — harmless, and XDG_* still keeps Chromium
  # writing under the /tmp emptyDir on a read-only root filesystem.
  #
  # Sized for occasional single-panel renders, not upstream's 16 GiB / 4 core
  # guidance (which is for report fleets). GOMEMLIMIT follows upstream's
  # 1 GiB per 8 GiB of limit, leaving the rest to Chromium.
  #
  # The chart's NetworkPolicy is not enforced (VPC CNI network policy is off),
  # so the shared token (terraform/modules/stack/grafana.tf) is the actual access control.
  # ---------------------------------------------------------------------------
  imageRenderer:
    enabled: true
    image:
      tag: v5.12.3
      pullPolicy: IfNotPresent
    env:
      GOMEMLIMIT: 256MiB
    envValueFrom:
      AUTH_TOKEN:
        secretKeyRef:
          name: grafana-renderer-token
          key: token
    nodeSelector:
      eks.amazonaws.com/nodegroup: backend
    tolerations:
      - key: CriticalAddonsOnly
        value: "true"
        effect: NoSchedule
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 2Gi

  # ---------------------------------------------------------------------------
  # Grafana configuration
  #
  # server.root_url comes from local.argocd_app_overrides
  # (terraform/modules/stack/argocd.tf): https under the domain, or
  # http://localhost:3000 in port-forward mode.
  # ---------------------------------------------------------------------------
  grafana.ini:
    analytics:
      reporting_enabled: false
      check_for_updates: false
    auth.anonymous:
      enabled: false
    # Local login form is intentionally left enabled as an admin escape hatch
    # until SSO is verified end-to-end; flip disable_login_form to true after.
    auth:
      disable_login_form: false
    # SSO. Everything that differs by deployment or by identity mode comes from
    # local.argocd_app_overrides (terraform/modules/stack/argocd.tf), not from
    # here: client_id, auth_url, token_url and api_url (the Cognito pool, or
    # the ArgoCD-bundled Dex with an external identity provider),
    # role_attribute_path (Admin for the administrators, Viewer for everyone
    # else), and allowed_domains.
    #
    # Grafana's own default for allowed_domains is no restriction at all, so
    # with allow_sign_up below that value going missing widens access instead
    # of breaking anything.
    auth.generic_oauth:
      enabled: true
      # The label on Grafana's login button, as every operator sees it. Neutral
      # for EVERY deployment including the reference one, by the operator's
      # decision (design D9 of
      # openspec/changes/optional-domain-and-cognito-auth) — a per-deployment
      # override would be a second source for a cosmetic string.
      name: Single sign-on
      client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
      scopes: openid profile email
      allow_sign_up: true
      email_attribute_path: email
