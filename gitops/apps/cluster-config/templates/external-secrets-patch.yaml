# Supplementary RBAC for the external-secrets cert-controller.
#
# This bypasses the restrictive resourceNames the Helm chart generates, which
# otherwise produce a 403 Forbidden -> 500 Healthz error loop.
#
# Split into a ClusterRole and a namespaced Role (#637). Only the webhook
# configurations are cluster-scoped and genuinely need a ClusterRole; the
# secrets, events and leases this controller touches all live in its own
# namespace, and granting them cluster-wide let the cert-controller read, patch
# and create Secrets in EVERY namespace.
#
# Verified before narrowing, because getting this wrong breaks ExternalSecret
# admission cluster-wide:
#   * the binding's only subject is ServiceAccount
#     external-secrets/external-secrets-cert-controller — the main controller
#     gets its cluster-wide Secret writes from the chart's separate
#     `external-secrets-controller` ClusterRole, which this does not touch;
#   * the external-secrets namespace holds exactly one secret,
#     `external-secrets-webhook`, which is the cert this controller manages.
#
# Terraform keeps a twin of both objects in
# terraform/modules/addons/external-secrets.tf so the patch is in place before
# ArgoCD is up. The two MUST change together: ArgoCD owns the live state with
# selfHeal, so a divergent Terraform copy is reverted within seconds.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-cert-controller-patch
rules:
# Cluster-scoped objects, so this rule cannot be namespaced.
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
  verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-cert-controller-patch-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-secrets-cert-controller-patch
subjects:
- kind: ServiceAccount
  name: external-secrets-cert-controller
  namespace: external-secrets
---
# The namespaced half: the webhook cert secret, this controller's own events,
# and its leader-election lease. All three are in external-secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-cert-controller-patch
  namespace: external-secrets
rules:
- apiGroups: [""]
  resources: ["secrets", "events"]
  verbs: ["get", "list", "watch", "update", "patch", "create"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-cert-controller-patch-binding
  namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-cert-controller-patch
subjects:
- kind: ServiceAccount
  name: external-secrets-cert-controller
  namespace: external-secrets
