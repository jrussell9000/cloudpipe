apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: amazon-cloudwatch
  labels:
    k8s-app: fluent-bit
data:
  application-log.conf: |
    [INPUT]
      Name                tail
      Tag                 application.*
      Exclude_Path        /var/log/containers/cloudwatch-agent*, /var/log/containers/fluent-bit*, /var/log/containers/aws-node*, /var/log/containers/kube-proxy*
      Path                /var/log/containers/*.log
      multiline.parser    docker, cri
      DB                  /var/fluent-bit/state/flb_container.db
      Mem_Buf_Limit       50MB
      Skip_Long_Lines     On
      Refresh_Interval    10
      Rotate_Wait         30
      storage.type        filesystem
      Read_from_Head      ${READ_FROM_HEAD}

    [INPUT]
      Name                tail
      Tag                 application.*
      Path                /var/log/containers/fluent-bit*
      multiline.parser    docker, cri
      DB                  /var/fluent-bit/state/flb_log.db
      Mem_Buf_Limit       5MB
      Skip_Long_Lines     On
      Refresh_Interval    10
      Read_from_Head      ${READ_FROM_HEAD}

    [INPUT]
      Name                tail
      Tag                 application.*
      Path                /var/log/containers/cloudwatch-agent*
      multiline.parser    docker, cri
      DB                  /var/fluent-bit/state/flb_cwagent.db
      Mem_Buf_Limit       5MB
      Skip_Long_Lines     On
      Refresh_Interval    10
      Read_from_Head      ${READ_FROM_HEAD}

    [FILTER]
      Name                aws
      Match               application.*
      az                  false
      ec2_instance_id     false
      Enable_Entity       true

    [FILTER]
      Name                kubernetes
      Match               application.*
      Kube_URL            https://kubernetes.default.svc:443
      Kube_Tag_Prefix     application.var.log.containers.
      K8S-Logging.Parser  On
      K8S-Logging.Exclude Off
      Labels              On
      Annotations         Off
      Use_Kubelet         On
      Kubelet_Port        10250
      Buffer_Size         0
      Use_Pod_Association On

    [FILTER]
      Name                  multiline
      Match                 application.*
      multiline.key_content log
      multiline.parser      python

    [FILTER]
      Name         rewrite_tag
      Match        application.*
      Rule         $kubernetes['namespace_name'] ^argo-workflows$ argo-workflows.$TAG true
      Emitter_Name argo_reemit

    [FILTER]
      Name          record_modifier
      Match         argo-workflows.*
      Allowlist_key log

    [OUTPUT]
      Name                  cloudwatch_logs
      Match                 argo-workflows.*
      region                ${AWS_REGION}
      log_group_name        /aws/containerinsights/${CLUSTER_NAME}/argo-workflows
      log_stream_name       ${HOST_NAME}
      auto_create_group     false
      extra_user_agent      container-insights

    [OUTPUT]
      Name                cloudwatch_logs
      Match               application.*
      region              ${AWS_REGION}
      log_group_name      /aws/containerinsights/${CLUSTER_NAME}/application
      log_stream_prefix   ${HOST_NAME}-
      auto_create_group   true
      extra_user_agent    container-insights
      add_entity          true
