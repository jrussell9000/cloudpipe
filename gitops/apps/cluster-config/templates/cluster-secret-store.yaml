apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      {{- /*
        `required` instead of a bare reference on purpose: this chart is the one
        place in gitops/apps where we own the template, so the failure mode when
        the value goes missing is ours to choose. A bare `.Values.region` renders
        `region:` — external-secrets reads the empty string as "no region" and
        every ExternalSecret in the cluster stops resolving, with nothing in the
        manifest to say why. Failing the render instead leaves the Application
        Degraded with the message below in its condition.

        A Go-template comment rather than a YAML one because Helm emits YAML
        comments into the manifest, which would make this chart's render differ
        from the pre-override one for no reason.
      */}}
      region: {{ required "cluster-config: .Values.region is unset. The root ApplicationSet supplies it from local.argocd_app_overrides in terraform/modules/stack/argocd.tf; a render before that override is applied needs the default in values.yaml." .Values.region }}
