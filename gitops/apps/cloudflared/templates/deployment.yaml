# cloudflared connector for the cloudpipe-eks tunnel (ADR 014 phase 1).
#
# Two replicas because tunnel availability gates ALL kubectl access once the
# Client VPN is retired — a single connector would make a pod eviction an
# access outage. cloudflared registers multiple connections per replica and
# Cloudflare load-balances across them.
#
# There is no Service and no ingress: the connector dials OUT to Cloudflare's
# edge over QUIC/443. Nothing needs to reach it inbound, which is the entire
# security argument for a tunnel over an open ALB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  replicas: 2
  # Never drop below two connectors during a rollout: surge a new pod first,
  # then retire an old one.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      # Placement. This connector is the only path to the EKS API server once
      # the Client VPN is retired, so it runs only on the stable, on-demand
      # managed nodegroups — never on Karpenter spot capacity:
      #   backend   — 2x m7g.2xlarge, <YOUR_AWS_REGION>a, taint CriticalAddonsOnly
      #   karpenter — 1x m7g.xlarge,  <YOUR_AWS_REGION>b, untainted
      # Both carry the node security group that the API server's cluster SG
      # admits ("Node groups to cluster API"), so pinning here is also what
      # guarantees cloudflared can reach the API server without the VPN's
      # eks_api_from_vpn rule (plan 012 §6). All arm64.
      #
      # The previous *preferred* hostname anti-affinity was not enough: on
      # 2026-09-17 both replicas were found on the single karpenter-nodegroup
      # node, a single point of failure for all kubectl access.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: eks.amazonaws.com/nodegroup
                    operator: In
                    values: [backend, karpenter]
      tolerations:
        - key: CriticalAddonsOnly
          operator: Equal
          value: "true"
          effect: NoSchedule
      # Hard: at most one replica per node (three eligible nodes, two
      # replicas, so a single node loss or drain always leaves one running).
      # Soft: spread across zones, which with this layout puts one replica in
      # <YOUR_AWS_REGION>a and one in <YOUR_AWS_REGION>b. matchLabelKeys scopes the counting to
      # the current ReplicaSet, so a rollout's surge pod is not blocked by the
      # replicas it is replacing.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: cloudflared
          matchLabelKeys: [pod-template-hash]
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: cloudflared
          matchLabelKeys: [pod-template-hash]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.8.2
          args:
            - tunnel
            - --no-autoupdate
            # Bind the metrics server so the readiness probe below has
            # something to talk to; /ready reports registered connections.
            - --metrics
            - 0.0.0.0:2000
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
