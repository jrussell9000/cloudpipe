# The tunnel connector token, pulled from Secrets Manager at runtime.
#
# This manifest holds a POINTER (a secret name), never the token itself, which
# is why it can live in git and in the public mirror. The token is created by
# hand in Secrets Manager and is deliberately never read by Terraform — reading
# it there would persist it in state. See ADR 014 Amendment 1.
#
# The ClusterSecretStore `external-secrets-clusterstore` is created in Terraform
# (terraform/modules/argo-workflows/database.tf) and is now the only store in
# the cluster. It carries spec.conditions, so a new consumer needs its namespace
# added there before it will sync (#637).
#
# A second store used to exist here and this comment used to call it unused. It
# was not: argo-workflows/globus-credentials read it, which is the only reason
# deleting it did not break the Globus sync the first time someone tried. That
# consumer was repointed and the store removed.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflared-token
# Every field external-secrets would default is written out, which is what
# keeps this app Synced (#720).
#
# This is the ONLY ArgoCD-managed ExternalSecret — the other four are Terraform
# kubectl_manifest resources, so ArgoCD never diffs them. That is why the
# symptom appeared here alone and looked app-specific.
#
# Without these five, the operator fills them in on the live object, ArgoCD sees
# fields the manifest does not declare, and the app sits OutOfSync/Healthy
# forever. The cost of that is not cosmetic: a permanently OutOfSync app trains
# people to ignore sync status, so a REAL drift here would be invisible against
# the noise.
#
# Declaring them beats an `ignoreDifferences` entry on two counts. It needs no
# ApplicationSet branch (which the override tests would then require to have a
# matching app_overrides entry, for a value no Helm chart reads), and it states
# intent rather than inheriting whatever upstream picks — `deletionPolicy:
# Retain` in particular is a decision about a credential, not a default worth
# leaving implicit.
#
# Values taken from the live object, so this is a no-op for what is running. If
# external-secrets ever changes a default, this manifest keeps the old one on
# purpose — that is the trade, and it is visible here rather than silent.
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: external-secrets-clusterstore
    kind: ClusterSecretStore
  target:
    name: cloudflared-token
    # Owner: ESO creates the Secret and owns its lifecycle.
    creationPolicy: Owner
    # Retain: deleting this ExternalSecret leaves the Secret behind, so a
    # resync accident does not drop the tunnel's credential.
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: cloudpipe/cloudflare-tunnel-token
        # The token is stored as a plain string, not JSON, so no property is
        # extracted and no decoding is applied.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
