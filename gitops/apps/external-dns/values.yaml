external-dns:
  provider:
    name: aws
  # `env` (AWS_DEFAULT_REGION, AWS_REGION) and `domainFilters` are NOT set here.
  # They differ between deployments, so Terraform supplies them: the root
  # ApplicationSet patches them in from local.argocd_app_overrides in
  # terraform/modules/stack/argocd.tf. Setting either here would shadow nothing — the override
  # wins — but it would put the value in two places. See "Per-app Helm overrides"
  # in docs/gitops.md.
  txtOwnerId: "cloudpipe"
  policy: upsert-only
  sources:
    - ingress
    - service
  nodeSelector:
    eks.amazonaws.com/nodegroup: backend
  tolerations:
  - key: "CriticalAddonsOnly"
    value: "true"
    effect: "NoSchedule"
  # Pod Identity — no role-arn annotation needed; SA created by Helm
  serviceAccount:
    create: true
    name: external-dns
