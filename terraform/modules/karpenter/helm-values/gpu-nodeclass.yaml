apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu-nodeclass
spec:
  # AL2023 — required for pre-baked AMIs built with Packer.
  # Bottlerocket's immutable OS makes standard AMI customisation impractical.
  amiFamily: AL2023

  # Select the most recently created AMI carrying the matching fastsurfer
  # digest, fireants digest, and EKS version. When a new pre-baked AMI is built
  # (new fastsurfer/fireants image or base AMI refresh), Karpenter automatically
  # picks the newest matching AMI.
  #
  # Keyed on the image DIGEST rather than the git-sha tag. A rebuild at an
  # unchanged commit produces the same tag but a different image; a tag-keyed
  # selector would keep matching the old AMI while the workflow templates pinned
  # the new digest, making the pre-bake a silent cache miss (#123). The AMIs also
  # carry fastsurfer-image-tag / fireants-image-tag, but nothing selects on them.
  #
  # NOTE: an AMI baked before the digest-pinning change carries no *-image-digest
  # tag and can therefore never match this selector. Rolling back to one requires
  # adding the tags to it first (aws ec2 create-tags).
  amiSelectorTerms:
    - tags:
        fastsurfer-image-digest: "${ fastsurfer_ami_digest }"
        fireants-image-digest: "${ fireants_ami_digest }"
        eks-version: "${ eks_version }"

  # Use any available NVMe instance store as scratch for containers.
  # Single root volume for AL2023 (unlike Bottlerocket's OS + data split).
  # 150 GiB accommodates the pre-baked fastsurfer + fireants images (~10 GB
  # combined) plus runtime pulls of afni and synthmorph with comfortable headroom.
  #
  # iops and throughput are pinned to the gp3 free baseline ON PURPOSE, and
  # must stay explicit. EC2 inherits any EBS parameter a launch template does
  # NOT set from the AMI's own block device mapping, and the baked GPU AMI
  # carries iops=16000 / throughput=1000 (packer/gpu-nodeclass/fastsurfer.pkr.hcl,
  # where the builder needs them to unpack ~13 GiB of container snapshot in a
  # ~25-minute bake). Setting volumeSize alone overrode the size and silently
  # inherited the rest, so every GPU node ran a 150 GiB volume provisioned at
  # 16000 IOPS / 1000 MB/s.
  #
  # gp3 bills only ABOVE 3000 IOPS and 125 MB/s, so each node was paying
  # 13000 x $0.005 + 875 x $0.040 = ~$100/month-equivalent for headroom nothing
  # asked for. Measured 2026-09-01..09-07 (one 5-day batch), <YOUR_AWS_REGION>:
  #   EBS:VolumeP-IOPS.gp3        $315.81
  #   EBS:VolumeP-Throughput.gp3  $170.05
  # It tracked the batch exactly — $3.23/day at rest, $170.72 on the peak day.
  # (The residual at-rest figure is a different bug: a stopped Packer builder
  # left behind on 2026-08-17 still holding its 16000/1000 volume.)
  #
  # These nodes read pre-baked image layers and stream their real work from S3,
  # so the baseline is sufficient. If a GPU step ever becomes genuinely disk
  # bound, raise these deliberately and record the measurement — do not delete
  # the keys and fall back to inheriting the bake's values.
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 150Gi
        volumeType: gp3
        iops: 3000
        throughput: 125
        encrypted: true

  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 3
    httpTokens: required
  detailedMonitoring: true
  role: ${ karpenter_node_iam_role_name }
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: ${ eks_cluster_name }
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: ${ eks_cluster_name }

  kubelet:
    maxPods: 110
