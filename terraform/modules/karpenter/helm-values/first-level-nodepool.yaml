apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: first-level-nodepool
spec:
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 10m
    budgets:
    - nodes: "10"
  # Each first-level session is one pod at 1 CPU / 10Gi, so memory binds first: about
  # 1,200 pods, or about 400 subjects at the queue manager's cap. Raised from 512 / 4096Gi
  # for the cohort waves (2026-11-07). The account's spot vCPU quota (5,595) is shared
  # with cpu-heavy-nodepool, so 1,536 leaves it about 4,000 vCPU.
  limits:
    cpu: 1536
    memory: 12288Gi
  template:
    spec:
      expireAfter: 720h
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: nodeclass
      requirements:
      - key: "kubernetes.io/arch"
        operator: In
        values: ["arm64"]
      - key: "kubernetes.io/os"
        operator: In
        values: ["linux"]
      # Spot only — mirrors the Batch compute environment
      - key: "karpenter.sh/capacity-type"
        operator: In
        values: ["spot"]
      - key: "karpenter.k8s.aws/instance-hypervisor"
        operator: In
        values: ["nitro"]
      # Graviton families with NVMe instance store; the nodeclass
      # instanceStorePolicy: RAID0 puts the NVMe on the data partition,
      # so emptyDir volumes land on fast local NVMe automatically.
      - key: "karpenter.k8s.aws/instance-family"
        operator: In
        values: ["m6gd", "m7gd", "r6gd", "r7gd", "c6gd", "c7gd"]
      - key: "karpenter.k8s.aws/instance-size"
        operator: In
        values: ["xlarge", "2xlarge", "4xlarge"]
