nodeSelector:
  karpenter.sh/controller: 'true'
tolerations:
- key: karpenter.sh/controller
  operator: Exists
  effect: NoSchedule
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
          - key: eks.amazonaws.com/nodegroup
            operator: In
            values:
              - karpenter
          - key: karpenter.sh/nodepool
            operator: DoesNotExist
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: "kubernetes.io/hostname"
settings:
  clusterName: ${clusterName}
  clusterEndpoint: ${clusterEndpoint}
  interruptionQueue: ${interruptionQueue}
  eksControlPlane: true
  featureGates:
    # Enables the alpha NodeOverlay API (karpenter.sh/v1alpha1). Required for
    # gpu-nodeoverlay.yaml, which teaches Karpenter that g6f fractional-GPU
    # instances carry nvidia.com/gpu (the EC2 API reports Count=0 for them).
    # Off by default; toggling this restarts the Karpenter controller.
    nodeOverlay: true
