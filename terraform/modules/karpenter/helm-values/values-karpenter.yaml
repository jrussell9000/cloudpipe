# The controller runs on the `backend` managed nodegroup: a node Karpenter does
# not manage, so it can never consolidate away its own controller. There used to
# be a dedicated `karpenter` nodegroup (removed 2026-11-06, see the note in
# modules/stack/eks.tf); the nodegroup-name affinity replaced its
# `karpenter.sh/controller` node label, so the backend group needed no label.
tolerations:
- key: CriticalAddonsOnly
  operator: Equal
  value: "true"
  effect: NoSchedule
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
          - key: eks.amazonaws.com/nodegroup
            operator: In
            values:
              - backend
          - key: karpenter.sh/nodepool
            operator: DoesNotExist
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: "kubernetes.io/hostname"
settings:
  clusterName: ${clusterName}
  clusterEndpoint: ${clusterEndpoint}
  interruptionQueue: ${interruptionQueue}
  eksControlPlane: true
  featureGates:
    # Enables the alpha NodeOverlay API (karpenter.sh/v1alpha1). Required for
    # gpu-nodeoverlay.yaml, which teaches Karpenter that g6f fractional-GPU
    # instances carry nvidia.com/gpu (the EC2 API reports Count=0 for them).
    # Off by default; toggling this restarts the Karpenter controller.
    nodeOverlay: true
