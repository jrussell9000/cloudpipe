apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: ingress-nodeclass
# For `ingress-mode=https` pods only (openspec add-https-ingress-mode). The same
# image, disks and metadata options as `nodeclass`, with four differences:
#   - public IPv4 addresses, so ingress bytes skip the NAT gateway;
#   - the ingress subnets and the ingress-node security group, selected by ID.
#     A tag would match any subnet in the account that carries it, and an ID
#     cannot;
#   - its own, narrower node role (ingress.tf);
#   - no karpenter.sh/discovery selector anywhere, so it cannot land in the
#     general subnets or groups, and they cannot land here.
spec:
  amiFamily: Bottlerocket
  amiSelectorTerms:
    - alias: bottlerocket@latest

  instanceStorePolicy: RAID0
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 8Gi
        volumeType: gp3
        encrypted: true
    - deviceName: /dev/xvdb  # Bottlerocket data volume (container image cache)
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        encrypted: true

  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 3
    httpTokens: required
  detailedMonitoring: true
  # The one node class with public IPs (tests/test_ingress_node_isolation.py).
  associatePublicIPAddress: true
  role: ${ ingress_node_iam_role_name }
  subnetSelectorTerms:
%{ for id in subnet_ids ~}
    - id: ${ id }
%{ endfor ~}
  securityGroupSelectorTerms:
    - id: ${ security_group_id }

  kubelet:
    maxPods: 110
