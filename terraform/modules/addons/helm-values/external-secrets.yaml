installCRDS: true

# Main Controller Identity (IRSA)
serviceAccount:
  name: external-secrets-sa
  annotations:
    eks.amazonaws.com/role-arn: "${role_arn}"

# Explicitly define the Cert Controller ServiceAccount
# so we can reliably bind our custom RBAC to it below.
certController:
  serviceAccount:
    create: true
    name: external-secrets-cert-controller

global:
  nodeSelector:
    eks.amazonaws.com/nodegroup: backend
  tolerations:
  - key: "CriticalAddonsOnly"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"

nodeSelector:
  eks.amazonaws.com/nodegroup: backend
tolerations:
- key: "CriticalAddonsOnly"
  operator: "Equal"
  value: "true"
  effect: "NoSchedule"
