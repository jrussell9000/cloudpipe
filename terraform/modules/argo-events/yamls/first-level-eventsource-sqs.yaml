apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: first-level-sqs
  namespace: argo-events
spec:
  template:
    serviceAccountName: ${event_sa}
    tolerations:
    - key: "CriticalAddonsOnly"
      value: "true"
      effect: "NoSchedule"
  sqs:
    first_level_workflow:
      # Confusingly, this must be FALSE or else we get errors about marshaling the JSON body
      jsonBody: false
      region: "${region}"
      queue: ${queue_name}
      # Automatic resolution of the queue URL doesn't work as of v1.9.5
      endpoint: ${endpoint}
      waitTimeSeconds: 20
