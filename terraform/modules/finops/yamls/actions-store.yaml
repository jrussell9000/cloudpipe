type: S3
config:
  bucket: "${bucket_name}"
  endpoint: "s3.amazonaws.com"
  # Use of other cost-tracking options mandates
  # locating this bucket in us-east-1
  region: "${region}"
  insecure: false
  signature_version2: false
  put_user_metadata:
      "X-Amz-Acl": "bucket-owner-full-control"
  http_config:
    idle_conn_timeout: 90s
    response_header_timeout: 2m
    insecure_skip_verify: false
  trace:
    enable: true
  part_size: 134217728