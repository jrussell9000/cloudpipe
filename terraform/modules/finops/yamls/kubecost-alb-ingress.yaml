apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubecost-alb-ingress
  namespace: kubecost
  annotations:
    # This tells external-dns to update the Route 53 records for the hostname with the reference to the loadbalancer
    external-dns.alpha.kubernetes.io/hostname: kubecost.${hostname}
    # Provide the certificate ARN - will automagically enable TLS
    alb.ingress.kubernetes.io/certificate-arn: ${certificate_arn}
    # Set the backend protocol - AWS LB talking to pods
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    # Route directly to pods with target-type: ip. We want to talk to pods, not nodes (instances)
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    # ALB-level settings shared by every member of the ingress group (scheme,
    # group, security group, listeners, TLS policy, attributes) — identical
    # across members, so supplied by the caller rather than set here.
    ${indent(4, trimspace(yamlencode(alb_group_annotations)))}

spec:
  ingressClassName: alb
  rules:
  - host: kubecost.${hostname}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kubecost-frontend
            port:
              number: 9090