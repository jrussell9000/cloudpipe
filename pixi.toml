[workspace]
authors = ["Justin Russell"]
channels = ["conda-forge"]
license = "MIT"
license-file = "LICENSE"
name = "cloudpipe"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# `--dist loadfile` keeps every test in a file on ONE worker. The default `load`
# scatters tests individually, so a module-scoped fixture is paid once PER WORKER
# that receives one of its tests — and tests/test_terraform_globus_config.py has
# a 32.41 s one (`terraform init` in a copy of the module, then
# `terraform console`). Measured over the whole suite, at -n 4:
#
#     serial                    206.77 s
#     -n 4                      143.88 s
#     -n 4 --dist loadfile       99.21 s
#
# CAPPED AT FOUR, which is also what a GitHub-hosted runner has. Past four this
# suite only gets SLOWER, because `loadfile` makes the terraform file (~95 s) the
# wall-clock floor and extra workers contend with it:
#
#     -n 4     99.21 s
#     -n 8    108.69 s
#     -n 20   115.13 s
#
# KNOWN LOCAL HAZARD, pre-existing and not caused by the cap or by `-n`: when the
# `terraform init` inside tests/test_terraform_globus_config.py::render fails,
# render() answers with `pytest.skip`, so the module fixture skips and the file's
# 12 assertions quietly stop running instead of going red (`2731 passed, 22
# skipped` rather than `2743 passed, 10 skipped`). Under load it fired in roughly
# 1 run in 3 at this setting. Not reproducible from concurrent `terraform init`
# alone, so the cause is still open; see the tracking issue. CI is unaffected —
# the pytest job installs no Terraform, so that file skips on every CI run
# regardless. Locally, `pixi run test --allowed-skips-only` turns that skip into
# a failure (tests/conftest.py, #650); the standing local count is now 1 skipped
# (the opt-in live Globus test), so any other number is worth a look.
#
# To debug one test without the workers, bypass the task: `pixi run -- pytest -x
# tests/foo.py`. Parallel output interleaves and does not stop cleanly at -x.
test = "pytest -n auto --maxprocesses 4 --dist loadfile"

# A coverage MAP, not a gate: nothing fails on a percentage. It exists so a
# refactor of a module with thin tests (images/afni/preproc.py, #641) can see
# what is unexercised before it starts. `--cov=<dir>` attributes by file path,
# so the pytest.ini `pythonpath` imports count; xdist workers combine
# automatically. Blind spot: Python a test `exec`s out of Argo YAML (e.g.
# tests/images/afni/test_driver_gating.py) belongs to no file and is not counted.
coverage = "pytest -n auto --maxprocesses 4 --dist loadfile --cov=images --cov=src --cov=prefect --cov-report=term-missing"

# Operator surface for the Globus ingress: `pixi run globus doctor`, `... login`,
# `... status`. PYTHONPATH rather than an installed package, matching how
# pytest.ini puts src/ on the path — there is no build step in this repo.
# AWS credentials come from the caller's environment (an AWS CLI v2 SSO profile);
# the CLI never takes keys. See docs/globus-setup.md.
globus = { cmd = "python -m globus_admin", env = { PYTHONPATH = "src" } }

# Deployment setup wizard: `pixi run cloudpipe setup`, `... preflight`. Collects
# the cluster-wide Terraform inputs and renders terraform.tfvars into a target
# root; creates no AWS resource. Set up exactly like the `globus` task above, for
# the same reason — PYTHONPATH, no build step. The `globus` task still owns the
# eight Globus inputs; this one never asks for them.
#
# On a machine where pixi itself is not installed yet, run `scripts/cloudpipe-setup`
# first: it is standard-library-only, checks the prerequisites, and hands off here.
cloudpipe = { cmd = "python -m cloudpipe_setup", env = { PYTHONPATH = "src" } }

# Register the Prefect deployments: `PREFECT_API_URL=… pixi run prefect-deploy`.
# Fills prefect.yaml's bucket and registry placeholders from the cloudpipe-config
# ConfigMap, then reads every deployment back from the server. A bare
# `prefect deploy --all` stores "" for each of them and still succeeds.
prefect-deploy = "bash prefect/deploy.sh"

# --- Code-health / lint tooling (dev-only) ---
# Lives in the `lint` feature/environment so runtime image builds don't pull it.
# See docs-internal/code-health-plan.md (internal; not in the public repository). All tasks are read-only / report-only by default;
# `format` and `lint-fix` are the only ones that modify files.
[feature.lint.dependencies]
ruff = ">=0.14,<0.15"
vulture = ">=2.14,<3"
deptry = ">=0.23,<0.24"
pre-commit = ">=4,<5"
mypy = ">=1.14,<2"

[feature.lint.tasks]
# Report-only (safe): no file changes
#
# `lint` is an AGGREGATE on purpose. CI's python_lint job runs ruff check AND
# ruff format --check as two steps, so a `lint` that ran only the former made
# "green locally" mean nothing: 14 of the 18 CI failures in the five weeks to
# 2026-08-13 were python_lint, and every one of them failed on the format check
# with `ruff check` passing. The granular tasks stay because CI invokes them
# separately — one step per tool is what makes a failure legible at a glance.
ruff-check = "ruff check ."
fmt-check = "ruff format --check ."
lint = { depends-on = ["ruff-check", "fmt-check"] }
# Whitelist documents framework entrypoints (Prefect @flow) and public API that
# vulture can't see are used. Exclude nested pixi envs (e.g. images/workbench/.pixi).
deadcode = "vulture src images scripts prefect tests .vulture-whitelist.py --exclude '*/.pixi/*' --min-confidence 60 --ignore-names 'side_effect,Bucket,kw,self_inner'"
# NOTE: deptry cannot read pixi.toml deps — it needs a pyproject.toml [project] or
# requirements.txt. Blocked pending a decision on adding one (see docs-internal/code-health-plan.md).
# Until then, stale-dep detection uses the manual import audit in the plan doc.
deps = "deptry ."
complexity = "ruff check --select C901 --statistics ."
# Type-check images/afni/preproc.py (scope + options in mypy.ini). Report-only:
# a first-pass baseline to make preproc.py's implicit numpy/Path/subprocess
# contracts explicit before the density refactor. Deliberately NOT in `health`
# yet — the baseline has findings; gating comes after they're triaged.
typecheck = "mypy"
health = { depends-on = ["lint", "deadcode"] }
# Mutating (explicit): only these two change files
format = "ruff format ."
lint-fix = "ruff check --fix ."

# --- Imaging test stack (dev-only) ---
# Exists solely so `tests/images/fireants` can be collected. That module imports
# `fst1w_to_mni`, which imports SimpleITK and torch at module level — so both are
# needed even by the five `finalize_outputs` tests, which touch neither and only
# exercise staging promotion and exit codes.
#
# No torch here, deliberately. Every test in that directory is CPU-bound: the
# ITK tests resample 96^3 synthetic volumes, and the finalize_outputs tests
# assert only staging promotion and exit codes. The GPU path (fireants SyN) is
# inside main() and has no test, so a torch stack would add ~1.1 GB to the solve
# to satisfy an import no test exercises. `import torch` in fst1w_to_mni.py is
# deferred into its two call sites instead — matching the lazy fireants /
# torch.nn.functional imports already in main().
[feature.imaging.dependencies]
simpleitk = ">=2.5.5,<3"

[feature.imaging.tasks]
# pytest.ini's addopts globally ignores tests/images/fireants so the default env
# does not fail collection; clear addopts to run exactly what that ignore hides.
#
# `load` rather than the `test` task's `loadfile`: every test here lives in ONE
# file, so loadfile would put the whole suite back on a single worker. Two tests
# are 88% of its runtime — test_random_ticket_is_reproducible_and_matches_env_threads
# (46.71 s) and test_affine_is_thread_invariant (27.24 s) — and the point is to
# overlap exactly those two. Measured: 84.53 s serial, 58.60 s at -n 2, 51.47 s
# at -n 4, 48.39 s at -n auto. Sublinear because ITK already threads inside each
# test, so the workers oversubscribe the cores; correctness does not depend on
# it, as every assertion is on geometry rather than timing.
#
# Uncapped, unlike `test`: that cap exists for a terraform subprocess, and
# nothing here shells out.
#
# Parallel-safe despite SetGlobalDefaultNumberOfThreads: that global is
# per-PROCESS and each xdist worker is its own process.
test-imaging = "pytest -o addopts= -n auto tests/images/fireants"

# --- Public documentation site (docs-only; not needed by any image) ---
# Builds docs/ into the public site with Zensical, the successor to Material for
# MkDocs (in maintenance mode since 2025-11). Zensical reads mkdocs.yml as-is.
# Pinned below 0.1: it is pre-1.0 and a minor bump may change behaviour.
[feature.docs.dependencies]
zensical = ">=0.0.67,<0.1"

[feature.docs.tasks]
# --strict fails the build on a broken link or anchor (verified 2026-10-01 with
# positive controls). It does NOT fail on a page missing from nav, which MkDocs'
# validation.nav.omitted_files did; tests/test_docs_boundary.py checks that
# instead. CI runs this.
docs-build = "zensical build --strict"
docs-serve = "zensical serve"

# --- Operator workstation (needs WARP) ---
# `pixi run -e ops <tool>` exports this deployment's buckets and UI URLs from the
# cluster (scripts/cloudpipe-env.sh), so src/ tools such as validate_test_batch.py
# need no literal and no flags. Its own environment rather than the default so
# `pixi run test` and CI never reach for kubectl. No packages of its own.
[feature.ops.activation]
scripts = ["scripts/cloudpipe-env.sh"]

[environments]
lint = { features = ["lint"], solve-group = "default" }
imaging = { features = ["imaging"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
ops = { features = ["ops"], solve-group = "default" }

[dependencies]
numpy = ">=2.5.1,<3"
pandas = ">=3.0.3,<4"
boto3 = ">=1.43.49,<2"
# `hera` alone. The legacy `hera-workflows` package installs into the same
# `hera/` directory with a different `hera/__init__.py`, so declaring both left
# which API you got to link order (#647). Everything here imports the 5.x API.
hera = ">=5.18.0,<6"
botocore = ">=1.43.49,<2"
prefect = ">=3.7.8,<4"
globus-sdk = ">=4.8.1,<5"
# Declared, not inherited. `src/globus_admin/config.py` and
# `src/cloudpipe_setup/config.py` both import yaml directly, but it resolved only
# as a transitive dependency of `prefect` — so an unrelated prefect bump that
# dropped it would have broken both CLIs with an ImportError and no other signal.
# The constraint matches what the lock already installs (6.0.3), so nothing in the
# solve changes.
pyyaml = ">=6.0.3,<7"
# Declared for the same reason. tests/globus/test_answers_schema.py and
# test_configdoc_schema.py round-trip their documents through it, and reached it
# only transitively — through `pytest.importorskip`, so losing it would have
# turned three schema checks into silent skips (#650). Matches the locked 4.26.0.
jsonschema = ">=4.26.0,<5"
pip = ">=26.1.2,<27"
pytest = ">=9.1.1,<10"
# The coverage map (`pixi run coverage`, below) — report-only, not a gate.
pytest-cov = ">=6,<8"
# Same band as images/afni/pixi.toml. preproc.py imports PCA at module load for
# aCompCor; without the real package the tests had to stub it out, which meant
# compute_confounds could never run under test (#641).
scikit-learn = ">=1.5.0,<2"
requests = ">=2.34.2,<3"
nibabel = ">=5.4.2,<6"
scipy = ">=1.18.0,<2"
matplotlib = ">=3.11.0,<4"
duckdb = ">=1.5.4,<2"
pyarrow = ">=21,<22"
pytest-xdist = ">=3.8,<4"
