# ============================================================================
# Conda environment for the first-level image: fmri_first_level_proc and the
# cloudpipe stager (stage_first_level.py)
# ============================================================================
#
# AFNI is installed separately in the Dockerfile (not available via conda-forge).
# ============================================================================

name: first_level

channels:
  - conda-forge

dependencies:
  - python=3.14    # = the minor validated in fmri_first_level_proc/tools.lock.yaml (a mismatch only warns)
  - numpy=2.5.4    # = tools.lock.yaml's validated version; bump both together, or every analysis warns
  - pandas=3.1.1   # = tools.lock.yaml's validated version; bump both together
  - pyyaml
  - packaging      # fmri-first-level-proc's tool version checks
  - nibabel        # fmri-first-level-proc's abcd extra: NIfTI headers, tissue masks
  - pip            # boto3 is pip-pinned in the Dockerfile, with the other publish images
