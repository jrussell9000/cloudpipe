[workspace]
authors = ["Justin Russell"]
channels = ["conda-forge"]
name = "workbench"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
# -cli, not the full connectome-workbench: the metapackage also pulls the Qt
# GUI build, which is dead weight in a headless pod.
connectome-workbench-cli = ">=2.1.0,<3"
python = ">=3.12,<3.14"
# For reading the assembled dtseries back in for QC.
nibabel = ">=5.0.0,<6"
numpy = ">=1.26.0,<3"
# This pod talks to S3 itself rather than through Argo's artifact driver: after a
# run's dtseries is verified it deletes that run's grayordinate components, which no
# Argo artifact can express. The newmsm step's publish container also runs
# fs_derivatives.py's publish path here (ADR 017), so these are exact, and the same
# three pins as every other image that ships it (#268: a publish segfault must
# reproduce identically in each). Bump all of them together;
# tests/images/test_publish_pin_parity.py holds them in step.
boto3 = "==1.43.72"
botocore = "==1.43.72"
urllib3 = "==2.7.0"
