# Deploys the documentation site to GitHub Pages from the public repository.
#
# One file in two places, kept byte-identical:
#
#   - scripts/public-pages-workflow.yaml — the source of truth. Inert there:
#     nothing under scripts/ runs as a workflow.
#   - .github/workflows/pages.yaml in the public repository — the live copy.
#
# The live copy cannot be synced. sync-public.sh does not sync `.github/` (the
# internal CI needs AWS credentials and private runners; the public repository
# needs neither), and the sync's token lacks the `workflow` scope GitHub requires
# for any write under `.github/workflows/` — syncing this file would fail the
# whole sync, not just this file. So the live copy is installed by hand (the
# operations runbook has the procedure), and every sync warns when the two
# copies differ. Edit the source of truth, then re-install; never edit the live
# copy alone.
#
# Once installed, every sync that touches docs/ or mkdocs.yml rebuilds the site.
# The internal CI's docs_build job runs the same strict build first, so this
# deploy should never be the first place a docs problem shows up.

name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/pages.yaml"
  workflow_dispatch:

# Least privilege: read the tree, write the Pages artifact, mint the OIDC token
# the deploy step exchanges for a Pages deployment. No `contents: write`.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race for the live site. `cancel-in-progress: false`
# because a half-finished Pages deploy is worse than a slightly stale one — let
# the running deploy finish, then supersede it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Build through pixi, using the same `docs` environment and the same
      # `docs-build` task the internal CI runs, so the published site cannot be
      # produced by a different toolchain than the one that gated it.
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          environments: docs
          cache: true

      - name: mkdocs build --strict
        run: pixi run -e docs docs-build

      - uses: actions/configure-pages@v6

      # Pinned to v3 deliberately. v4 exists, but this is a COMPOSITE action —
      # both v3 and v4 delegate to `actions/upload-artifact@v4`, which still runs
      # on node20. Bumping the outer tag buys no node24 progress, so it waits for
      # upstream to adopt upload-artifact@v5. This is the one remaining node20
      # dependency across all of this repo's workflows.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
