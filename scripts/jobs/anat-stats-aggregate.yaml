# One-off in-region run of scripts/aggregate_anat_stats.py.
# See docs/anatomical-stats.md → "Running it inside AWS" for the full procedure.
#
# Why a Job and not a laptop run: the aggregation is ~650k small S3 GETs, so it
# is bound by per-request latency. From a laptop it measured ~3.4 h; in-region,
# ~69 min (2026-09-22, 11,808 subjects).
#
# No image build is needed. cloudpipe-flow-runner already carries boto3 and
# pyarrow; the code is mounted from two ConfigMaps built from the checkout:
#
#   kubectl -n argo-workflows create configmap anat-stats-src \
#     --from-file=src/anat_stats/__init__.py --from-file=src/anat_stats/aggregate.py \
#     --from-file=src/anat_stats/discovery.py --from-file=src/anat_stats/parsers.py \
#     --from-file=src/anat_stats/qc.py
#   kubectl -n argo-workflows create configmap anat-stats-script \
#     --from-file=scripts/aggregate_anat_stats.py
#   pixi run -e ops bash -c 'envsubst < scripts/jobs/anat-stats-aggregate.yaml | kubectl apply -f -'
#
# `image:` is the one value Kubernetes cannot read from a ConfigMap, so it is a
# ${CLOUDPIPE_ECR_REGISTRY} placeholder that envsubst fills; `pixi run -e ops`
# exports that variable from the same cloudpipe-config ConfigMap the bucket comes
# from (scripts/cloudpipe-env.sh). The bucket and region are read in-cluster —
# see the env block below.
#
# Output lands in s3://$CLOUDPIPE_BUCKET/scratch/anat-stats-aggregate/, which the
# bucket's scratch/ lifecycle rule DELETES AFTER 7 DAYS. Copy it down (or
# elsewhere) when the Job completes. QC (--with-qc) is deliberately not run here:
# it is an Athena query, which runs in AWS wherever it is issued from.
#
# Clean up after: the Job removes itself a day after finishing
# (ttlSecondsAfterFinished); delete the two ConfigMaps by hand.
apiVersion: batch/v1
kind: Job
metadata:
  name: anat-stats-aggregate
  namespace: argo-workflows
  labels:
    app: anat-stats-aggregate
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: anat-stats-aggregate
    spec:
      # Pod Identity role with read on the data bucket and write to scratch/.
      serviceAccountName: argo-workflows-runner
      restartPolicy: Never
      # cloudpipe-flow-runner is built for linux/arm64 only.
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: aggregate
          image: ${CLOUDPIPE_ECR_REGISTRY}/cloudpipe/cloudpipe-flow-runner:latest
          imagePullPolicy: Always
          workingDir: /work
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            # Read by scripts/aggregate_anat_stats.py and by the upload step below,
            # from the ConfigMap Terraform writes — the same source the production
            # WorkflowTemplates default their `bucket` parameter from.
            - name: CLOUDPIPE_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: cloudpipe-config
                  key: bucket
            # ConfigMap files are symlinks into a hidden ..<timestamp>/ directory,
            # so the script's own Path(__file__).resolve().parent.parent lands in
            # the wrong place and `import anat_stats` fails. Set the path directly.
            - name: PYTHONPATH
              value: /work/src
          command: ["bash", "-euo", "pipefail", "-c"]
          args:
            - |
              python scripts/aggregate_anat_stats.py --out /out --workers 64
              python - <<'EOF'
              import os, pathlib
              import boto3
              # No region_name: Pod Identity sets AWS_REGION on this pod.
              s3 = boto3.client("s3")
              bucket = os.environ["CLOUDPIPE_BUCKET"]
              files = sorted(pathlib.Path("/out").iterdir())
              for f in files:
                  s3.upload_file(str(f), bucket, f"scratch/anat-stats-aggregate/{f.name}")
              print(f"uploaded {len(files)} files to s3://{bucket}/scratch/anat-stats-aggregate/")
              EOF
          # Measured: ~1 core (the parse is GIL-bound) and ~725 MiB.
          resources:
            requests: {cpu: "2", memory: 3Gi}
            limits: {memory: 6Gi}
          volumeMounts:
            - {name: src, mountPath: /work/src/anat_stats}
            - {name: script, mountPath: /work/scripts}
            - {name: out, mountPath: /out}
      volumes:
        - name: src
          configMap: {name: anat-stats-src}
        - name: script
          configMap: {name: anat-stats-script}
        - name: out
          emptyDir: {sizeLimit: 4Gi}
